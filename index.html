d[t.id]||list==='plan-search')?'▾':'▸',\n        children: ((s.expanded[t.id]||list==='plan-search')?flattenKids(t.id):[]).map(item=>{\n          const c=item.task, cKids=kids(c.id);\n          const cScope=SCOPES.filter(x=>x.key===c.scope)[0]||SCOPES[3];\n          const when=c.scope==='day' ? (c.date?prettyDate(c.date):'')\n            : ((c.startDate?prettyDate(c.startDate)+' → ':'')+(c.targetDate?prettyDate(c.targetDate):''));\n          return {\n            id:String(c.id), title:c.title, minutes:c.minutes,\n            done:c.done,\n            strike:(c.done||skippedOn(c, c.date||today))?'line-through':'none',\n            opacity:(c.done||skippedOn(c, c.date||today))?0.5:1,\n            note:c.note||'', hasNote:!!(c.note||''),\n            when,scopeLabel:cScope.label,indent:(24+(item.depth-1)*18)+'px',\n            effort:c.scope==='day'?(c.minutes+' min'):((c.dailyMinutes||45)+' min/day'),\n            carried:!!c.carried,\n            carriedLabel: c.carried && c.carryCount>1 ? ('carried ×'+c.carryCount) : 'carried',\n            toggle:()=>this.toggle(c.id),\n            remove:()=>this.askDeleteTask(c.id),\n            canBreak:!!cScope.child&&cKids.length===0,\n            breakLabel:cScope.child?this.breakLabelFor(c):'',\n            breakDown:()=>this.splitEvenly(c.id),\n          };\n        }),\n      };\n    };\n    /* Skipped and done are one state as far as a list is concerned: the row\n       is struck through and there is nothing left to do about it today. One\n       predicate decides both the strike and the sinking, so a row can never\n       look settled and sort as open, or the reverse. A skip belongs to a\n       date, so it counts only on the day it was made for. */\n    const skippedOn=(t,dateStr)=>!!t.skipReason && t.skippedOn===dateStr;\n    const settledOn=(t,dateStr)=>!!t.done || skippedOn(t,dateStr);\n\n    /* Order within a session: struck rows sink, whatever they are — a day you\n       have already ruled on should not sit between two things you still have\n       to do. Above the line, every timed task follows the clock; untimed\n       tasks follow the user's long-press order, and priority is only the\n       fallback for old rows with no stored order. Below it the same rules\n       apply again, so the settled block reads in its own sensible order. */\n    const PRI={High:0, Med:1, Low:2};\n    const rank=(a,b)=>{\n      const as=settledOn(a,viewDate), bs=settledOn(b,viewDate);\n      if(as!==bs) return as?1:-1;\n      const ae=!!a.at, be=!!b.at;\n      if(ae!==be) return ae?-1:1;\n      if(ae&&be) return String(a.at).localeCompare(String(b.at));\n      if(a.done!==b.done) return a.done?1:-1;\n      const ao=a.order==null?1e9:a.order, bo=b.order==null?1e9:b.order;\n      if(ao!==bo) return ao-bo;\n      const ap=PRI[a.priority]==null?1:PRI[a.priority], bp=PRI[b.priority]==null?1:PRI[b.priority];\n      return ap-bp || String(a.title).localeCompare(String(b.title));\n    };\n\n    /* ── TODAY: one date's three sessions ─────────────────────────────\n       `viewDate` is what the Today screen is looking at and follows the\n       shifter; `today` stays the real today, because the dashboard's rings and\n       block stats must not move when you glance at tomorrow. */\n    const today=todayISO();\n    const viewDate=s.dayOffset ? addDays(today, s.dayOffset) : today;\n    // undated rows are legacy; they belong to today, not to whatever you shift to\n    const dayTasks=s.tasks.filter(t=>t.scope==='day' && (!t.date || t.date===today));\n    const viewTasks=s.dayOffset\n      ? s.tasks.filter(t=>t.scope==='day' && t.date===viewDate)\n      : dayTasks;\n    const routinesToday=this.routinesFor(viewDate);\n    /* A day that has been ruled on has usually lost the work it missed: both\n       the review's destinations and the silent midnight carry move the task\n       object onto another date, and a task lives on exactly one date. So the\n       day it was actually missed on had nothing left to strike through — it\n       read as though nothing had ever been asked of it, which is the opposite\n       of the account this screen is supposed to give.\n\n       The history record is where that account survives, for reviewed days\n       (\"Too tired\") and for days the app merely rolled past (\"No reason\n       recorded\") alike. Replay it here, struck through with the reason as\n       written. Anything still living on this date is skipped — that row is\n       already on screen and already strikes itself. */\n    const viewRecord=s.history[viewDate];\n    const liveHere={};\n    viewTasks.forEach(t=>{ liveHere[String(t.id)]=true; });\n    const missedHere=((viewRecord||{}).skips||[]).filter(x=>!liveHere[String(x.taskId)]);\n    const blocks=BLOCKS.map(d=>{\n      const inBlock=viewTasks.filter(t=>t.block===d.key);\n      const ordered=inBlock.slice().sort(rank);\n      let first=false;\n      const tasks=ordered.map(t=>{\n        const isFirst=!t.done && t.type!=='event' && !first;\n        if(isFirst) first=true;\n        return mkRow(t, isFirst, 'day:'+d.key);\n      });\n      /* The day's own missed work, replayed out of its history record. Read\n         only on purpose: the task itself has moved on and lives on another\n         date now, so there is nothing here left to tick, skip or reorder —\n         only an account of what this session was asked for and did not do. */\n      const missed=missedHere.filter(x=>(x.block||'morning')===d.key).map(x=>({\n        id:'missed-'+d.key+'-'+x.taskId,\n        title:x.title||'Untitled',\n        reason:x.reason||'No reason recorded',\n        skipLabelText:'missed · '+(x.reason||'No reason recorded'),\n        meta:(x.minutes||0)+' min planned, not done',\n      }));\n      /* Routines occupy the session too — the capacity bar has to know — and\n         they settle exactly the way a task does. `settledOn` was written for\n         tasks and only tasks: a routine's strike tested `done` alone, so a\n         skipped routine kept its full-strength text, and nothing ever sorted\n         the routine list at all, so it also kept its place at the top of the\n         session. A skipped gym session sat above everything still to do,\n         reading like the next thing on the list.\n\n         One predicate, both jobs, same as the task rows: struck and sunk\n         together, so a row can never look settled and sort as open. */\n      const settledRoutineOn=r=>!!(r.done||{})[viewDate] || !!(r.skipped||{})[viewDate];\n      const rsAll=routinesToday.filter(r=>r.block===d.key).map(r=>{\n        const done=!!(r.done||{})[viewDate];\n        const skipped=(r.skipped||{})[viewDate]||'';\n        const settled=done||!!skipped;\n        return {\n        id:r.id, title:r.title, note:r.note||'', minutes:r.minutes,\n        // the recorded time, once there is one — same as a task's \"took 65\"\n        meta: (r.minutes+' min')\n          + ((r.actual||{})[viewDate] ? (' · took '+(r.actual||{})[viewDate]) : ''),\n        done, settled,\n        dotBg:done?'var(--color-accent)':'transparent',\n        dotBorder:done?'var(--color-accent)':'var(--color-neutral-400)',\n        checkOpacity:done?1:0,\n        // a skipped routine reads exactly like a finished one, as a skipped\n        // task already does: ruled on, struck out, nothing left to do today\n        textOpacity:settled?0.5:1,\n        strike:settled?'line-through':'none',\n        isSkipped: !!skipped,\n        skipReason: skipped,\n        skipLabelText:'skipped · '+skipped,\n        skipLabel: skipped ? 'Unskip' : 'Skip',\n        skip: ()=> skipped\n          ? this.skipRoutine(r.id, viewDate, null)\n          : this.openSkipForm('routine', r.id, viewDate),\n        anim:(Date.now()-(this._pop[r.id]||0)<600)?'pop .45s ease':'none',\n        hasNote:!!(r.note||''),\n        toggle:()=>this.toggleRoutine(r.id, viewDate),\n        };\n      });\n      /* Settled routines render below the tasks rather than merely at the\n         bottom of their own list: the two are separate `sc-for`s, so a\n         routine cannot interleave with tasks, and leaving them above would\n         put a struck row over work still to be done. */\n      const rs=rsAll.filter(r=>!r.settled);\n      const rsSettled=rsAll.filter(r=>r.settled);\n      const capacity=s.capacity[d.key]||0;\n      // Completing work uses session time; it must not make the capacity bar\n      // shrink. Finished tasks contribute actual time, open tasks their\n      // estimate, and completed routines retain their planned duration.\n      const assigned=inBlock.filter(t=>!(t.skippedOn===viewDate && t.skipReason))\n        .reduce((a,t)=>a+(t.done?(t.actual==null?t.minutes:t.actual):t.minutes),0)\n        // every routine the session holds, settled or not — rsAll, because rs\n        // is now only the open half and a kept routine still spent its minutes\n        + rsAll.filter(r=>!r.isSkipped).reduce((a,r)=>a+r.minutes,0);\n      const over=capacity>0 && assigned>capacity;\n      const h=s.hours[d.key]||{from:'',to:''};\n      const skin=BLOCK_SKIN[d.key]||BLOCK_SKIN.morning;\n      return {key:d.key, label:d.label, time:fmt(h.from)+' – '+fmt(h.to),\n        cardBg:skin.bg, cardInk:skin.ink, fillOpacity: over?0.55:0.85,\n        routines:rs, hasRoutines:rs.length>0,\n        routinesSettled:rsSettled, hasRoutinesSettled:rsSettled.length>0,\n        tasks, missed, hasMissed:missed.length>0,\n        capacity, assigned, over, overBy:Math.max(0,assigned-capacity),\n        fillPct: capacity>0?Math.min(100,Math.round(assigned/capacity*100)):0,\n        fillColor: over?'var(--color-accent-2)':'var(--color-accent)',\n        numeralColor: over?'var(--color-accent-2-800)':'var(--color-accent-700)',\n      };\n    // a session whose only content is what it missed is still a session that\n    // was asked for something, and hiding it is what made the day read empty\n    }).filter(b=>b.tasks.length || b.routines.length\n      || b.routinesSettled.length || b.missed.length);\n\n    /* The two tiles at the top of Today are the whole day added up, and the\n       session cards below only appear for sessions that have something in\n       them — so a day whose only work is in the morning shows one card, and\n       the day figure reads as if it were the morning's. This strip is the\n       missing middle: every session, every day, used against planned.\n\n       \"Used\" is real time — the recorded actual where there is one, the\n       estimate where the work is done but was never timed. \"Planned\" is what\n       the session was asked to hold, tasks and routines alike. Capacity (the\n       hours you told Settings you have) is shown beside it, because being\n       under your plan and over your hours are different problems. */\n    const sessionUse=BLOCKS.map(b=>{\n      const own=viewTasks.filter(t=>(t.block||'morning')===b.key);\n      const rs=routinesToday.filter(r=>(r.block||'morning')===b.key);\n      // the day's missed work counts as planned even though it has moved on:\n      // the session was asked for those minutes and delivered none of them\n      const planned=own.reduce((a,t)=>a+(t.minutes||0),0)\n        + rs.reduce((a,r)=>a+(Number(r.minutes)||0),0)\n        + missedHere.filter(x=>(x.block||'morning')===b.key)\n            .reduce((a,x)=>a+(Number(x.minutes)||0),0);\n      const used=own.filter(t=>t.done)\n          .reduce((a,t)=>a+(t.actual==null?(t.minutes||0):t.actual),0)\n        + rs.filter(r=>(r.done||{})[viewDate])\n          .reduce((a,r)=>a+(Number((r.actual||{})[viewDate])||Number(r.minutes)||0),0);\n      const cap=s.capacity[b.key]||0;\n      return {\n        key:b.key, label:b.label,\n        text: planned||used ? (hm(used)+' / '+hm(planned)) : 'nothing planned',\n        capText: cap? ('of '+hm(cap)+' available') : '',\n        pct: planned? Math.min(100, Math.round(used/planned*100)) : 0,\n        over: cap>0 && used>cap,\n        color: cap>0 && used>cap ? 'var(--color-accent-2)'\n          : used>=planned && planned>0 ? 'var(--color-accent)'\n          : 'var(--color-accent-400)',\n      };\n    });\n    const routinesReal=s.dayOffset ? this.routinesFor(today) : routinesToday;\n    const rDone=routinesReal.filter(r=>(r.done||{})[today]).length;\n    const dayTotal=dayTasks.length+routinesReal.length;\n    const dayDone=dayTasks.filter(t=>t.done).length+rDone;\n    const dayPlanned=dayTasks.reduce((a,t)=>a+(t.minutes||0),0)\n      + routinesReal.reduce((a,r)=>a+(r.minutes||0),0);\n    const dayEarned=dayTasks.filter(t=>t.done).reduce((a,t)=>a+(t.actual||t.minutes||0),0)\n      + routinesReal.filter(r=>(r.done||{})[today]).reduce((a,r)=>a+(r.minutes||0),0);\n    const dayPct= dayPlanned>0 ? Math.min(100, Math.round(dayEarned/dayPlanned*100))\n                               : pct(dayDone, dayTotal);\n    // the Today screen's own tallies, which do follow the shifter\n    const vDone=viewTasks.filter(t=>t.done).length\n      + routinesToday.filter(r=>(r.done||{})[viewDate]).length;\n    // work this date was asked for and lost to a carry still belongs to its\n    // totals; leaving it out is what made a reviewed day read as empty\n    const vTotal=viewTasks.length+routinesToday.length+missedHere.length;\n    const vPlanned=viewTasks.reduce((a,t)=>a+(t.minutes||0),0)\n      + routinesToday.reduce((a,r)=>a+(r.minutes||0),0)\n      + missedHere.reduce((a,x)=>a+(Number(x.minutes)||0),0);\n    const vActual=viewTasks.filter(t=>t.done).reduce((a,t)=>a+(t.actual==null?(t.minutes||0):t.actual),0)\n      + routinesToday.filter(r=>(r.done||{})[viewDate])\n          .reduce((a,r)=>a+(Number((r.actual||{})[viewDate])||Number(r.minutes)||0),0);\n    const carriedOver=viewTasks.filter(t=>t.carried && !t.done).length;\n\n    /* ── PLAN: one date-first list; scope belongs to the breakdown ───── */\n    const planQuery=String(s.planSearch||'').trim().toLocaleLowerCase();\n    const planSearching=planQuery.length>0;\n    const searchText=t=>{\n      const parent=t.parent?s.tasks.filter(x=>x.id===t.parent)[0]:null;\n      return [t.title,t.note,parent&&parent.title,t.goalId&&goalName(t.goalId)]\n        .filter(Boolean).join(' ').toLocaleLowerCase();\n    };\n    /* Plan is a list of what is left to do, so **anything struck sinks** —\n       finished and skipped alike. It used to sort by date first, which\n       interleaved settled work through the dates and made the next thing to\n       do something you had to hunt for. Open work comes first and stays\n       date-ordered; the settled block keeps its own date order underneath,\n       still there to look at, no longer in the way. */\n    const planSettled=t=>!!t.done || (t.scope==='day' && skippedOn(t, t.date||today));\n    const planRank=(a,b)=>{\n      return Number(planSettled(a))-Number(planSettled(b))\n        || String(taskDate(a)).localeCompare(String(taskDate(b)))\n        || String(a.title).localeCompare(String(b.title));\n    };\n    const allIds=new Set(s.tasks.map(t=>String(t.id)));\n    const planRoots=s.tasks.filter(t=>!t.parent||!allIds.has(String(t.parent)));\n    const treeSearch=t=>[searchText(t)].concat(flattenKids(t.id).map(x=>searchText(x.task))).join(' ');\n    /* Badge chips narrow the list without changing it. A parent whose own\n       badge is unset still shows when one of its parts carries the badge —\n       filtering a tree on the root alone hides work that does match. */\n    const badgeFilter=s.badgeFilter||'';\n    const treeBadges=t=>[t.badgeId].concat(flattenKids(t.id).map(x=>x.task.badgeId));\n    const planTasks=planRoots\n      .filter(t=>!planSearching||treeSearch(t).includes(planQuery))\n      .filter(t=>!badgeFilter||treeBadges(t).indexOf(badgeFilter)>-1)\n      .slice().sort(planRank);\n    const planRows=planTasks.map((t,i)=>mkRow(t,i===0&&!t.done,planSearching?'plan-search':'plan'));\n    const planOpen=planTasks.filter(t=>!planSettled(t)).length;\n    const planDone=planRoots.filter(t=>t.done).length;\n    const planTotal=planRoots.length;\n    const badgeChips=[{id:'', name:'All', tone:null}].concat(s.badges||[]).map(b=>{\n      const on = b.id===badgeFilter;\n      const count = b.id\n        ? planRoots.filter(t=>!planSettled(t) && treeBadges(t).indexOf(b.id)>-1).length\n        : planRoots.filter(t=>!planSettled(t)).length;\n      return {\n        id:b.id, label:b.name, count:count?String(count):'',\n        bg: on ? (b.id?badgeBg(b.tone):'var(--color-accent)') : 'transparent',\n        fg: on ? (b.id?badgeFg(b.tone):'var(--color-bg)') : 'var(--color-text)',\n        border: on ? 'transparent'\n          : (b.id?badgeBg(b.tone):'var(--color-divider)'),\n        pick:()=>b.id?this.setBadgeFilter(b.id):this.setState({badgeFilter:''}),\n      };\n    });\n\n    /* ── DASHBOARD ────────────────────────────────────────────────────── */\n    /* A real month grid. Marked days are the ones worth looking at: a target\n       falling due, work scheduled, or a day already recorded. */\n    /* The grid was pinned to the current month, so any date outside it was\n       simply unreachable — the day strip only spans a fortnight. monthOffset\n       walks it, and the pMonth window below still uses the real month so the\n       progress figures do not follow the browsing. */\n    const curReal=parseISO(today);\n    const cur=new Date(curReal.getFullYear(), curReal.getMonth()+(s.monthOffset||0), 1);\n    const monthStart=iso(new Date(cur.getFullYear(), cur.getMonth(), 1));\n    const monthDays=new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();\n    const lead=dowIndex(monthStart);\n    const targetsOn={}, workOn={};\n    s.tasks.forEach(t=>{\n      if(t.targetDate) targetsOn[t.targetDate]=(targetsOn[t.targetDate]||0)+1;\n      if(t.scope==='day' && t.date) workOn[t.date]=(workOn[t.date]||0)+1;\n    });\n    /* A dot said only \"something is on this day\". The count says how much, and\n       the cell is the way in: tapping one opens Today on that date, however far\n       off it is — the day strip only reaches a fortnight. Routines are not\n       counted; they repeat by weekday and are a rhythm, not that day's work. */\n    const calendar=[];\n    for(let i=0;i<lead;i++) calendar.push({blank:true, label:'', bg:'transparent',\n      fg:'transparent', weight:400, ring:'transparent', count:'', countColor:'transparent',\n      pick:()=>{}, aria:''});\n    for(let d=1; d<=monthDays; d++){\n      const ds=iso(new Date(cur.getFullYear(), cur.getMonth(), d));\n      const isToday=ds===today, tgt=targetsOn[ds]||0, work=workOn[ds]||0;\n      const rec=s.history[ds];\n      const offset=daysBetween(today, ds);\n      calendar.push({\n        blank:false, label:String(d),\n        bg: isToday?'var(--color-accent)': tgt?'var(--color-accent-2-100)':'transparent',\n        fg: isToday?'var(--color-bg)': tgt?'var(--color-accent-2-800)':'var(--color-text)',\n        weight: isToday||tgt?700:400,\n        ring: rec && rec.total && rec.finished===rec.total ? 'var(--color-accent)':'transparent',\n        count: work?String(work):'',\n        countColor: isToday?'var(--color-bg)'\n          : tgt?'var(--color-accent-2-800)':'var(--color-accent-700)',\n        aria: prettyDate(ds)+(work?(', '+work+' task'+(work===1?'':'s')):', nothing planned'),\n        pick:()=>this.openDay(ds),\n      });\n    }\n    const monthLabel=MONTHS[cur.getMonth()]+' '+cur.getFullYear();\n\n    /* Progress at all three zooms, each over its own real window. */\n    /* Counting tasks made a five-minute errand worth as much as a three-hour\n       sitting. The minutes were already stored and the capacity bars already\n       used them; only the percentage was still counting heads. It is weighted\n       by planned minutes now, with the count kept for the \"3 of 7\" line. */\n    const period=(fromDate)=>{\n      // A reviewed date exists in history and may still retain completed live\n      // tasks. Excluding those rows prevents counting the same work twice.\n      const inWin=s.tasks.filter(t=>t.scope==='day' && t.date && t.date>=fromDate && t.date<=today\n        && !s.history[t.date]);\n      const hist=Object.keys(s.history).filter(d=>d>=fromDate && d<=today).map(d=>s.history[d]);\n      const total=inWin.length + hist.reduce((a,h)=>a+(h.total||0),0);\n      const done=inWin.filter(t=>t.done).length + hist.reduce((a,h)=>a+(h.finished||0),0);\n      const mins=inWin.filter(t=>t.done).reduce((a,t)=>a+(t.actual||t.minutes),0)\n        + hist.reduce((a,h)=>a+(h.done||0),0);\n      const planned=inWin.reduce((a,t)=>a+(t.minutes||0),0)\n        + hist.reduce((a,h)=>a+(h.planned||0),0);\n      return {total, done, planned,\n        pct: planned>0 ? Math.min(100, Math.round(mins/planned*100)) : pct(done,total),\n        hours:(mins/60).toFixed(1)};\n    };\n    const pDay=period(today);\n    const pWeek=period(startOfWeek(today));\n    const pMonth=period(iso(new Date(curReal.getFullYear(), curReal.getMonth(), 1)));\n    const pendingReviewDate=Object.keys(s.history).filter(d=>d<today && s.history[d]\n      && s.history[d].reviewed===false).sort().reverse()[0]||'';\n    const targetsSoon=s.tasks.filter(t=>t.targetDate && !t.done && daysBetween(today,t.targetDate)<=14)\n      .sort((a,b)=>String(a.targetDate).localeCompare(String(b.targetDate)))\n      .slice(0,4).map(t=>{\n        const left=daysBetween(today,t.targetDate);\n        return {title:t.title, when:prettyDate(t.targetDate),\n          scopeLabel:(SCOPES.filter(x=>x.key===t.scope)[0]||{label:''}).label,\n          left: left<0?('overdue '+(-left)+'d'): left===0?'today':(left+'d'),\n          color: left<=2?'var(--color-accent-2-800)':'var(--color-accent-700)'};\n      });\n\n    /* The week strip is derived, not stored: past days come out of history,\n       today and anything scheduled ahead out of the live task list. */\n    const weekStart=startOfWeek(today);\n    const dayStats=DAYS.map((label,i)=>{\n      const ds=addDays(weekStart,i);\n      const rec=s.history[ds];\n      if(rec && ds<today) return {d:label, ds, planned:rec.planned||0, done:rec.done||0};\n      const on=s.tasks.filter(t=>t.scope==='day' && (t.date||today)===ds);\n      return {d:label, ds,\n        planned:on.reduce((a,t)=>a+t.minutes,0),\n        done:on.filter(t=>t.done).reduce((a,t)=>a+(t.actual||t.minutes),0)};\n    });\n    const wPlanned=dayStats.reduce((a,w)=>a+w.planned,0);\n    const wDone=dayStats.reduce((a,w)=>a+w.done,0);\n    const maxLoad=Math.max.apply(null, dayStats.map(w=>Math.max(w.planned,w.done)).concat([1]));\n    const week=dayStats.map(w=>({\n      d:w.d,\n      plannedH:Math.round(w.planned/maxLoad*94), doneH:Math.round(w.done/maxLoad*94),\n      doneColor: w.done>=w.planned&&w.done>0?'var(--color-accent)':w.done>0?'var(--color-accent-400)':'transparent',\n      weight: w.ds===today?700:400,\n      labelColor: w.ds===today?'var(--color-accent)': s.office[w.d]?'var(--color-text)':'var(--color-accent-2)',\n    }));\n\n    /* This week's accountability uses closed history for reviewed/past days\n       and live tasks for today. Future work is deliberately excluded: it is\n       planned, but it has not had a chance to be done or skipped yet. */\n    const accountabilityDates=[];\n    for(let d=weekStart; d<=today; d=addDays(d,1)) accountabilityDates.push(d);\n    const accountabilityRecords=accountabilityDates.map(ds=>{\n      if(s.history[ds]) return s.history[ds];\n      const on=s.tasks.filter(t=>t.scope==='day' && (t.date||today)===ds);\n      // Open work today is still pending, not skipped. Only a review or a\n      // midnight rollover closes it as a skip event.\n      return {...dayHistoryRecord(on, {}, 'No reason recorded', false),\n        ...routineHistoryRecord(s.routines,ds,false)};\n    });\n    const accountability={\n      planned:accountabilityRecords.reduce((a,h)=>a+(h.total||0)+(h.routineTotal||0),0),\n      done:accountabilityRecords.reduce((a,h)=>a+(h.finished||0)+(h.routineDone||0),0),\n      skipped:accountabilityRecords.reduce((a,h)=>a+(h.skipped||0)+(h.routineSkipped||0),0),\n    };\n    const skipEvents=accountabilityRecords.reduce((all,h)=>\n      all.concat(h.skips||[],h.routineSkips||[]),[]);\n    const skipPlaces=BLOCKS.map(b=>{\n      const count=skipEvents.filter(x=>(x.block||'morning')===b.key).length;\n      return {label:b.label, count,\n        pct:accountability.skipped?Math.round(count/accountability.skipped*100):0};\n    }).filter(x=>x.count>0);\n\n    // where the day actually goes, session by session — this is the \"what to\n    // improve\" signal that does not need any data the user has not entered\n    const blockStats=BLOCKS.map(b=>{\n      const inB=dayTasks.filter(t=>t.block===b.key);\n      const d=inB.filter(t=>t.done).length;\n      const cap=s.capacity[b.key]||0;\n      const load=inB.filter(t=>!t.done).reduce((a,t)=>a+t.minutes,0);\n      return {key:b.key, label:b.label, total:inB.length, done:d,\n        pct:pct(d,inB.length), cap, load,\n        barPct: cap>0?Math.min(100,Math.round(load/cap*100)):0,\n        color: cap>0&&load>cap?'var(--color-accent-2)':'var(--color-accent)',\n        note: inB.length===0 ? 'nothing planned'\n            : cap>0&&load>cap ? (load-cap)+' min over'\n            : d===inB.length ? 'all clear' : (inB.length-d)+' left'};\n    });\n\n    const reasonLabels=Array.from(new Set(REASONS.concat(SKIP_REASONS,\n      skipEvents.some(x=>x.reason==='No reason recorded')?['No reason recorded']:[],\n      skipEvents.some(x=>x.reason==='Not completed')?['Not completed']:[])));\n    const reasonCounts=reasonLabels.map(r=>{\n      const c=skipEvents.filter(x=>x.reason===r).length;\n      return {label:r, count:c, color:c?'var(--color-accent)':'var(--color-neutral-400)'};\n    }).filter(x=>x.count>0);\n    const topReason=reasonCounts.slice().sort((a,b)=>b.count-a.count)[0];\n\n    const weakCards=s.cards.slice().sort((a,b)=>a.strength-b.strength).slice(0,3)\n      .map(c=>({heading:c.heading, strength:c.strength,\n        group:(s.groups.filter(g=>g.id===c.groupId)[0]||{name:''}).name,\n        color: c.strength>=70?'var(--color-accent)':c.strength>=40?'var(--color-accent-400)':'var(--color-accent-2)'}));\n\n    /* ── GROWTH: what four weeks of days actually say ──────────────────\n       Everything here is read back out of days that have already happened.\n       A closed day is its history record; a day still open is derived from its\n       live tasks the same way, so today counts without being counted twice.\n       A date nothing was ever asked of returns null and is left out entirely —\n       a rest day is not a failure, and averaging it in would say it was. */\n    const dayRecord=ds=>{\n      if(s.history[ds]) return s.history[ds];\n      const on=s.tasks.filter(t=>t.scope==='day' && (t.date||today)===ds);\n      const rt=routineHistoryRecord(s.routines, ds, false);\n      if(!on.length && !rt.routineTotal) return null;\n      return {...dayHistoryRecord(on, {}, 'No reason recorded', false), ...rt};\n    };\n    const WINDOW=28;\n    const growthDays=[];\n    for(let i=WINDOW-1;i>=0;i--){\n      const ds=addDays(today,-i), rec=dayRecord(ds);\n      if(rec) growthDays.push({ds, rec});\n    }\n    const sum=(list,pick)=>list.reduce((a,x)=>a+(Number(pick(x))||0),0);\n    const rateOf=list=>{\n      const total=sum(list,x=>x.rec.total), fin=sum(list,x=>x.rec.finished);\n      return total? Math.round(fin/total*100) : null;\n    };\n    /* Four seven-day blocks, oldest first, each labelled by how long ago it\n       is rather than by date — \"3 wks ago\" reads faster than a range. */\n    const growthWeeks=[3,2,1,0].map(back=>{\n      const from=addDays(today,-(back*7+6)), to=addDays(today,-back*7);\n      const list=growthDays.filter(x=>x.ds>=from && x.ds<=to);\n      const r=rateOf(list);\n      return {back, from, to, list, rate:r,\n        minutes:sum(list,x=>x.rec.done)+sum(list,x=>x.rec.routineDoneMinutes),\n        tasks:sum(list,x=>x.rec.finished),\n        planned:sum(list,x=>x.rec.total)};\n    });\n    const liveWeeks=growthWeeks.filter(w=>w.rate!=null);\n    const thisWeekRate=growthWeeks[3].rate, lastWeekRate=growthWeeks[2].rate;\n    const growthDelta = thisWeekRate!=null && lastWeekRate!=null\n      ? thisWeekRate-lastWeekRate : null;\n    const maxWeekMin=Math.max.apply(null, growthWeeks.map(w=>w.minutes).concat([1]));\n    const growthBars=growthWeeks.map(w=>({\n      label: w.back===0?'This wk' : w.back===1?'Last wk' : (w.back+' wks'),\n      pct: w.rate==null?0:w.rate,\n      pctText: w.rate==null?'—':(w.rate+'%'),\n      hoursText: w.minutes? (w.minutes>=60?((w.minutes/60).toFixed(1)+'h'):(w.minutes+'m')) : '—',\n      h: Math.max(2, Math.round(w.minutes/maxWeekMin*70)),\n      color: w.back===0?'var(--color-accent)':'var(--color-accent-400)',\n      weight: w.back===0?700:400,\n    }));\n    const growthHeadline = liveWeeks.length<2 || growthDelta==null\n      ? 'Two weeks of days and this starts comparing them.'\n      : growthDelta>=8 ? ('Up '+growthDelta+' points on last week — the trend is real, keep the same shape of week.')\n      : growthDelta<=-8 ? ('Down '+Math.abs(growthDelta)+' points on last week. Something changed; the reasons below usually say what.')\n      : 'Holding steady, within a few points of last week.';\n\n    /* Where the work goes well and where it does not. Both come out of the\n       same per-session and per-weekday tallies; a signal is only reported once\n       it has enough days behind it to mean anything. */\n    const MIN_SAMPLE=4;\n    const sessionScore=BLOCKS.map(b=>{\n      const planned=sum(growthDays,x=>((x.rec.byBlock||{})[b.key]||{}).planned);\n      const done=sum(growthDays,x=>((x.rec.byBlock||{})[b.key]||{}).done);\n      return {key:b.key, label:b.label, planned, done,\n        rate: planned?Math.round(done/planned*100):null};\n    }).filter(x=>x.planned>=MIN_SAMPLE);\n    const bestSession=sessionScore.slice().sort((a,b)=>b.rate-a.rate)[0];\n    const worstSession=sessionScore.slice().sort((a,b)=>a.rate-b.rate)[0];\n    const dowScore=DAYS.map((label,i)=>{\n      const list=growthDays.filter(x=>dowIndex(x.ds)===i);\n      const planned=sum(list,x=>x.rec.total), done=sum(list,x=>x.rec.finished);\n      return {label, planned, done, rate: planned?Math.round(done/planned*100):null};\n    }).filter(x=>x.planned>=MIN_SAMPLE);\n    const bestDow=dowScore.slice().sort((a,b)=>b.rate-a.rate)[0];\n    const worstDow=dowScore.slice().sort((a,b)=>a.rate-b.rate)[0];\n\n    // How often a day that asked for something got something.\n    const activeDays=growthDays.filter(x=>x.rec.total>0);\n    const showedUp=activeDays.filter(x=>x.rec.finished>0).length;\n    const consistency=activeDays.length?Math.round(showedUp/activeDays.length*100):null;\n\n    /* Estimation: only completed tasks that recorded an actual can answer it.\n       Completed tasks stay on their own date, so this survives a review. */\n    const windowFrom=addDays(today,-(WINDOW-1));\n    const timed=s.tasks.filter(t=>t.scope==='day' && t.done && t.actual\n      && t.date && t.date>=windowFrom && t.date<=today);\n    /* Routines record their actual minutes as well, and an hour at the gym\n       that always runs to ninety is exactly the kind of thing this figure is\n       supposed to catch. Each kept date with a recorded actual counts once. */\n    const timedRoutines=[];\n    (s.routines||[]).forEach(r=>{\n      const acts=r.actual||{};\n      Object.keys(acts).forEach(d=>{\n        if(d<windowFrom || d>today) return;\n        if(!(r.done||{})[d]) return;\n        const a=Number(acts[d]);\n        if(a>0 && Number(r.minutes)>0) timedRoutines.push({minutes:r.minutes, actual:a});\n      });\n    });\n    const measured=timed.concat(timedRoutines);\n    const estPlanned=sum(measured,t=>t.minutes), estActual=sum(measured,t=>t.actual);\n    const estBias = measured.length>=5 && estPlanned\n      ? Math.round((estActual-estPlanned)/estPlanned*100) : null;\n\n    /* ── WHICH KIND OF WORK ACTUALLY FINISHES ──────────────────────────\n       The Growth figures above are the day's whole ledger, and one number\n       over everything hides the thing worth knowing: office work landing at\n       90% while personal work lands at 30% is not a 60% problem, it is two\n       different problems, and only one of them is about the work.\n\n       Counted off the tasks rather than the day records, because a badge is\n       carried by the task: a task that has been carried three times is still\n       the same piece of work under the same badge, and the day records never\n       held a badge at all. Same four weeks as everything else here. Routines\n       have no badge and are not in this; nor is a target until it has been\n       broken down into the day tasks that do the work. */\n    const badgeWindow=s.tasks.filter(t=>t.scope==='day' && t.date\n      && t.date>=windowFrom && t.date<=today);\n    const badgeRow=(id,name,tone,own)=>{\n      const fin=own.filter(t=>t.done);\n      return {id, name, total:own.length, done:fin.length,\n        minutes:fin.reduce((a,t)=>a+(t.actual==null?(t.minutes||0):t.actual),0),\n        rate: own.length?Math.round(fin.length/own.length*100):0,\n        bg:badgeBg(tone), fg:badgeFg(tone)};\n    };\n    const badgeSplit=(s.badges||[]).map(bd=>\n        badgeRow(bd.id, bd.name, bd.tone, badgeWindow.filter(t=>t.badgeId===bd.id)))\n      .filter(x=>x.total>0);\n    const noBadgeWork=badgeWindow.filter(t=>!t.badgeId || !badgeOf(t.badgeId));\n    if(noBadgeWork.length)\n      badgeSplit.push(badgeRow('', 'No badge', null, noBadgeWork));\n    badgeSplit.sort((a,b)=>b.total-a.total);\n    const badgeBars=badgeSplit.map(x=>({\n      name:x.name, bg:x.bg, fg:x.fg,\n      pct:x.rate, pctText:x.rate+'%',\n      countText:x.done+' of '+x.total+(x.total===1?' task':' tasks'),\n      hoursText:x.minutes?hm(x.minutes):'—',\n      barColor: x.rate>=70?'var(--color-accent)'\n        : x.rate>=40?'var(--color-accent-400)':'var(--color-accent-2)',\n    }));\n    /* A comparison needs two badges with enough work behind them to mean\n       anything; below that the honest thing is to say what is there. */\n    const badgeRanked=badgeSplit.filter(x=>x.total>=MIN_SAMPLE)\n      .slice().sort((a,b)=>b.rate-a.rate);\n    const badgeBest=badgeRanked[0], badgeWorst=badgeRanked[badgeRanked.length-1];\n    const badgeHeadline = badgeRanked.length>=2 && badgeBest.rate-badgeWorst.rate>=15\n      ? (badgeBest.name+' finishes at '+badgeBest.rate+'%, '+badgeWorst.name\n         +' at '+badgeWorst.rate+'%. The gap is where your attention actually goes.')\n      : badgeSplit.length>1\n      ? 'Every badge is finishing at about the same rate — the split is even.'\n      : 'Give tasks a badge and this splits your four weeks by the kind of work.';\n\n    // Debt: what keeps arriving on a new day without ever being finished.\n    const carrying=s.tasks.filter(t=>t.scope==='day' && !t.done && t.carried);\n    const stubborn=carrying.slice().sort((a,b)=>(b.carryCount||1)-(a.carryCount||1))[0];\n    const carryMins=sum(carrying,t=>t.minutes);\n\n    const routinePlanned=sum(growthDays,x=>x.rec.routineTotal);\n    const routineKept=sum(growthDays,x=>x.rec.routineDone);\n    const routineRate=routinePlanned?Math.round(routineKept/routinePlanned*100):null;\n\n    const rated=growthDays.filter(x=>Number.isFinite(x.rec.satisfaction));\n    const avgSatisfaction=rated.length\n      ? Math.round(sum(rated,x=>x.rec.satisfaction)/rated.length*10)/10 : null;\n\n    // Reasons across the whole window, not just this week — a pattern needs\n    // more than five days to be one.\n    const windowSkips=growthDays.reduce((all,x)=>\n      all.concat(x.rec.skips||[], x.rec.routineSkips||[]),[]);\n    const windowReasons=Array.from(new Set(windowSkips.map(x=>x.reason)))\n      .map(r=>({label:r, count:windowSkips.filter(x=>x.reason===r).length}))\n      .sort((a,b)=>b.count-a.count);\n    const windowTopReason=windowReasons[0];\n\n    const pctText=v=>v==null?'—':(v+'%');\n    /* Strengths and weak spots are the same measurements read in both\n       directions; a measurement earns a place in one list or the other, never\n       in both, and only when it is decisively good or bad. */\n    const strengths=[], weakSpots=[];\n    if(bestSession && bestSession.rate>=70)\n      strengths.push({label:bestSession.label+' is your best session',\n        detail:pctText(bestSession.rate)+' of what you put there gets finished. Give it the work that matters.'});\n    if(badgeBest && badgeBest.rate>=75)\n      strengths.push({label:badgeBest.name+' work gets done',\n        detail:pctText(badgeBest.rate)+' of it finished over four weeks — '\n          +badgeBest.done+' of '+badgeBest.total+' tasks.'});\n    if(bestDow && bestDow.rate>=70)\n      strengths.push({label:bestDow.label+' is your strongest day',\n        detail:pctText(bestDow.rate)+' finished. Heavy work belongs here.'});\n    if(consistency!=null && consistency>=70)\n      strengths.push({label:'You show up',\n        detail:'Something got finished on '+consistency+'% of the days that asked for anything.'});\n    if(s.streak>=3)\n      strengths.push({label:s.streak+'-day streak',\n        detail:'Best run so far is '+(s.streakBest||s.streak)+' days.'});\n    if(estBias!=null && Math.abs(estBias)<=15)\n      strengths.push({label:'Your estimates are honest',\n        detail:'Actual time lands within '+Math.abs(estBias)+'% of what you planned, across '+measured.length+' measured items.'});\n    if(routineRate!=null && routineRate>=80)\n      strengths.push({label:'Routines are holding',\n        detail:routineKept+' of '+routinePlanned+' kept in four weeks.'});\n    if(growthDelta!=null && growthDelta>=8)\n      strengths.push({label:'You are improving week on week',\n        detail:'Completion is up '+growthDelta+' points on last week.'});\n    if(avgSatisfaction!=null && avgSatisfaction>=7)\n      strengths.push({label:'The days feel good',\n        detail:'Average satisfaction '+avgSatisfaction+' out of 10 across '+rated.length+' reviewed days.'});\n\n    if(badgeRanked.length>=2 && badgeBest.rate-badgeWorst.rate>=25)\n      weakSpots.push({label:badgeWorst.name+' work keeps losing',\n        detail:'Only '+pctText(badgeWorst.rate)+' of it finishes, against '\n          +pctText(badgeBest.rate)+' for '+badgeBest.name\n          +'. Either it is being planned into the wrong days or there is too much of it.'});\n    if(worstSession && worstSession.rate<50 && (!bestSession||worstSession.key!==bestSession.key))\n      weakSpots.push({label:worstSession.label+' is where work dies',\n        detail:'Only '+pctText(worstSession.rate)+' of what you file there gets finished. Move it, or plan less into it.'});\n    if(worstDow && worstDow.rate<50 && (!bestDow||worstDow.label!==bestDow.label))\n      weakSpots.push({label:worstDow.label+' is your weakest day',\n        detail:pctText(worstDow.rate)+' finished. Keep it light, or protect it.'});\n    if(consistency!=null && consistency<60)\n      weakSpots.push({label:'Too many blank days',\n        detail:'Nothing was finished on '+(activeDays.length-showedUp)+' of the '+activeDays.length+' days that had work on them.'});\n    if(estBias!=null && estBias>20)\n      weakSpots.push({label:'You underestimate by '+estBias+'%',\n        detail:'Tasks take longer than planned, so the day is over-filled before it starts.'});\n    if(estBias!=null && estBias<-25)\n      weakSpots.push({label:'You over-estimate by '+Math.abs(estBias)+'%',\n        detail:'Work finishes early — the day could hold more than you are giving it.'});\n    if(stubborn && (stubborn.carryCount||1)>=3)\n      weakSpots.push({label:'\"'+stubborn.title+'\" has carried '+(stubborn.carryCount||1)+' times',\n        detail:'A task that keeps moving is usually too big or in the wrong session. Split it or drop it.'});\n    if(carrying.length>=3)\n      weakSpots.push({label:carrying.length+' tasks are carrying',\n        detail:hm(carryMins)+' of unfinished work is following you day to day.'});\n    if(windowTopReason && windowTopReason.count>=3)\n      weakSpots.push({label:'\"'+windowTopReason.label+'\" '+windowTopReason.count+' times',\n        detail:'The commonest reason work slips. Plan the day around it rather than through it.'});\n    if(routineRate!=null && routineRate<50)\n      weakSpots.push({label:'Routines are slipping',\n        detail:'Only '+routineKept+' of '+routinePlanned+' kept. A routine you never keep is worth deleting.'});\n    if(growthDelta!=null && growthDelta<=-8)\n      weakSpots.push({label:'Down '+Math.abs(growthDelta)+' points on last week',\n        detail:'Completion fell from '+lastWeekRate+'% to '+thisWeekRate+'%.'});\n\n    // Advice, in priority order, and only ever from data that exists.\n    const advice=[];\n    const overBlock=blockStats.filter(b=>b.cap>0 && b.load>b.cap)[0];\n    if(!s.tasks.length) advice.push('Nothing planned yet. Start with a monthly target, then break it down.');\n    if(overBlock) advice.push(overBlock.label+' is '+(overBlock.load-overBlock.cap)+' minutes over what you have. Move something.');\n    if(accountability.skipped>=3) advice.push(accountability.skipped+' tasks were postponed this week. Check where and why below.');\n    if(topReason && topReason.count>=2) advice.push('\"'+topReason.label+'\" is your commonest reason for slipping. Plan around it.');\n    /* The four-week signals turn into instructions, not observations: each one\n       names the thing to change and where to change it. */\n    if(stubborn && (stubborn.carryCount||1)>=3)\n      advice.push('Split \"'+stubborn.title+'\" into smaller parts — it has moved '+(stubborn.carryCount||1)+' times without getting done.');\n    if(worstSession && bestSession && worstSession.rate<50 && bestSession.rate-worstSession.rate>=25)\n      advice.push('Move work out of '+worstSession.label+' into '+bestSession.label+': '+pctText(bestSession.rate)+' finishes there against '+pctText(worstSession.rate)+'.');\n    if(estBias!=null && estBias>20)\n      advice.push('Add about '+estBias+'% to your time estimates. Everything is running longer than planned, which is what over-fills the day.');\n    if(estBias!=null && estBias<-25)\n      advice.push('You finish early by '+Math.abs(estBias)+'%. There is room for one more real task a day.');\n    if(worstDow && worstDow.rate<45)\n      advice.push('Stop planning heavy work on '+worstDow.label+' — only '+pctText(worstDow.rate)+' of it survives.');\n    if(routineRate!=null && routineRate<50)\n      advice.push('Your routines are kept '+routineRate+'% of the time. Cut them down to the ones you actually do.');\n    if(weakCards.length && weakCards[0].strength<40) advice.push(weakCards[0].heading+' is your weakest card. Revise it today.');\n    if(!advice.length && dayTotal) advice.push('Nothing is off track. Keep the run going.');\n\n\n    /* ── REPEATING RULES ──────────────────────────────────────────────── */\n    const seriesRows=(s.series||[]).map(sr=>{\n      const upcoming=seriesDueDates(sr, today, addDays(today, HORIZON_DAYS)).slice(0,3);\n      const next=upcoming[0]||'';\n      const lead=Math.max(0, Number(sr.lead)||0);\n      const left=next?daysBetween(today,next):null;\n      return {\n        id:sr.id, title:sr.title,\n        cadence: sr.unit==='day'\n            ? (Math.max(1,Number(sr.every)||1)>1\n               ? ('Every '+Math.max(1,Number(sr.every)||1)+' days'):'Daily')\n          : sr.unit==='week' ? 'Weekly'\n          : (Math.max(1,Number(sr.every)||1)>1\n             ? ('Every '+Math.max(1,Number(sr.every)||1)+' months'):'Monthly'),\n        words: seriesWords(sr),\n        paused:!!sr.paused, opacity:sr.paused?0.55:1,\n        pauseLabel: sr.paused?'Resume':'Pause',\n        nextText: sr.paused ? 'Paused — nothing new is being filed.'\n          : !next ? (sr.until && sr.until<today\n              ? ('Finished — it ran until '+prettyDate(sr.until)+'.')\n              : 'No further dates ahead.')\n          : ('Next due '+prettyDate(next)+(left===0?' — today':left>0?(' · in '+left+(left===1?' day':' days')):'')\n             +(lead?(', on your list from '+prettyDate(addDays(next,-lead))):'')\n             +(upcoming.length>1?('. Then '+upcoming.slice(1).map(prettyDate).join(', ')):'')),\n        edit:()=>this.openSeriesForm(sr.id),\n        togglePause:()=>this.pauseSeries(sr.id, !sr.paused),\n        remove:()=>this.askDeleteSeries(sr.id),\n      };\n    });\n\n    /* ── THE LOG ───────────────────────────────────────────────────────\n       Everything the app already records, written back out as a day-by-day\n       account rather than as statistics. The Dashboard answers \"how am I\n       doing\"; this answers \"what actually happened on the 14th\", which is a\n       different question and the one you ask when a figure surprises you.\n\n       Two sources, because neither is complete on its own: the day's history\n       record holds the counts, the skip reasons and the satisfaction score,\n       while the live task list is the only place the *titles* survive —\n       finished tasks stay on their own date for exactly this reason. */\n    const LOG_DAYS=120;\n    const logDates=[];\n    for(let i=0;i<LOG_DAYS;i++){\n      const ds=addDays(today,-i);\n      const rec=dayRecord(ds);\n      const own=s.tasks.filter(t=>t.scope==='day' && (t.date||today)===ds);\n      if(rec || own.length) logDates.push({ds, rec, own});\n    }\n    const logRows=logDates.map(({ds, rec, own})=>{\n      const r=rec||{};\n      const finished=own.filter(t=>t.done);\n      const doneMin=(r.done||0)+(r.routineDoneMinutes||0);\n      const total=(r.total||0), fin=(r.finished||0);\n      const routines=routinesOnDate(s.routines, ds);\n      const open=!s.history[ds];\n      return {\n        id:'log-'+ds,\n        date:prettyDate(ds),\n        weekday:WEEKDAYS[parseISO(ds).getDay()],\n        isToday: ds===today,\n        headline: total\n          ? (fin+' of '+total+' done')\n          : (routines.length?'Routines only':'Nothing planned'),\n        hours: doneMin? hm(doneMin) : '—',\n        mood: Number.isFinite(r.satisfaction) ? (r.satisfaction+'/10') : '—',\n        moodValue: Number.isFinite(r.satisfaction) ? r.satisfaction : '',\n        /* An open day is still being lived. Saying \"3 skipped\" about a\n           Tuesday afternoon would be a lie about the future. */\n        state: open ? 'in progress' : (r.reviewed?'reviewed':'closed'),\n        stateColor: open?'var(--color-accent-700)'\n          : r.reviewed?'var(--color-accent-700)':'var(--color-neutral-700)',\n        barDone: total? Math.round(fin/total*100) : 0,\n        barColor: total && fin===total ? 'var(--color-accent)' : 'var(--color-accent-400)',\n        skippedText: r.skipped? (r.skipped+' skipped') : '',\n        routineText: r.routineTotal\n          ? (r.routineDone+' of '+r.routineTotal+' routines') : '',\n        open:!!s.expanded['log-'+ds],\n        caret: s.expanded['log-'+ds]?'▾':'▸',\n        toggle:()=>this.toggleExpand('log-'+ds),\n        review:()=>this.openDay(ds),\n        // what was actually finished, with the time it really took\n        done: finished.map(t=>({\n          title:t.title,\n          planned:t.minutes||0,\n          actualMin:(t.actual!=null&&t.actual>0)?t.actual:'',\n          detail: (t.actual!=null&&t.actual>0)\n            ? (t.actual+' min, planned '+(t.minutes||0))\n            : ((t.minutes||0)+' min'),\n          badge:(badgeOf(t.badgeId)||{}).name||'',\n          hasBadge:!!badgeOf(t.badgeId),\n          badgeBg:badgeBg((badgeOf(t.badgeId)||{}).tone),\n          badgeFg:badgeFg((badgeOf(t.badgeId)||{}).tone),\n        })),\n        hasDone: finished.length>0,\n        // and what did not, in the words that were actually recorded\n        misses: (r.skips||[]).map(x=>({...x, kind:'Task'}))\n          .concat((r.routineSkips||[]).map(x=>({...x, kind:'Routine'}))).map(x=>({\n          title:x.title,\n          kind:x.kind,\n          planned:x.minutes||0,\n          reason:x.reason||'No reason recorded',\n          where:(BLOCKS.filter(b=>b.key===(x.block||'morning'))[0]||{label:''}).label,\n        })),\n        hasMisses: ((r.skips||[]).length + (r.routineSkips||[]).length)>0,\n        kept: routines.filter(x=>(x.done||{})[ds]).map(x=>({\n          title:x.title,\n          planned:x.minutes||0,\n          actualMin:(x.actual||{})[ds]||'',\n          detail: (x.actual||{})[ds] ? ((x.actual||{})[ds]+' min') : ((x.minutes||0)+' min'),\n        })),\n        hasKept: routines.some(x=>(x.done||{})[ds]),\n        nothing: !finished.length && !((r.skips||[]).length+(r.routineSkips||[]).length)\n          && !routines.some(x=>(x.done||{})[ds]),\n      };\n    });\n    /* Search over the log, not only over Plan. Plan answers \"where is that\n       task\"; this answers \"when did I last do that\", and \"what did I keep\n       writing as the reason\" — the day's own words are the point of keeping\n       them, and they were only ever readable by scrolling. A day matches on\n       its date, its weekday, any title it finished or kept, and any reason it\n       recorded. A matching day opens itself, or the match stays hidden behind\n       a caret. */\n    const logQuery=String(s.logSearch||'').trim().toLocaleLowerCase();\n    const logSearching=logQuery.length>0;\n    const logHaystack=r=>[r.date, r.weekday, r.headline]\n      .concat(r.done.map(x=>x.title)).concat(r.done.map(x=>x.badge))\n      .concat(r.kept.map(x=>x.title))\n      .concat(r.misses.map(x=>x.title)).concat(r.misses.map(x=>x.reason))\n      .join(' ').toLocaleLowerCase();\n    const logShown=(logSearching ? logRows.filter(r=>logHaystack(r).indexOf(logQuery)>-1)\n                                 : logRows)\n      .map(r=>logSearching ? {...r, open:true, caret:'▾'} : r);\n    const logDone=logShown.reduce((a,r)=>a+r.done.length,0);\n    const logMisses=logShown.reduce((a,r)=>a+r.misses.length,0);\n\n    /* One row per item rather than one per day: a spreadsheet can group a\n       long table itself, and cannot ungroup a short one. Everything on the\n       screen is here — what finished with the time it really took, the\n       routines kept, and what did not happen with the reason as written. */\n    const csvCell=v=>{\n      const str=String(v==null?'':v);\n      return /[\",\\n]/.test(str) ? '\"'+str.replace(/\"/g,'\"\"')+'\"' : str;\n    };\n    const csvRows=[['Date','Weekday','Day state','Satisfaction','Kind','Item',\n      'Badge','Outcome','Planned (min)','Actual (min)','Reason']];\n    logShown.forEach(r=>{\n      const head=[r.date, r.weekday, r.state, r.moodValue];\n      r.done.forEach(x=>csvRows.push(head.concat(\n        ['Task', x.title, x.badge||'', 'Finished', x.planned, x.actualMin, ''])));\n      r.kept.forEach(x=>csvRows.push(head.concat(\n        ['Routine', x.title, '', 'Kept', x.planned, x.actualMin, ''])));\n      r.misses.forEach(x=>csvRows.push(head.concat(\n        [x.kind, x.title, '', 'Not done', x.planned, '', x.reason])));\n      if(!r.done.length && !r.kept.length && !r.misses.length)\n        csvRows.push(head.concat(['—','Nothing recorded','','Rest day','','','']));\n    });\n    const logCsv=csvRows.map(row=>row.map(csvCell).join(',')).join('\\r\\n')+'\\r\\n';\n    const logCsvName='task2day-log-'+today+'.csv';\n\n    /* ── GOALS ────────────────────────────────────────────────────────── */\n    const goals=s.goals.map(g=>{\n      const own=s.tasks.filter(t=>t.goalId===g.id);\n      const d=own.filter(t=>t.done).length;\n      return {id:g.id, title:g.title, deadline:g.deadline||'No date',\n        tag:g.deadline?'tag-accent':'tag-neutral',\n        total:own.length, done:d, pct:pct(d,own.length),\n        barColor: d===own.length&&own.length?'var(--color-accent)':'var(--color-accent-400)',\n        summary: own.length? (d+' of '+own.length+' tasks done') : 'No tasks linked yet',\n        remove:()=>this.askDeleteGoal(g.id)};\n    });\n\n    /* ── REVISE: topic groups ─────────────────────────────────────────── */\n    const groups=s.groups.map(g=>{\n      const cs=s.cards.filter(c=>c.groupId===g.id);\n      const due=cs.filter(c=>c.dueIn<=0).length;\n      return {\n        id:g.id, name:g.name,\n        count:cs.length, due,\n        countText: cs.length? (cs.length+(cs.length===1?' card':' cards')+(due?' · '+due+' due':'')) : 'No cards yet',\n        open:!!s.expanded[g.id], caret:s.expanded[g.id]?'▾':'▸',\n        toggleOpen:()=>this.toggleExpand(g.id),\n        revise:()=>this.reviseGroup(g.id),\n        remove:()=>this.askDeleteGroup(g.id),\n        onPick:(e)=>this.pickImage(g.id, null, e),\n        cards: (s.expanded[g.id]?cs:[]).map(c=>({\n          id:c.id, heading:c.heading,\n          dueText: c.dueIn<=0?'due now':('due in '+c.dueIn+(c.dueIn>1?' days':' day')),\n          strength:c.strength,\n          barColor: c.strength>=70?'var(--color-accent)':c.strength>=40?'var(--color-accent-400)':'var(--color-accent-2)',\n          hasImg:!!c.img, noImg:!c.img,\n          imgCss: c.img?('url(\"'+c.img+'\")'):'none',\n          onPick:(e)=>this.pickImage(g.id, c.id, e),\n          open:()=>this.openRecall(c.id),\n          remove:()=>this.askDeleteCard(c.id),\n        })),\n      };\n    });\n    const rc=s.cards.filter(c=>c.id===s.recall)[0];\n    const rcGroup=rc?(s.groups.filter(g=>g.id===rc.groupId)[0]||{name:''}).name:'';\n\n    const freqs=[5,15,30,60,120,240].map(m=>({\n      label: m<60? m+'m' : (m/60)+'h', set:()=>this.setFreq(m),\n      bg: s.freqMin===m?'var(--color-accent)':'transparent',\n      fg: s.freqMin===m?'var(--color-bg)':'var(--color-text)',\n      border: s.freqMin===m?'var(--color-accent)':'var(--color-divider)',\n    }));\n\n    /* ── review sheet ─────────────────────────────────────────────────── */\n    const rv=s.review;\n    const slipped= rv? (rv.items||[]).map(t=>({\n      title:t.title,\n      options:REASONS.map(r=>{\n        const on=rv.reasons[t.id]===r;\n        return {label:r, pick:()=>this.pickReason(t.id,r),\n          bg: on?'var(--color-accent)':'transparent',\n          fg: on?'var(--color-bg)':'var(--color-text)',\n          border: on?'var(--color-accent)':'var(--color-divider)'};\n      }),\n      /* The box holds the reason only while it is not one of the chips —\n         otherwise picking \"Too tired\" would echo into the field and read as\n         something typed. `pickReason` has always stored a plain string, so\n         nothing downstream needs to know the difference. */\n      custom: REASONS.indexOf(rv.reasons[t.id])>-1 ? '' : (rv.reasons[t.id]||''),\n      setCustom:e=>this.pickReason(t.id, e.target.value),\n    })) : [];\n    const slipMins=rv?(rv.items||[]).reduce((a,t)=>a+(t.minutes||0),0):0;\n    // what one evening actually holds, which is what makes \"carry it to\n    // tomorrow\" either reasonable advice or a lie\n    const eveningCap=s.capacity.evening||1;\n    const reviewRoutineSkips=rv?(rv.routineSkips||[]).map(item=>({\n      ...item,\n      options:SKIP_REASONS.map(reason=>{\n        const on=rv.routineReasons[item.routineId]===reason;\n        return {label:reason,pick:()=>this.pickRoutineReason(item.routineId,reason),\n          bg:on?'var(--color-accent)':'transparent',\n          fg:on?'var(--color-bg)':'var(--color-text)',\n          border:on?'var(--color-accent)':'var(--color-divider)'};\n      }),\n    })):[];\n    const satisfaction=rv?Number(rv.satisfaction)||0:0;\n    const satisfactionLabel=satisfaction<=2?'You had a difficult day.'\n      : satisfaction<=4?'Below the level you wanted.'\n      : satisfaction<=6?'A mixed but useful day.'\n      : satisfaction<=8?'A productive day.'\n      : 'An excellent day — remember what worked.';\n\n    /* ── forms ────────────────────────────────────────────────────────── */\n    const tf=s.taskForm;\n    const rfm=s.routineForm;\n    const cropOn=!!s.crop;\n    const cropImgStyle = s.crop\n      ? ('pointer-events:none;-webkit-user-drag:none;user-select:none;width:'+s.crop.w+'px;height:'+s.crop.h+'px;transform:translate(-50%,-50%) translate('+\n         s.crop.x+'px,'+s.crop.y+'px) scale('+s.crop.scale+');transform-origin:center;position:absolute;left:50%;top:50%;max-width:none')\n      : '';\n\n    /* Honest about the ceiling: without a push server nothing can wake the\n       app once it is closed, and promising alarms it cannot ring is worse\n       than saying so. */\n    const notifStatus = !window.Notification ? 'Not supported in this browser'\n      : s.notifPerm==='denied' ? 'Blocked — allow it in your browser settings'\n      : s.notifyOn ? ('On. Alerts at '+s.reminderTime+' and before appointments.')\n      : 'Off. Tap to allow alerts.';\n\n    /* The ordinary bottom bar every phone app has: an icon over a label,\n       colour alone saying which one you are on. Borders and filled pills were\n       tried and read as clutter — a tab bar is chrome, and chrome should be\n       quiet. The spacer only exists to clear the add button, so it is only\n       there on the screen the add button is on. */\n    const navDefs=[\n      {key:'today', label:'Today', icon:NAV_ICONS.today},\n      {key:'dash', label:'Dashboard', icon:NAV_ICONS.dash},\n      {key:'__spacer'},\n      {key:'plan', label:'Plan', icon:NAV_ICONS.plan},\n      {key:'revise', label:'Revise', icon:NAV_ICONS.revise},\n      /* Settings used to be reachable only through a small gear on the\n         Dashboard — a whole screen of real preferences behind one 17px glyph\n         on one screen. It is a destination, so it sits where destinations\n         are. Five is the most a phone bar holds; the Log is one tap away on\n         the Dashboard rather than a sixth item nothing would fit beside. */\n      {key:'settings', label:'Settings', icon:NAV_ICONS.settings},\n    ];\n    // the spacer only exists to clear the add button, so it is only there on\n    // the screens that button is on\n    const nav=navDefs.filter(n=>n.key!=='__spacer'\n      || s.screen==='plan' || s.screen==='dash').map(n=>{\n      if(n.key==='__spacer') return {label:'', icon:'', weight:400, current:'false',\n        color:'transparent', isSpacer:true, isTab:false, go:()=>{}};\n      const on=s.screen===n.key;\n      return {label:n.label, icon:n.icon, weight:on?600:500, current: on?'page':'false',\n        color: on?'var(--color-accent-700)':'color-mix(in srgb,var(--color-text) 55%,transparent)',\n        isSpacer:false, isTab:true,\n        go:()=>this.go(n.key)};\n    });\n\n    const tm=s.timer;\n    const hourRows=BLOCKS.map(b=>({\n      key:b.key, label:b.label,\n      from:(s.hours[b.key]||{}).from||'', to:(s.hours[b.key]||{}).to||'',\n      capacity:s.capacity[b.key]||0,\n      capacityText: hm(s.capacity[b.key]||0),\n      setFrom:(e)=>this.setHours(b.key,'from',e.target.value),\n      setTo:(e)=>this.setHours(b.key,'to',e.target.value),\n    }));\n    const syncInfo=!s.online\n      ? {label:this._localPending?'Offline · queued':'Offline',\n         title:'Available offline',\n         detail:this._localPending\n           ? 'Changes are saved on this device and will sync automatically when the connection returns.'\n           : 'This device copy is ready. You can keep working without a connection.',\n         bg:'var(--card-amber)',fg:'var(--ink-amber)',dot:'var(--color-process-yellow)'}\n      : s.syncState==='syncing'\n      ? {label:'Syncing…',title:'Syncing with your account',\n         detail:'Your device copy is safe while Firebase catches up.',\n         bg:'var(--card-sky)',fg:'var(--ink-sky)',dot:'var(--color-accent)'}\n      : s.syncState==='pending'\n      ? {label:'Waiting to sync',title:'Saved on this device',\n         detail:'The device copy is current. Task2Day will retry the account sync automatically.',\n         bg:'var(--card-amber)',fg:'var(--ink-amber)',dot:'var(--color-process-yellow)'}\n      : s.syncState==='error'\n      ? {label:'Storage issue',title:'Device storage needs attention',\n         detail
