const splashStartedAt = performance.now();
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  const thumbnail = document.getElementById('__bundler_thumbnail');
  const reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function setStatus(msg) { if (loading) loading.textContent = msg; }
  function wait(ms) { return ms > 0 ? new Promise(resolve => setTimeout(resolve, ms)) : Promise.resolve(); }
  async function finishSplash() {
    // This is the only startup splash. Keep very fast launches from flashing,
    // but never delay a slow launch after the bundle is genuinely ready.
    await wait(Math.max(0, (reducedMotion ? 0 : 1200) - (performance.now() - splashStartedAt)));
    if (thumbnail) thumbnail.classList.add('__bundler_done');
    if (loading) loading.classList.add('__bundler_done');
    await wait(reducedMotion ? 0 : 220);
  }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Loading Task2Day…');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Almost there…');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    await finishSplash();
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Task2Day — Task, Study, Steady growth<\u002Ftitle>\n<script src=\"a6820c22-7ed0-4a58-b589-2da1fbbbfc64\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Broadsheet — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */\n/* Source Serif 4 is loaded from the DC's <helmet> as a NON-render-blocking\n   stylesheet (media=print + onload promote), never an @import: a blocking\n   remote fetch freezes the whole document if it cannot resolve. Georgia is\n   the fallback the app paints in until/unless the webfont lands. */\n:root {\n  --color-bg: #f6f4fc;\n  --color-surface: #ffffff;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  /* Sans for everything you operate — buttons, tags, labels, numerals, body.\n     The serif is reserved for display headings, where it still earns its keep;\n     used for 12px chrome it just read as dated. */\n  --font-heading: \"Source Sans 3\", -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Sans 3\", -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Source Serif 4\", Georgia, \"Times New Roman\", serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  /* The scale skipped 5, and nine call sites had been written against it —\n     every one silently resolving to nothing, which is how a dialog ends up\n     with no padding at all and its text flush to the rounded corner. An\n     undefined custom property is not an error anywhere; it is just gone. */\n  --space-5: 25.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  /* Was 1/2/4px — a hard-edged broadsheet. Softened right up: this is a\n     phone app you hold, and the card shapes below need room to read as cards\n     rather than as boxes ruled on a page. */\n  --radius-sm: 8px;\n  --radius-md: 14px;\n  --radius-lg: 22px;\n  --radius-pill: 999px;\n\n  /* ——— the card palette ———\n     Each session, and each block on the dashboard, takes one of these. They\n     are pale enough to carry 15px body text at full contrast, and each has an\n     ink that is the same hue driven dark, so a heading on a card never falls\n     back to plain black. */\n  --card-violet: #e7e0ff;   --ink-violet: #3b2a7a;\n  --card-amber:  #ffdfa6;   --ink-amber:  #6b4405;\n  --card-sky:    #d3e7ff;   --ink-sky:    #123a68;\n  --card-rose:   #ffd9ec;   --ink-rose:   #7a1247;\n  --card-mint:   #ccefdd;   --ink-mint:   #10492f;\n  --card-lilac:  #f0e4ff;   --ink-lilac:  #4a2472;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n/* The card the whole layout is built from: a white panel on the tinted\n   ground, generously rounded, one soft shadow. */\n.card-panel { background: var(--color-surface); border-radius: var(--radius-lg);\n  padding: var(--space-4); box-shadow: var(--shadow-sm); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\n/* The screen titles keep the serif — enough of it to give the app a voice,\n   without the whole interface wearing a costume. Declared after the reset's\n   own h1..h6 rule, which sets font-family at the same specificity and would\n   otherwise win on source order. */\nh1, h2, .app h1, .app h2 { font-family: var(--font-display); }\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: var(--radius-pill); font-weight: 600;\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<meta name=\"theme-color\" content=\"#f3f2f2\">\n<meta name=\"application-name\" content=\"Task2Day\">\n<!-- iOS ignores the manifest: it takes the home-screen icon and the\n     standalone behaviour from these instead. Without them an \"Add to Home\n     Screen\" on iPhone opens a Safari tab with full browser chrome and a\n     screenshot for an icon. -->\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Task2Day\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<link rel=\"icon\" type=\"image/png\" sizes=\"32x32\" href=\"favicon-32.png\">\n<link rel=\"icon\" type=\"image/png\" sizes=\"192x192\" href=\"icon-192.png\">\n<link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"apple-touch-icon.png\">\n\n<!-- These @font-face rules were behind media=\"print\" with nothing to promote\n     them back (that trick needs <link rel=stylesheet onload=\"this.media='all'\">;\n     an inline <style media=print> just never applies to screen). The result was\n     that Source Serif 4 never rendered at all and the app ran on the Georgia\n     fallback, with every heading weight faked by the browser's synthetic bold.\n     There is nothing to defer here anyway — the faces are inline base64 in this\n     same document, so there is no network fetch to keep off the critical path. -->\n<style>/* ——— Source Sans 3, the UI face ———\n   The app used to be Source Serif 4 for everything. A serif at 12-15px on a\n   phone reads bookish rather than professional, and every button, tag, numeral\n   and nav label was wearing it. The sans carries all of that now; the serif is\n   kept for the big display headings, where it is doing something.\n   Variable, 200-900, so one file covers every weight in use. */\n/* latin-ext */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 200 900;\n  font-display: swap;\n  src: url(\"5adde405-0c10-4779-ba9c-a470b1fbb02c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 200 900;\n  font-display: swap;\n  src: url(\"ddee9064-3633-49a3-b88e-73f676c17e7c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c611775d-0de2-4e80-8fb7-35cb13b71f0a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a800eb52-e42b-4efc-86e4-d262d11ba681\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 200 900;\n  font-display: swap;\n  src: url(\"47b94450-721e-4bfc-8f70-ad9bd51b44d7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 200 900;\n  font-display: swap;\n  src: url(\"cefeb036-4e33-4003-818c-100d5f909270\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"3c95effd-8417-47d1-914d-666e58af0bef\"><\u002Fscript>\n<script src=\"87e2bf42-9933-49e9-be8c-ce75d04ceae3\"><\u002Fscript>\n<script src=\"cb0c3cf3-f558-40b0-a85d-53a07a3e3488\"><\u002Fscript>\n<script src=\"484e92de-e3d8-4b61-aa1e-7663f744b6b4\"><\u002Fscript>\n<script>\n  // The config is published rather than closed over, because the app can need\n  // re-initialising later — see __firebaseApp below.\n  window.__firebaseConfig = {\n    apiKey: \"AIzaSyBYAxbXvmOvCB0CqgvtendoDPZTRVeV5Rk\",\n    authDomain: \"climbup-a9bdd.firebaseapp.com\",\n    databaseURL: \"https://climbup-a9bdd-default-rtdb.asia-southeast1.firebasedatabase.app\",\n    projectId: \"climbup-a9bdd\",\n    storageBucket: \"climbup-a9bdd.firebasestorage.app\",\n    messagingSenderId: \"110601162892\",\n    appId: \"1:110601162892:web:acf082609c08c99741aba9\"\n  };\n\n  // Returns a firebase namespace that has auth, database AND the default app,\n  // or null while the scripts are still arriving.\n  //\n  // firebase-app-compat can be evaluated more than once here: the bundle\n  // re-creates and re-runs every script tag after it swaps the document, and\n  // the compat build says so out loud (\"Firebase is already defined in the\n  // global scope\"). That second evaluation is not survivable by re-initialising\n  // — it replaces window.firebase with a BARE namespace that has no auth and no\n  // database on it at all, because those components registered themselves\n  // against the previous one, and its app list is empty. Measured: after a\n  // second evaluation, window.firebase.database is not even a function, and any\n  // call through the global throws \"No Firebase App '[DEFAULT]' has been\n  // created\".\n  //\n  // So the complete namespace is pinned on a global of our own the moment one\n  // is seen, and every use site goes through here rather than through\n  // window.firebase, which is not stable.\n  window.__firebaseApp = function(){\n    var pinned = window.__fb;\n    if(pinned && pinned.auth && pinned.database){\n      try{\n        if(!(pinned.apps || []).length) pinned.initializeApp(window.__firebaseConfig);\n      }catch(e){ /* raced with another initialise; the app exists either way */ }\n      return pinned;\n    }\n    var f = window.firebase;\n    if(!f || !f.initializeApp || !f.auth || !f.database) return null;\n    try{\n      if(!(f.apps || []).length) f.initializeApp(window.__firebaseConfig);\n    }catch(e){}\n    window.__fb = f;\n    return f;\n  };\n\n  // bundler/CDN loading order isn't guaranteed, so poll rather than assume\n  // firebase is ready right after these <script> tags\n  window.__firebaseReady = new Promise(function(resolve){\n    (function check(){\n      var f = window.__firebaseApp();\n      if(f && f.auth && f.database) resolve(f);\n      else setTimeout(check, 30);\n    })();\n  });\n<\u002Fscript>\n<style>\n  html,body{margin:0;background:#cfcdcb}\n  * { -webkit-tap-highlight-color: transparent; }\n  button, a, [role=\"button\"] { touch-action: manipulation; }\n  .app[data-theme=\"dark\"]{--color-bg:#17161c;--color-surface:#232128;\n    --card-violet:#332b52;--ink-violet:#d9cfff;\n    --card-amber:#4a3413;--ink-amber:#ffd894;\n    --card-sky:#173049;--ink-sky:#bcdcff;\n    --card-rose:#4a1c35;--ink-rose:#ffc7e2;\n    --card-mint:#173a2a;--ink-mint:#b6e8cd;\n    --card-lilac:#302748;--ink-lilac:#e2d2ff;--color-text:#ece9e6;--color-divider:color-mix(in srgb,#ece9e6 15%,transparent);\n    --color-neutral-100:#2f2c2b;--color-neutral-200:#3a3635;--color-neutral-300:#4a4645;--color-neutral-400:#5a5654;--color-neutral-700:#c2bcb9;--color-neutral-800:#d8d3d0;\n    /* the deep ramp steps carry small accent text; on a dark ground they must invert\n       or the 700-step readouts go near-black on near-black */\n    --color-accent-100:#0a303e;--color-accent-700:#7ed4f5;--color-accent-800:#8fdcff;\n    --color-accent-2-100:#4b1528;--color-accent-2-700:#ff9bb6;--color-accent-2-800:#ffc0d0}\n  .scr::-webkit-scrollbar{width:0}\n  .scr{overscroll-behavior-y:contain}\n  .app .text-muted{color:color-mix(in srgb,var(--color-text) 72%,transparent)}\n  .app h2,.app h3,.app h4{text-wrap:pretty}\n  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}\n  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}\n  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}\n  @keyframes fadeBg{from{opacity:0}to{opacity:1}}\n  @keyframes popIn{0%{opacity:0;transform:scale(.94) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}\n  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}\n\n  /* iOS Safari zooms the whole page in when a focused input is under 16px, and\n     never zooms back out. Every .input is 14px in the design system, so the\n     app-level override is the only thing standing between a tap on \"Minutes\"\n     and a viewport the user has to pinch back by hand. */\n  .app .input, .app textarea.input, .app select.input { font-size:16px; }\n  /* Landscape rotation on iOS otherwise inflates type on its own. */\n  html{ -webkit-text-size-adjust:100%; text-size-adjust:100% }\n\n  /* ══════════════════════════════════════════════════════════════════\n     PHONE — the app fills the real screen.\n\n     The 390×844 rounded frame with the drawn notch, \"5G\" and battery is a\n     PRESENTATION device: it exists to show the design as a phone on a wide\n     desktop viewport. On an actual phone it is the whole bug — the app\n     paints itself as a small illustration of a phone floating in grey,\n     with a fake status bar stacked under the real one and ~30% of the\n     screen spent on bezel. Below 560px, and in any installed PWA, the\n     illustration is dropped: the shell goes edge to edge, the drawn chrome\n     is hidden, and the real device's insets (notch, home indicator) are\n     what the layout keeps clear of.\n     ══════════════════════════════════════════════════════════════════ */\n  @media (max-width: 560px), (display-mode: standalone) {\n    html, body { overscroll-behavior-y:none; }        /* no rubber-band on the shell */\n    .app-shell{\n      padding:0 !important; display:block !important;\n      min-height:100vh; min-height:100dvh;\n    }\n    .app{\n      width:100% !important; max-width:none !important;\n      height:100vh !important; height:100dvh !important;\n      border-radius:0 !important; box-shadow:none !important;\n    }\n\n    /* the drawn notch / clock / signal — the device has real ones */\n    .device-chrome{ display:none !important; }\n\n    /* Content clears the notch at the top and the nav + home indicator at the\n       bottom. 78px is the nav's own height plus breathing room; the inset\n       adds whatever the hardware needs under it. */\n    .scr{\n      padding-top:max(var(--space-3), env(safe-area-inset-top)) !important;\n      padding-bottom:calc(78px + env(safe-area-inset-bottom)) !important;\n      padding-left:max(var(--space-4), env(safe-area-inset-left)) !important;\n      padding-right:max(var(--space-4), env(safe-area-inset-right)) !important;\n    }\n    .install-banner{\n      padding-top:calc(var(--space-3) + env(safe-area-inset-top)) !important;\n    }\n    .bottom-nav{\n      height:calc(56px + env(safe-area-inset-bottom)) !important;\n      padding-bottom:env(safe-area-inset-bottom) !important;\n    }\n    .fab-add{ bottom:calc(32px + env(safe-area-inset-bottom)) !important; }\n    .timer-bar{ bottom:calc(56px + env(safe-area-inset-bottom)) !important; }\n    .toast{ bottom:calc(68px + env(safe-area-inset-bottom)) !important; }\n    /* Higher specificity than .toast above, so it still wins here even\n       though both are !important — the add/split sheet's own Save button\n       lives in this same bottom-68px band, and a toast firing while it is\n       open (saving a month task fires one immediately) would otherwise sit\n       on top of it. */\n    .toast.toast-over-sheet{ bottom:auto !important; top:max(12px, env(safe-area-inset-top)) !important; }\n\n    /* sheets and dialogs sit above the home indicator too */\n    .review-sheet{ padding-bottom:calc(var(--space-6) + env(safe-area-inset-bottom)) !important; }\n    .recall-card{ max-height:calc(100dvh - 120px); overflow-y:auto; }\n\n    /* Thumb-sized controls. The design's 28–39px buttons are comfortable\n       under a mouse and fiddly under a thumb; on a phone they get the 44px\n       minimum without changing their width or type. */\n    .app .btn:not(.btn-icon){ min-height:44px; }\n    .app .seg-opt{ min-height:44px; }\n    .app .input, .app select.input{ min-height:44px; }\n    .app .pill-row button{ min-height:44px; }\n    /* the reason chips in the evening review */\n    .app .reason-chip{ min-height:40px; }\n  }\n\n  /* ══════════════════════════════════════════════════════════════════\n     DESKTOP — the app fills the window, same markup, no phone.\n\n     Between 561px and 899px the drawn 390×844 frame stays: that width is a\n     tablet or a half-screen window, and the frame reads as a deliberate\n     presentation. From 900px it stops being a presentation and starts being\n     a small picture of an app inside a large empty room, so the shell goes\n     edge to edge, the bottom nav stands up into a left rail, and the bottom\n     sheets — a thumb affordance, meaningless under a mouse — become centred\n     dialogs.\n\n     Everything here is CSS over the same DOM. The layout is written in\n     inline styles, so these rules carry !important where they must beat one;\n     that is a deliberate cost, paid once, rather than a second markup tree\n     to keep in step with the first.\n     ══════════════════════════════════════════════════════════════════ */\n  @media (min-width: 900px) {\n    .app-shell{ padding:0 !important; display:block !important; }\n    .app{\n      width:100% !important; max-width:none !important;\n      height:100vh !important; height:100dvh !important;\n      border-radius:0 !important; box-shadow:none !important;\n    }\n    .device-chrome{ display:none !important; }        /* no drawn notch on a PC */\n\n    /* The nav stands up. Same buttons, same order, laid down the left edge\n       with room for their labels. */\n    .bottom-nav{\n      top:0 !important; bottom:0 !important; right:auto !important;\n      width:232px !important; height:auto !important;\n      flex-direction:column !important;\n      justify-content:flex-start !important;\n      align-items:stretch !important;\n      gap:2px; padding:var(--space-6) var(--space-3) !important;\n      border-top:0 !important; border-right:1px solid var(--color-divider);\n      background:var(--color-surface) !important;\n    }\n    .bottom-nav button{\n      flex:none !important; width:100%;\n      flex-direction:row !important;\n      justify-content:flex-start !important;\n      gap:var(--space-3) !important;\n      padding:11px var(--space-3) !important;\n      border-radius:var(--radius-md);\n    }\n    .bottom-nav button span{ font-size:14px !important; }\n    .bottom-nav button:hover{ background:var(--color-neutral-100); }\n    .bottom-nav button[aria-current=\"page\"]{ background:var(--color-accent-100); }\n    /* the spacer exists only to clear the phone's centred + button */\n    .bottom-nav > span{ display:none !important; }\n\n    /* Content sits beside the rail. A column has a comfortable measure whatever\n       the window does — 1040px is wide enough for the calendar and the growth\n       chart to breathe and narrow enough that a line of prose is still one\n       line of prose. */\n    .scr{\n      padding-left:calc(232px + var(--space-8)) !important;\n      padding-right:var(--space-8) !important;\n      padding-top:var(--space-6) !important;\n      padding-bottom:var(--space-8) !important;\n    }\n    .scr::-webkit-scrollbar{ width:10px }\n    .scr::-webkit-scrollbar-thumb{\n      background:var(--color-neutral-300); border-radius:var(--radius-pill);\n    }\n    .screen{ max-width:860px; margin:0 auto; }\n    /* Square day cells stretched to the full column turn the month into a\n       wall of 140px tiles. The grid keeps a phone-ish measure and centres. */\n    .month-grid{ max-width:520px; margin-left:auto; margin-right:auto; }\n    .install-banner{ padding-left:calc(232px + var(--space-8)) !important;\n      padding-top:var(--space-3) !important; }\n\n    /* The + moves to the corner it belongs in under a mouse. */\n    .fab-add{\n      left:auto !important; right:var(--space-8) !important;\n      bottom:var(--space-8) !important;\n      transform:none !important;\n      width:56px !important; height:56px !important;\n    }\n    .timer-bar{ left:232px !important; bottom:0 !important; }\n    .toast{\n      left:calc(232px + var(--space-8)) !important;\n      right:var(--space-8) !important;\n      bottom:var(--space-6) !important;\n      max-width:520px; margin-left:auto; margin-right:auto;\n    }\n\n    /* A sheet that rises from the bottom edge is a thumb affordance. Under a\n       mouse it becomes an ordinary centred dialog — `align-self` is what\n       overrules the overlay's inline `place-items:end center`. */\n    .review-sheet, .sheet-panel, .recall-card{\n      align-self:center !important;\n      width:min(620px, 92vw) !important;\n      max-height:84vh !important; overflow-y:auto;\n      border-radius:var(--radius-lg) !important;\n      box-shadow:var(--shadow-lg) !important;\n    }\n    .review-sheet{ padding:var(--space-6) !important; }\n    .sheet-panel{ padding:var(--space-6) !important; }\n\n    /* Row actions stack vertically to stay narrow under a thumb. With a\n       whole desktop row to spend, four stacked links make every task 150px\n       tall for no reason — they lie down. */\n    .row-actions{\n      flex-direction:row !important; align-items:center !important;\n      gap:var(--space-2) !important;\n    }\n\n    /* Pointer affordances the phone build has no use for. */\n    .app button{ transition:background .15s, color .15s, opacity .15s; }\n    .app .btn:not(.btn-primary):hover{ background:var(--color-neutral-100); }\n    .app .btn-primary:hover{ filter:brightness(1.06); }\n    .app .tap:hover{ opacity:.85; }\n  }\n\n  /* ── Touch targets ──────────────────────────────────────────────────\n     Everything below keeps its drawn size and grows only the area that\n     answers a finger, via a transparent ::after. Changing the real box\n     would reflow rows that are tuned to the type scale; changing the hit\n     area costs nothing and takes the 22px checkbox and the 12px text\n     buttons up to the 44px minimum. */\n  .app .tap,\n  .app .btn-icon,\n  .app button[aria-label^=\"Toggle\"]{ position:relative; }\n  .app .tap::after,\n  .app .btn-icon::after,\n  .app button[aria-label^=\"Toggle\"]::after{\n    content:\"\"; position:absolute; left:50%; top:50%;\n    transform:translate(-50%,-50%);\n    width:max(100%, 44px); height:max(100%, 44px);\n  }\n  /* nav items are already wide; they just need the full bar height */\n  .app .bottom-nav button{ min-height:40px; }\n  /* Content scrolls under the bar, so the bar needs an edge — otherwise a\n     half-read sentence just stops mid-line with nothing to explain why. */\n  .app .bottom-nav{ border-top:1px solid var(--color-divider); }\n\n  /* ══════════════════════════════════════════════════════════════════\n     TYPE — Broadsheet, pushed harder.\n\n     The roman is a variable face carrying a 200-900 weight axis, and the\n     @font-face rules above now declare that range instead of pinning two\n     static instances, so real 700/800 costs nothing extra to download.\n     Display sizes are fluid: a 320px phone and a 430px phone should not\n     both get a 42px headline, they should each get one in proportion to\n     the column it sits in. Tracking tightens as size grows, the way metal\n     type was cut — loose at caption sizes, tight at display.\n     ══════════════════════════════════════════════════════════════════ */\n  .app h1, .app h2, .app h3, .app h4 { font-weight:700; }\n  .app h1{ font-size:clamp(34px, 9.4vw, 46px); line-height:1.02; letter-spacing:-0.032em; }\n  .app h2{ font-size:clamp(27px, 7.7vw, 36px); line-height:1.05; letter-spacing:-0.028em; }\n  .app h3{ font-size:clamp(21px, 6.0vw, 27px); line-height:1.1;  letter-spacing:-0.022em; }\n  .app h4{ font-size:clamp(17px, 4.9vw, 21px); line-height:1.16; letter-spacing:-0.016em; }\n  .app h5{ font-weight:700; letter-spacing:-0.01em; }\n  /* the small caps kickers read as labels, so they go the other way */\n  .app h6{ font-weight:700; letter-spacing:0.11em; }\n\n  /* Figures — the pace hours, the week percentages. These are the loudest\n     thing on the page and they carry numbers that change, so they take the\n     heaviest weight, the tightest tracking, and lining tabular digits so a\n     2.4 does not jump sideways when it ticks to 2.5. */\n  .app .stat{\n    font-weight:800;\n    letter-spacing:-0.045em;\n    font-variant-numeric:tabular-nums lining-nums;\n    font-feature-settings:\"tnum\" 1;\n  }\n\n  /* ── Motion ─────────────────────────────────────────────────────────\n     Scrolling itself is smoothed, and section blocks fade up as they\n     arrive. The reveal runs on a scroll timeline where the engine has one\n     (Chromium 115+, which is most of Android) and simply does not run\n     anywhere else — it decorates content, it never gates it, so a browser\n     without the feature shows everything immediately and loses nothing. */\n  .scr{ scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }\n\n  @keyframes reveal{\n    from{ opacity:0; transform:translateY(16px); }\n    to  { opacity:1; transform:none; }\n  }\n  @supports (animation-timeline: view()){\n    @media (prefers-reduced-motion: no-preference){\n      .app .reveal{\n        animation:reveal linear both;\n        animation-timeline:view();\n        animation-range:entry 0% entry 58%;\n      }\n    }\n  }\n\n  /* One switch for everyone who has asked the OS to stop moving things:\n     the sways, the pops, the reveals and the smooth scroll all stand down. */\n  @media (prefers-reduced-motion: reduce){\n    .scr{ scroll-behavior:auto; }\n    .app *, .app *::before, .app *::after{\n      animation-duration:.01ms !important;\n      animation-iteration-count:1 !important;\n      transition-duration:.01ms !important;\n    }\n  }\n\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"app-shell\" style=\"min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--space-8);font-family:var(--font-body)\">\n  <div class=\"app\" data-theme=\"{{ theme }}\" style=\"width:390px;height:844px;background:var(--color-bg);color:var(--color-text);border-radius:40px;box-shadow:0 30px 80px rgba(20,18,17,.32),0 0 0 10px #14100f,0 0 0 12px #322c2a;overflow:hidden;position:relative;display:flex;flex-direction:column\">\n\n    <!-- Google sign-in gate — only signed-in users see the app underneath -->\n    <sc-if value=\"{{ showGate }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;z-index:50;background:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--space-8);gap:var(--space-2)\">\n        <img src=\"icon-512.png\" alt=\"Task2Day\" style=\"width:96px;height:96px;object-fit:contain\">\n        <h2 style=\"margin:var(--space-4) 0 0\">Task2Day<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:4px 0 0;font-style:italic\">Task, Study, Steady growth.<\u002Fp>\n        <sc-if value=\"{{ authChecking }}\" hint-placeholder-val=\"{{ true }}\">\n          <p class=\"text-muted\" style=\"font-size:13px;margin-top:var(--space-6)\">Checking your sign-in…<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ authNotSignedIn }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ signIn }}\" style=\"margin-top:var(--space-6);display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:var(--radius-md);border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text);font-family:var(--font-heading);font-weight:600;font-size:15px;cursor:pointer;box-shadow:var(--shadow-sm)\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" style=\"flex:none\"><path fill=\"#4285F4\" d=\"M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62z\"><\u002Fpath><path fill=\"#34A853\" d=\"M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z\"><\u002Fpath><path fill=\"#FBBC05\" d=\"M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z\"><\u002Fpath><path fill=\"#EA4335\" d=\"M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z\"><\u002Fpath><\u002Fsvg>\n            Sign in with Google\n          <\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:12px;color:var(--color-accent-2-800);margin-top:var(--space-3)\">{{ authError }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"device-chrome\" style=\"position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 var(--space-6) 6px;font-size:13px;font-family:var(--font-heading);font-weight:600;z-index:5;pointer-events:none\">\n      <span>{{ clock }}<\u002Fspan>\n      <span style=\"width:112px;height:24px;background:#14100f;border-radius:0 0 14px 14px;position:absolute;left:50%;top:0;transform:translateX(-50%)\"><\u002Fspan>\n      <span style=\"display:flex;gap:6px;align-items:center\"><span style=\"font-size:11px;letter-spacing:.06em\">5G<\u002Fspan><span style=\"width:19px;height:10px;border:1.5px solid currentColor;border-radius:var(--radius-sm);display:inline-block;position:relative\"><span style=\"position:absolute;top:1.5px;bottom:1.5px;left:1.5px;right:5px;background:currentColor\"><\u002Fspan><\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- install prompt — shows briefly, then gets out of the way -->\n    <sc-if value=\"{{ installShow }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"install-banner\" style=\"flex:none;background:var(--color-bg);border-bottom:2px solid var(--color-text);padding:54px var(--space-4) var(--space-3);display:flex;align-items:center;gap:var(--space-3);animation:rise .35s ease\">\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-family:var(--font-heading);font-weight:600;font-size:15px\">{{ installTitle }}<\u002Fdiv>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:2px 0 0;line-height:1.35\">{{ installNote }}<\u002Fp>\n        <\u002Fdiv>\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ doInstall }}\" style=\"flex:none\">Install<\u002Fbutton>\n        <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ hideInstall }}\" aria-label=\"Dismiss\" style=\"flex:none\"><span style=\"font-size:17px;line-height:1\">×<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"scr\" style=\"zoom:{{ textZoom }};flex:1;overflow-y:auto;padding-left:var(--space-4);padding-right:var(--space-4);padding-bottom:78px;padding-top:{{ scrPadTop }}\">\n\n      <!-- ════════════════ DASHBOARD ════════════════ -->\n      <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:var(--space-4)\">\n          <img src=\"icon-512.png\" alt=\"\" style=\"width:26px;height:26px;object-fit:contain;flex:none\">\n          <span style=\"font-family:var(--font-heading);font-weight:700;font-size:15px;letter-spacing:.01em\">Task2Day<\u002Fspan>\n          <sc-if value=\"{{ syncVisible }}\" hint-placeholder-val=\"{{ false }}\">\n            <span class=\"tag\" style=\"background:{{ syncBg }};color:{{ syncFg }};padding:3px 8px\">{{ syncLabel }}<\u002Fspan>\n          <\u002Fsc-if>\n          <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ goSettings }}\" aria-label=\"Settings\" style=\"flex:none;margin-left:auto\"><span style=\"font-size:17px;line-height:1\">⚙<\u002Fspan><\u002Fbutton>\n          <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Toggle theme\" style=\"flex:none\"><span style=\"font-size:17px;line-height:1\">☾<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n\n        <h6 style=\"color:var(--color-accent-700);margin:0 0 6px\">{{ weekday }} · {{ todayLabel }}<\u002Fh6>\n        <h2 style=\"margin:0\">{{ greeting }}<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 0\">{{ weekSummary }}<\u002Fp>\n\n        <sc-if value=\"{{ schemaOrphan }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:var(--space-4);background:var(--card-rose);color:var(--ink-rose);border-radius:var(--radius-lg);padding:var(--space-4)\">\n            <h4 style=\"margin:0 0 var(--space-2);color:inherit\">Your saved data could not be read<\u002Fh4>\n            <p style=\"font-size:13px;margin:0 0 var(--space-3);line-height:1.45\">It was written by a different version of Task2Day. Nothing has been deleted — it is still in your account, untouched. Download it before you add anything new, in case you want it back.<\u002Fp>\n            <div style=\"display:flex;gap:var(--space-2)\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ downloadOrphan }}\" style=\"flex:1\">Download it<\u002Fbutton>\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ dismissOrphan }}\" style=\"flex:none\">Dismiss<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasPendingReview }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ openPendingReview }}\" style=\"width:100%;display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--color-accent-2);border-radius:var(--radius-lg);background:var(--card-rose);color:var(--ink-rose);text-align:left;cursor:pointer\">\n            <span style=\"font-size:24px;line-height:1\" aria-hidden=\"true\">☞<\u002Fspan>\n            <span style=\"flex:1;min-width:0\">\n              <span style=\"display:block;font-family:var(--font-heading);font-weight:700;font-size:14px\">Previous day review is waiting<\u002Fspan>\n              <span style=\"display:block;font-size:12px;margin-top:2px;opacity:.8\">{{ pendingReviewLabel }} · add reasons and your satisfaction score<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-family:var(--font-heading);font-weight:700;font-size:20px\" aria-hidden=\"true\">→<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n\n        <!-- today at a glance -->\n        <div class=\"reveal\" style=\"display:flex;gap:var(--space-4);align-items:center;margin-top:var(--space-5);background:var(--card-violet);color:var(--ink-violet);border-radius:var(--radius-lg);padding:var(--space-4)\">\n          <div style=\"position:relative;width:74px;height:74px;flex:none;border-radius:50%;background:{{ ring }};display:grid;place-items:center\">\n            <div style=\"width:60px;height:60px;border-radius:50%;background:var(--card-violet);display:grid;place-items:center\">\n              <span class=\"stat\" style=\"font-family:var(--font-heading);font-size:20px;color:inherit\">{{ dayPct }}%<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0\">\n            <sc-if value=\"{{ hasToday }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <h4 style=\"margin:0 0 3px;color:inherit\">{{ dayDone }} of {{ dayTotal }} done today<\u002Fh4>\n                <p style=\"font-size:13px;margin:0;opacity:.8\">{{ dayMinutesLeft }} still planned<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noToday }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <h4 style=\"margin:0 0 3px;color:inherit\">Nothing today<\u002Fh4>\n                <p style=\"font-size:13px;margin:0;opacity:.8\">Days are filled in from Plan.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goToday }}\" style=\"padding-inline:0;font-size:13px;margin-top:4px;color:inherit;font-weight:700\">Open today →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- calendar -->\n        <div class=\"reveal card-panel\" style=\"margin-top:var(--space-5)\">\n        <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)\">\n          <button class=\"btn btn-icon tap\" sc-camel-on-click=\"{{ prevMonth }}\" aria-label=\"Previous month\" style=\"flex:none\">‹<\u002Fbutton>\n          <h6 style=\"margin:0;flex:1;text-align:center\">{{ monthLabel }}<\u002Fh6>\n          <button class=\"btn btn-icon tap\" sc-camel-on-click=\"{{ nextMonth }}\" aria-label=\"Next month\" style=\"flex:none\">›<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"month-grid\" style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:var(--space-2)\">\n          <sc-for list=\"{{ weekdayHeads }}\" as=\"wd\" hint-placeholder-count=\"7\">\n            <div class=\"text-muted\" style=\"text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase\">{{ wd }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"month-grid\" style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px\">\n          <sc-for list=\"{{ calendar }}\" as=\"c\" hint-placeholder-count=\"35\">\n            <button sc-camel-on-click=\"{{ c.pick }}\" aria-label=\"{{ c.aria }}\" style=\"aspect-ratio:1/1;width:100%;padding:0;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:var(--radius-md);background:{{ c.bg }};color:{{ c.fg }};font-family:var(--font-heading);font-weight:{{ c.weight }};font-size:12px;box-shadow:inset 0 0 0 1.5px {{ c.ring }}\">\n              <span>{{ c.label }}<\u002Fspan>\n              <span style=\"font-size:9px;line-height:1;font-weight:700;color:{{ c.countColor }};min-height:9px\">{{ c.count }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p class=\"text-muted\" style=\"font-size:11px;margin:var(--space-2) 0 0;line-height:1.4\">The small number is how many tasks that day holds — routines are not counted. Magenta marks a target falling due, a ring marks a day you finished clean. Tap any day to open it.<\u002Fp>\n        <\u002Fdiv>\n\n        <!-- what is coming -->\n        <sc-if value=\"{{ hasTargetsSoon }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"reveal\" style=\"margin-top:var(--space-8)\">\n          <h6 style=\"margin:0 0 var(--space-3)\">Coming up<\u002Fh6>\n          <sc-for list=\"{{ targetsSoon }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2);padding:9px 0;border-bottom:1px solid var(--color-divider)\">\n              <span style=\"flex:1;font-size:14px;line-height:1.3\">{{ t.title }}<\u002Fspan>\n              <span class=\"text-muted\" style=\"font-size:11px;white-space:nowrap\">{{ t.when }}<\u002Fspan>\n              <span style=\"font-family:var(--font-heading);font-weight:700;font-size:12px;white-space:nowrap;color:{{ t.color }}\">{{ t.left }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- progress at three zooms -->\n        <h6 class=\"reveal\" style=\"margin:var(--space-8) 0 var(--space-3)\">Progress<\u002Fh6>\n        <sc-for list=\"{{ progressRows }}\" as=\"pr\" hint-placeholder-count=\"3\">\n          <div style=\"margin-bottom:var(--space-4)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px\">\n              <span style=\"font-family:var(--font-heading);font-weight:700;font-size:15px\">{{ pr.label }}<\u002Fspan>\n              <span class=\"stat\" style=\"font-family:var(--font-heading);font-size:18px\">{{ pr.pct }}%<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:4px;border-radius:var(--radius-pill);overflow:hidden;background:var(--color-neutral-200)\">\n              <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ pr.pct }}%;background:{{ pr.color }};transition:width .5s ease\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">{{ pr.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <!-- accountability: the review used to collect reasons and then throw\n             them away. This card keeps the week's planned/done/skipped story\n             visible, including the session where postponement clusters. -->\n        <div class=\"reveal card-panel\" style=\"margin-top:var(--space-8)\">\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-4)\">\n            <h4 style=\"margin:0\">Planned vs done vs skipped<\u002Fh4>\n            <span class=\"text-muted\" style=\"font-size:11px;margin-left:auto;white-space:nowrap\">This week to date<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)\">\n            <div style=\"padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-neutral-100)\">\n              <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:25px\">{{ accountabilityPlanned }}<\u002Fdiv>\n              <div class=\"text-muted\" style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px\">planned<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:var(--space-3);border-radius:var(--radius-md);background:var(--card-mint);color:var(--ink-mint)\">\n              <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:25px;color:inherit\">{{ accountabilityDone }}<\u002Fdiv>\n              <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px;opacity:.75\">done<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:var(--space-3);border-radius:var(--radius-md);background:var(--card-rose);color:var(--ink-rose)\">\n              <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:25px;color:inherit\">{{ accountabilitySkipped }}<\u002Fdiv>\n              <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px;opacity:.75\">skipped<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:var(--space-3) 0 0;line-height:1.4\">{{ accountabilityNote }}<\u002Fp>\n\n          <sc-if value=\"{{ hasSkipPlaces }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--color-divider)\">\n              <h6 style=\"margin:0 0 var(--space-3)\">Where tasks are getting postponed<\u002Fh6>\n              <sc-for list=\"{{ skipPlaces }}\" as=\"sp\" hint-placeholder-count=\"3\">\n                <div style=\"margin-bottom:var(--space-3)\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px\">\n                    <span style=\"font-family:var(--font-heading);font-weight:700\">{{ sp.label }}<\u002Fspan>\n                    <span class=\"text-muted\" style=\"font-size:12px\">{{ sp.count }} skipped<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:4px;border-radius:var(--radius-pill);overflow:hidden;background:var(--color-neutral-200)\">\n                    <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ sp.pct }}%;background:var(--color-accent-2)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- growth: four weeks read back, in both directions.\n             The bars are hours (how much work actually happened); the number\n             on each is the share of that week's tasks that got finished. Two\n             different questions, and the pair is what shows whether a good\n             percentage is a real week or a nearly empty one. -->\n        <div class=\"reveal card-panel\" style=\"margin-top:var(--space-8)\">\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2)\">\n            <h4 style=\"margin:0\">Growth<\u002Fh4>\n            <span class=\"text-muted\" style=\"font-size:11px;margin-left:auto;white-space:nowrap\">{{ growthWindow }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasGrowth }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <p style=\"font-size:14px;line-height:1.45;margin:0 0 var(--space-4)\">{{ growthHeadline }}<\u002Fp>\n            <div style=\"display:flex;align-items:flex-end;gap:var(--space-2)\">\n              <sc-for list=\"{{ growthBars }}\" as=\"gb\" hint-placeholder-count=\"4\">\n                <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:5px\">\n                  <div style=\"font-size:11px;font-family:var(--font-heading);font-weight:700\">{{ gb.pctText }}<\u002Fdiv>\n                  <div style=\"position:relative;width:100%;height:70px;display:flex;align-items:flex-end;justify-content:center\">\n                    <div style=\"width:62%;height:{{ gb.h }}px;background:{{ gb.color }};border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:height .5s ease\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"text-muted\" style=\"font-size:10px\">{{ gb.hoursText }}<\u002Fdiv>\n                  <div style=\"font-size:11px;font-family:var(--font-heading);font-weight:{{ gb.weight }}\">{{ gb.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-5);margin-top:var(--space-4)\">\n              <div>\n                <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:24px;line-height:1\">{{ growthRate }}<\u002Fdiv>\n                <div class=\"text-muted\" style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px\">this week<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:24px;line-height:1\">{{ growthConsistency }}<\u002Fdiv>\n                <div class=\"text-muted\" style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px\">days you showed up<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:24px;line-height:1\">{{ growthHours }}<\u002Fdiv>\n                <div class=\"text-muted\" style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px\">hours in 4 weeks<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:12px;margin:var(--space-3) 0 0;font-family:var(--font-heading);font-weight:700;color:{{ growthDeltaColor }}\">{{ growthDeltaText }}<\u002Fp>\n            <p class=\"text-muted\" style=\"font-size:11px;margin:var(--space-2) 0 0;line-height:1.4\">Each bar is a seven-day stretch counting back from today. Its height is the hours of work you finished; the figure above it is the share of that stretch's tasks you completed.<\u002Fp>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasGrowth }}\" hint-placeholder-val=\"{{ true }}\"><\u002Fsc-if>\n          <sc-if value=\"{{ noGrowth }}\" hint-placeholder-val=\"{{ false }}\">\n            <p class=\"text-muted\" style=\"font-size:13px;margin:0;line-height:1.45\">{{ growthEmptyNote }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- by badge: the same four weeks, split by the kind of work.\n             One completion rate over everything hides the useful half of the\n             answer — office landing at 90% while personal lands at 30% is two\n             problems, not one number. -->\n        <sc-if value=\"{{ hasBadgeSplit }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"reveal card-panel\" style=\"margin-top:var(--space-6)\">\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2)\">\n            <h4 style=\"margin:0\">By badge<\u002Fh4>\n            <span class=\"text-muted\" style=\"font-size:11px;margin-left:auto;white-space:nowrap\">{{ growthWindow }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.45;margin:0 0 var(--space-4)\">{{ badgeHeadline }}<\u002Fp>\n          <sc-for list=\"{{ badgeBars }}\" as=\"bb\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:var(--space-3)\">\n              <div style=\"display:flex;align-items:baseline;gap:6px;margin-bottom:5px;flex-wrap:wrap\">\n                <span class=\"tag\" style=\"background:{{ bb.bg }};color:{{ bb.fg }}\">{{ bb.name }}<\u002Fspan>\n                <span style=\"font-size:13px;font-family:var(--font-heading);font-weight:700\">{{ bb.pctText }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"font-size:12px\">{{ bb.countText }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"font-size:12px;margin-left:auto;white-space:nowrap\">{{ bb.hoursText }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:6px;border-radius:var(--radius-pill);overflow:hidden;background:var(--co
