lor-neutral-200)\">\n                <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ bb.pct }}%;background:{{ bb.barColor }};transition:width .5s ease\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <p class=\"text-muted\" style=\"font-size:11px;margin:var(--space-2) 0 0;line-height:1.4\">{{ badgeSplitNote }}<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- strengths -->\n        <sc-if value=\"{{ hasStrengths }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"reveal\" style=\"margin-top:var(--space-8)\">\n          <h6 style=\"margin:0 0 var(--space-3)\">What is working<\u002Fh6>\n          <sc-for list=\"{{ strengths }}\" as=\"sg\" hint-placeholder-count=\"3\">\n            <div style=\"padding:var(--space-3);border-radius:var(--radius-md);background:var(--card-mint);color:var(--ink-mint);margin-bottom:var(--space-2)\">\n              <div style=\"font-family:var(--font-heading);font-weight:700;font-size:14px\">{{ sg.label }}<\u002Fdiv>\n              <div style=\"font-size:13px;margin-top:3px;line-height:1.4;opacity:.85\">{{ sg.detail }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- weak spots -->\n        <sc-if value=\"{{ hasWeakSpots }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"reveal\" style=\"margin-top:var(--space-6)\">\n          <h6 style=\"margin:0 0 var(--space-3)\">What is holding you back<\u002Fh6>\n          <sc-for list=\"{{ weakSpots }}\" as=\"wk\" hint-placeholder-count=\"3\">\n            <div style=\"padding:var(--space-3);border-radius:var(--radius-md);background:var(--card-rose);color:var(--ink-rose);margin-bottom:var(--space-2)\">\n              <div style=\"font-family:var(--font-heading);font-weight:700;font-size:14px\">{{ wk.label }}<\u002Fdiv>\n              <div style=\"font-size:13px;margin-top:3px;line-height:1.4;opacity:.85\">{{ wk.detail }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- what to improve -->\n        <sc-if value=\"{{ hasAdvice }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"reveal\" style=\"margin-top:var(--space-8)\">\n          <h6 style=\"margin:0 0 var(--space-3)\">What to improve<\u002Fh6>\n          <sc-for list=\"{{ advice }}\" as=\"a\" hint-placeholder-count=\"2\">\n            <p style=\"font-size:15px;font-style:italic;line-height:1.4;margin:0 0 var(--space-3);padding-left:var(--space-3);border-left:2px solid var(--color-accent-2)\">{{ a }}<\u002Fp>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- where the day goes -->\n        <h6 class=\"reveal\" style=\"margin:var(--space-8) 0 var(--space-3)\">Where the day goes<\u002Fh6>\n        <sc-for list=\"{{ blockStats }}\" as=\"b\" hint-placeholder-count=\"3\">\n          <div style=\"margin-bottom:var(--space-3)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px\">\n              <span style=\"font-family:var(--font-heading);font-weight:700\">{{ b.label }}<\u002Fspan>\n              <span class=\"text-muted\" style=\"font-size:12px\">{{ b.note }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:3px;border-radius:var(--radius-pill);overflow:hidden;background:var(--color-neutral-200)\">\n              <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ b.barPct }}%;background:{{ b.color }};transition:width .4s ease\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <!-- the week -->\n        <h6 class=\"reveal\" style=\"margin:var(--space-8) 0 var(--space-3)\">Planned against done<\u002Fh6>\n        <div style=\"display:flex;align-items:flex-end;gap:var(--space-2);height:112px\">\n          <sc-for list=\"{{ week }}\" as=\"w\" hint-placeholder-count=\"7\">\n            <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:6px\">\n              <div style=\"position:relative;width:100%;height:94px;display:flex;align-items:flex-end;justify-content:center\">\n                <div style=\"width:64%;height:{{ w.plannedH }}px;background:var(--color-neutral-200);position:absolute;bottom:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0\"><\u002Fdiv>\n                <div style=\"width:64%;height:{{ w.doneH }}px;background:{{ w.doneColor }};position:absolute;bottom:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:height .5s ease\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;font-family:var(--font-heading);font-weight:{{ w.weight }};color:{{ w.labelColor }}\">{{ w.d }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:var(--space-6);margin-top:var(--space-4)\">\n          <div>\n            <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:clamp(26px,7.6vw,34px);line-height:.92\">{{ weekPct }}%<\u002Fdiv>\n            <div class=\"text-muted\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:5px\">completed<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:clamp(26px,7.6vw,34px);line-height:.92\">{{ weekHours }}<\u002Fdiv>\n            <div class=\"text-muted\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:5px\">hours<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:clamp(26px,7.6vw,34px);line-height:.92;color:var(--color-accent-700)\">{{ weekStreak }}<\u002Fdiv>\n            <div class=\"text-muted\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:5px\">day streak<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3)\">\n          <div style=\"display:flex;gap:4px;flex:none\">\n            <sc-for list=\"{{ freezePips }}\" as=\"fp\" hint-placeholder-count=\"2\">\n              <span style=\"width:11px;height:11px;border-radius:var(--radius-sm);background:{{ fp.bg }};border:1.5px solid {{ fp.border }}\"><\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0;line-height:1.4\">{{ freezeText }} Best run {{ streakBest }} days.<\u002Fp>\n        <\u002Fdiv>\n\n        <!-- plan counts -->\n        <h6 class=\"reveal\" style=\"margin:var(--space-8) 0 var(--space-3)\">Your plan<\u002Fh6>\n        <div style=\"display:flex;gap:var(--space-4)\">\n          <div style=\"flex:1\"><div class=\"stat\" style=\"font-family:var(--font-heading);font-size:26px\">{{ monthCount }}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px\">targets<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1\"><div class=\"stat\" style=\"font-family:var(--font-heading);font-size:26px\">{{ weekCount }}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px\">plan parts<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1\"><div class=\"stat\" style=\"font-family:var(--font-heading);font-size:26px\">{{ dayCount }}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px\">today<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1\"><div class=\"stat\" style=\"font-family:var(--font-heading);font-size:26px\">{{ goalCount }}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px\">goals<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-2);margin-top:var(--space-4)\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goGoals }}\" style=\"flex:1\">Goals<\u002Fbutton>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goLog }}\" style=\"flex:1\">Daily log<\u002Fbutton>\n        <\u002Fdiv>\n\n        <!-- weakest recall -->\n        <sc-if value=\"{{ hasWeak }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"reveal\" style=\"margin-top:var(--space-8)\">\n          <h6 style=\"margin:0 0 var(--space-3)\">Weakest recall<\u002Fh6>\n          <sc-for list=\"{{ weakCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:var(--space-3)\">\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px\">\n                <span>{{ c.heading }}<\u002Fspan>\n                <span class=\"text-muted\">{{ c.group }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:3px;border-radius:var(--radius-pill);overflow:hidden;background:var(--color-neutral-200)\">\n                <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ c.strength }}%;background:{{ c.color }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- slip reasons -->\n        <sc-if value=\"{{ hasReasons }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"reveal\" style=\"margin-top:var(--space-8)\">\n          <h6 style=\"margin:0 0 var(--space-3)\">Why tasks are getting postponed<\u002Fh6>\n          <sc-for list=\"{{ reasons }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2);padding:9px 0;border-bottom:1px solid var(--color-divider)\">\n              <span style=\"flex:1;font-size:14px\">{{ r.label }}<\u002Fspan>\n              <span style=\"font-family:var(--font-heading);font-weight:700;font-size:15px;color:{{ r.color }}\">{{ r.count }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ TODAY ════════════════ -->\n      <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <div style=\"display:flex;align-items:flex-end;gap:var(--space-2)\">\n          <div style=\"flex:1;min-width:0\">\n            <h2 style=\"margin:0\">{{ viewTitle }}<\u002Fh2>\n            <p class=\"text-muted\" style=\"font-size:13px;margin:3px 0 0\">{{ viewSubtitle }}<\u002Fp>\n          <\u002Fdiv>\n          <sc-if value=\"{{ viewNotToday }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ backToToday }}\" style=\"flex:none;font-size:12px\">Today<\u002Fbutton>\n          <\u002Fsc-if>\n          <!-- Adding still belongs to Plan for anything with a target above it.\n               This is the other case: you have navigated to a specific day and\n               want something on THAT day. It arrives dated, so there is no\n               picking the date twice. -->\n          <button sc-camel-on-click=\"{{ addOnDay }}\" aria-label=\"{{ addOnDayLabel }}\" title=\"{{ addOnDayLabel }}\" style=\"flex:none;width:38px;height:38px;border-radius:var(--radius-pill);border:0;background:var(--color-accent);color:var(--color-bg);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow-sm)\">\n            <span style=\"font-family:var(--font-heading);font-weight:600;font-size:22px;line-height:1;margin-top:-2px\">+<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <!-- the week, a fortnight of it reachable by scrolling -->\n        <div class=\"day-strip\" style=\"display:flex;gap:7px;margin-top:var(--space-4);overflow-x:auto;padding-bottom:var(--space-2)\">\n          <sc-for list=\"{{ dayStrip }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ d.pick }}\" aria-label=\"{{ d.aria }}\" style=\"flex:none;width:46px;padding:9px 0 10px;border-radius:var(--radius-md);border:1px solid {{ d.border }};background:{{ d.bg }};color:{{ d.fg }};cursor:pointer;display:grid;gap:3px;justify-items:center;transition:background .18s,color .18s\">\n              <span style=\"font-size:11px;opacity:.75;font-family:var(--font-heading);font-weight:600\">{{ d.dow }}<\u002Fspan>\n              <span style=\"font-size:17px;font-family:var(--font-heading);font-weight:700;line-height:1\">{{ d.num }}<\u002Fspan>\n              <span style=\"width:5px;height:5px;border-radius:50%;background:{{ d.dot }}\"><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:var(--space-2);margin-top:var(--space-3)\">\n          <div style=\"flex:1;background:var(--card-violet);color:var(--ink-violet);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4)\">\n            <div style=\"font-size:24px;font-family:var(--font-heading);font-weight:700;line-height:1.1\">{{ viewDone }}/{{ viewTotal }}<\u002Fdiv>\n            <div style=\"font-size:12px;opacity:.8;margin-top:2px\">finished<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;background:var(--card-amber);color:var(--ink-amber);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4)\">\n            <div style=\"font-size:21px;font-family:var(--font-heading);font-weight:700;line-height:1.1\">{{ viewTimeComparison }}<\u002Fdiv>\n            <div style=\"font-size:12px;opacity:.8;margin-top:2px\">actual / planned · whole day<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- every session, used against planned — the day tiles above are the\n             whole day, and the cards below only exist where there is work -->\n        <div class=\"card-panel\" style=\"margin-top:var(--space-3);padding:var(--space-3) var(--space-4)\">\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2)\">\n            <h6 style=\"margin:0\">Time used against planned<\u002Fh6>\n            <span class=\"text-muted\" style=\"font-size:11px;margin-left:auto;white-space:nowrap\">{{ sessionUseTotal }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ sessionUse }}\" as=\"su\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:var(--space-2)\">\n              <div style=\"display:flex;align-items:baseline;gap:var(--space-2);font-size:13px\">\n                <span style=\"font-family:var(--font-heading);font-weight:700\">{{ su.label }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-family:var(--font-heading);font-weight:700;font-size:12px\">{{ su.text }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"font-size:11px;white-space:nowrap\">{{ su.capText }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:4px;border-radius:var(--radius-pill);overflow:hidden;background:var(--color-neutral-200);margin-top:4px\">\n                <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ su.pct }}%;background:{{ su.color }};transition:width .4s ease\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasCarried }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:13px;margin:var(--space-3) 0 0;padding:var(--space-2) var(--space-3);border-left:3px solid var(--color-accent-2);background:var(--color-accent-2-100);color:var(--color-accent-2-800);line-height:1.4\">{{ carriedNote }}<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ viewIsToday }}\" hint-placeholder-val=\"{{ true }}\">\n          <p class=\"text-muted\" style=\"font-size:12px;margin:var(--space-3) 0 0;font-style:italic\">Timed tasks follow the clock. Press and hold an untimed task to reorder it.<\u002Fp>\n          <sc-if value=\"{{ noRoutines }}\" hint-placeholder-val=\"{{ true }}\">\n            <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ goRoutineSetting }}\" style=\"margin-top:var(--space-3)\">Add a daily routine<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasRoutines }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ goRoutineSetting }}\" style=\"margin-top:var(--space-3);font-size:13px\">Edit daily routine<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasSchedule }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"reveal\" style=\"margin-top:var(--space-6)\">\n          <h6 style=\"margin:0 0 var(--space-3)\">Fixed today<\u002Fh6>\n          <sc-for list=\"{{ schedule }}\" as=\"e\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;gap:var(--space-3);align-items:baseline;padding:7px 0;opacity:{{ e.opacity }}\">\n              <div style=\"width:66px;flex:none;text-align:right;font-family:var(--font-heading);font-weight:700;font-size:14px;color:var(--color-accent-2)\">{{ e.time }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0;font-size:15px\">{{ e.title }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noBlocks }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:var(--space-8);padding-top:var(--space-6);border-top:2px solid var(--color-text)\">\n            <h4 style=\"margin:0 0 var(--space-2)\">{{ emptyDayTitle }}<\u002Fh4>\n            <p class=\"text-muted\" style=\"font-size:14px;margin:0 0 var(--space-4);line-height:1.45\">Days are filled in from Plan — set a target, break it down, and the pieces land on their dates.<\u002Fp>\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ goPlanDay }}\" style=\"margin:0\">Open Plan<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"3\">\n          <div class=\"reveal\" style=\"margin-top:var(--space-4);background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-4);box-shadow:var(--shadow-sm)\">\n            <div style=\"background:{{ b.cardBg }};color:{{ b.cardInk }};border-radius:var(--radius-md);padding:var(--space-3) var(--space-3) var(--space-2);margin:calc(var(--space-2) * -1) calc(var(--space-2) * -1) var(--space-3)\">\n              <div style=\"display:flex;align-items:baseline;gap:var(--space-2)\">\n                <h4 style=\"margin:0;color:inherit\">{{ b.label }}<\u002Fh4>\n                <span style=\"font-size:12px;margin-left:auto;opacity:.75\">{{ b.time }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2)\">\n                <div style=\"flex:1;height:6px;border-radius:var(--radius-pill);background:color-mix(in srgb, currentColor 18%, transparent);overflow:hidden\">\n                  <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ b.fillPct }}%;background:currentColor;opacity:{{ b.fillOpacity }};transition:width .4s ease\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:11px;font-family:var(--font-heading);font-weight:700;white-space:nowrap\">{{ b.assigned }}/{{ b.capacity }} min<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ b.over }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:13px;font-style:italic;color:var(--color-accent-2-800);margin:0 0 var(--space-2)\">Over by {{ b.overBy }} minutes — move something before you start.<\u002Fp>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ b.routines }}\" as=\"r\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n                <button class=\"tap\" sc-camel-on-click=\"{{ r.toggle }}\" aria-label=\"Toggle routine done\" style=\"flex:none;width:22px;height:22px;margin-top:3px;border-radius:50%;border:1.5px solid {{ r.dotBorder }};background:{{ r.dotBg }};color:var(--color-bg);cursor:pointer;display:grid;place-items:center;padding:0;animation:{{ r.anim }}\">\n                  <span style=\"font-size:12px;line-height:1;opacity:{{ r.checkOpacity }}\">✓<\u002Fspan>\n                <\u002Fbutton>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap\">\n                    <span class=\"tag tag-neutral\" style=\"display:inline-flex\">Routine<\u002Fspan>\n                    <sc-if value=\"{{ r.isSkipped }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span class=\"tag tag-accent-2\">{{ r.skipLabelText }}<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font-size:16px;line-height:1.3;opacity:{{ r.textOpacity }};text-decoration:{{ r.strike }}\">{{ r.title }}<\u002Fdiv>\n                  <sc-if value=\"{{ r.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"text-muted\" style=\"font-size:13px;margin-top:3px;line-height:1.35\">{{ r.note }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">{{ r.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ r.skip }}\" style=\"flex:none;font-size:12px;align-self:flex-start\">{{ r.skipLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-for list=\"{{ b.tasks }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div data-id=\"{{ t.id }}\" data-list=\"{{ t.list }}\" data-drag=\"{{ t.drag }}\" style=\"display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider);touch-action:pan-y\">\n                <button class=\"tap\" sc-camel-on-click=\"{{ t.toggle }}\" aria-label=\"Toggle done\" style=\"flex:none;width:22px;height:22px;margin-top:3px;border-radius:50%;border:1.5px solid {{ t.dotBorder }};background:{{ t.dotBg }};color:var(--color-bg);cursor:pointer;display:grid;place-items:center;padding:0;animation:{{ t.anim }}\">\n                  <span style=\"font-size:12px;line-height:1;opacity:{{ t.checkOpacity }}\">✓<\u002Fspan>\n                <\u002Fbutton>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px\">\n                    <span class=\"tag {{ t.sessionTag }}\">{{ t.sessionLabel }}<\u002Fspan>\n                    <sc-if value=\"{{ t.hasBadge }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag\" style=\"background:{{ t.badgeBg }};color:{{ t.badgeFg }}\">{{ t.badgeName }}<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ t.repeats }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag {{ t.repeatTag }}\">↻ {{ t.repeatLabel }}<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ t.carried }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-outline\" title=\"{{ t.carriedTitle }}\">{{ t.carriedLabel }}<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ t.isSkipped }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-accent-2\">{{ t.skipLabelText }}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ t.hasParent }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"text-muted\" style=\"font-size:11px;margin-bottom:2px;letter-spacing:.02em\">{{ t.parentTitle }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"font-size:16px;line-height:1.3;opacity:{{ t.textOpacity }};text-decoration:{{ t.strike }}\">{{ t.title }}<\u002Fdiv>\n                  <sc-if value=\"{{ t.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"text-muted\" style=\"font-size:13px;margin-top:3px;line-height:1.35\">{{ t.note }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">{{ t.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"row-actions\" style=\"flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px\">\n                  <sc-if value=\"{{ t.canSkip }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ t.skip }}\" style=\"font-size:12px\">{{ t.skipLabel }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ t.canFocus }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ t.focus }}\" style=\"font-size:12px\">Focus<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ t.edit }}\" aria-label=\"Edit task\" style=\"font-size:12px\">Edit<\u002Fbutton>\n                  <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ t.remove }}\" aria-label=\"Delete task\" style=\"font-size:12px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <!-- Routines already ruled on, kept or skipped. They render here\n                 rather than above the tasks because routines and tasks are\n                 separate lists and cannot interleave: left where they were, a\n                 struck row sat on top of everything still to be done. -->\n            <sc-for list=\"{{ b.routinesSettled }}\" as=\"r\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n                <button class=\"tap\" sc-camel-on-click=\"{{ r.toggle }}\" aria-label=\"Toggle routine done\" style=\"flex:none;width:22px;height:22px;margin-top:3px;border-radius:50%;border:1.5px solid {{ r.dotBorder }};background:{{ r.dotBg }};color:var(--color-bg);cursor:pointer;display:grid;place-items:center;padding:0;animation:{{ r.anim }}\">\n                  <span style=\"font-size:12px;line-height:1;opacity:{{ r.checkOpacity }}\">✓<\u002Fspan>\n                <\u002Fbutton>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap\">\n                    <span class=\"tag tag-neutral\" style=\"display:inline-flex\">Routine<\u002Fspan>\n                    <sc-if value=\"{{ r.isSkipped }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span class=\"tag tag-accent-2\">{{ r.skipLabelText }}<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font-size:16px;line-height:1.3;opacity:{{ r.textOpacity }};text-decoration:{{ r.strike }}\">{{ r.title }}<\u002Fdiv>\n                  <sc-if value=\"{{ r.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"text-muted\" style=\"font-size:13px;margin-top:3px;line-height:1.35\">{{ r.note }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">{{ r.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ r.skip }}\" style=\"flex:none;font-size:12px;align-self:flex-start\">{{ r.skipLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <!-- What this session was asked for and did not do. The work has\n                 moved on — the review carried it to tomorrow, or midnight did\n                 — so there is no live row left on this date to strike; without\n                 this the day reads as though nothing was ever asked of it. -->\n            <sc-for list=\"{{ b.missed }}\" as=\"m\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n                <span aria-hidden=\"true\" style=\"flex:none;width:22px;height:22px;margin-top:3px;border-radius:50%;border:1.5px dashed var(--color-neutral-400);display:grid;place-items:center;font-size:12px;line-height:1;color:var(--color-neutral-600)\">–<\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px\">\n                    <span class=\"tag tag-accent-2\">{{ m.skipLabelText }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:16px;line-height:1.3;opacity:0.5;text-decoration:line-through\">{{ m.title }}<\u002Fdiv>\n                  <div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">{{ m.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{ canReview }}\" hint-placeholder-val=\"{{ true }}\">\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ openReview }}\" style=\"margin-top:var(--space-6)\">Review the day<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ PLAN: one date-first list ════════════════ -->\n      <sc-if value=\"{{ isPlan }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Plan<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 var(--space-4)\">{{ planIntro }}<\u002Fp>\n\n        <div style=\"position:relative;margin-bottom:var(--space-4)\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-neutral-600);pointer-events:none\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-4-4\"><\u002Fpath><\u002Fsvg>\n          <input class=\"input\" type=\"search\" value=\"{{ planSearch }}\" sc-camel-on-input=\"{{ setPlanSearch }}\" aria-label=\"Search all planned tasks\" placeholder=\"Search planned tasks\" style=\"padding-left:40px;padding-right:42px;font-size:16px\">\n          <sc-if value=\"{{ planSearching }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn btn-icon tap\" sc-camel-on-click=\"{{ clearPlanSearch }}\" aria-label=\"Clear task search\" style=\"position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;font-size:20px;color:var(--color-neutral-700)\">×<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- Badge chips: a view over the same list, never a change to it.\n             The number on each is what is still open under that badge. -->\n        <div class=\"pill-row\" style=\"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:var(--space-4)\">\n          <sc-for list=\"{{ badgeChips }}\" as=\"bc\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ bc.pick }}\" style=\"padding:7px 12px;border-radius:var(--radius-md);border:1px solid {{ bc.border }};background:{{ bc.bg }};color:{{ bc.fg }};font-size:12px;font-family:var(--font-heading);font-weight:700;cursor:pointer\">{{ bc.label }} {{ bc.count }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ planNotSearching }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2);padding-top:var(--space-3);border-top:2px solid var(--color-text)\">\n              <h4 style=\"margin:0\">{{ planHeading }}<\u002Fh4>\n              <span class=\"text-muted\" style=\"font-size:12px;margin-left:auto\">{{ planSummary }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ noPlan }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:var(--space-4)\">\n                <p class=\"text-muted\" style=\"font-size:14px;margin:0 0 var(--space-4);line-height:1.45\">Nothing here yet. Add a task, choose its date, then say whether it belongs only on that date or needs regular contribution before it.<\u002Fp>\n                <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ addPlan }}\" style=\"margin:0\">{{ addPlanLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ planSearching }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2);padding-top:var(--space-3);border-top:2px solid var(--color-text)\">\n              <h4 style=\"margin:0\">Search results<\u002Fh4>\n              <span class=\"text-muted\" style=\"font-size:12px;margin-left:auto\">{{ planSearchSummary }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ noPlan }}\" hint-placeholder-val=\"{{ false }}\">\n              <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-4) 0;line-height:1.45\">No planned tasks match “{{ planSearch }}”.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ planRows }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n            <div style=\"display:flex;gap:var(--space-3)\">\n              <button class=\"tap\" sc-camel-on-click=\"{{ t.toggle }}\" aria-label=\"Toggle done\" style=\"flex:none;width:22px;height:22px;margin-top:3px;border-radius:50%;border:1.5px solid {{ t.dotBorder }};background:{{ t.dotBg }};color:var(--color-bg);cursor:pointer;display:grid;place-items:center;padding:0;animation:{{ t.anim }}\">\n                <span style=\"font-size:12px;line-height:1;opacity:{{ t.checkOpacity }}\">✓<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"flex:1;min-width:0\">\n                <sc-if value=\"{{ t.showScope }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap\">\n                    <span class=\"tag tag-accent\">{{ t.scopeLabel }}<\u002Fspan>\n                    <sc-if value=\"{{ t.showParent }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span class=\"text-muted\" style=\"font-size:11px\">{{ t.parentLabel }}<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px\">\n                  <sc-if value=\"{{ t.hasBadge }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag\" style=\"background:{{ t.badgeBg }};color:{{ t.badgeFg }}\">{{ t.badgeName }}<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ t.repeats }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag {{ t.repeatTag }}\">↻ {{ t.repeatLabel }}<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-size:16px;line-height:1.3;opacity:{{ t.textOpacity }};text-decoration:{{ t.strike }}\">{{ t.title }}<\u002Fdiv>\n                <sc-if value=\"{{ t.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"text-muted\" style=\"font-size:13px;margin-top:3px;line-height:1.35\">{{ t.note }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;gap:var(--space-2);align-items:baseline;margin-top:4px;flex-wrap:wrap\">\n                  <span class=\"text-muted\" style=\"font-size:12px\">{{ t.meta }}<\u002Fspan>\n                  <sc-if value=\"{{ t.hasDue }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"font-family:var(--font-heading);font-weight:700;font-size:11px;color:{{ t.dueColor }}\">{{ t.due }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ t.hasKids }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ t.toggleOpen }}\" style=\"margin-top:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--color-accent);font-family:var(--font-heading);font-weight:700;font-size:12px\">{{ t.caret }} {{ t.kidSummary }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div class=\"row-actions\" style=\"flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px\">\n                <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ t.edit }}\" aria-label=\"Edit\" style=\"font-size:12px\">Edit<\u002Fbutton>\n                <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ t.remove }}\" aria-label=\"Delete\" style=\"font-size:12px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ t.children }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;gap:var(--space-2);align-items:flex-start;padding:7px 0 7px {{ c.indent }};opacity:{{ c.opacity }}\">\n                <button class=\"tap\" sc-camel-on-click=\"{{ c.toggle }}\" aria-label=\"Toggle done\" style=\"flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;border:0;background:var(--color-accent-400);padding:0;cursor:pointer\"><\u002Fbutton>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:14px;line-height:1.35;text-decoration:{{ c.strike }}\">{{ c.title }}<\u002Fdiv>\n                  <sc-if value=\"{{ c.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"text-muted\" style=\"font-size:12px;margin-top:2px;line-height:1.35\">{{ c.note }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div class=\"text-muted\" style=\"font-size:11px;margin-top:2px\"><span class=\"tag tag-outline\">{{ c.scopeLabel }}<\u002Fspan> {{ c.when }} · {{ c.effort }}<sc-if value=\"{{ c.carried }}\" hint-placeholder-val=\"{{ false }}\"> · {{ c.carriedLabel }}<\u002Fsc-if><\u002Fdiv>\n                  <sc-if value=\"{{ c.canBreak }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ c.breakDown }}\" style=\"margin-top:6px;font-size:11px;padding:5px 10px\">{{ c.breakLabel }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ c.remove }}\" aria-label=\"Delete\" style=\"flex:none;font-size:11px;color:var(--color-accent-2-800)\">×<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ t.canBreak }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ t.breakDown }}\" style=\"margin-top:var(--space-2);font-size:12px;padding:6px 12px\">{{ t.breakLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{ planNotSearching }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-if value=\"{{ hasPlan }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ addPlan }}\" style=\"margin-top:var(--space-6)\">{{ addAnotherLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- The rules behind the dated rows above. A repeat is not a task: it\n             is the thing that keeps filing them, so it is listed apart and its\n             next few dates are shown so nothing has to be taken on trust. -->\n        <sc-if value=\"{{ planNotSearching }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:var(--space-8)\">\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-2);padding-top:var(--space-3);border-top:2px solid var(--color-text)\">\n            <h4 style=\"margin:0\">Repeating<\u002Fh4>\n            <span class=\"text-muted\" style=\"font-size:12px;margin-left:auto\">{{ seriesSummary }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ noSeries }}\" hint-placeholder-val=\"{{ true }}\">\n            <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-3) 0 0;line-height:1.45\">Nothing repeats yet. Anything with the same deadline every month — GST-1 by the 11th, GST-3B by the 20th — is added like any other task: pick its date, then say it comes back every month.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ seriesRows }}\" as=\"sr\" hint-placeholder-count=\"2\">\n            <div style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider);opacity:{{ sr.opacity }}\">\n              <div style=\"display:flex;gap:var(--space-3);align-items:flex-start\">\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px\">\n                    <span class=\"tag tag-accent\">{{ sr.cadence }}<\u002Fspan>\n                    <sc-if value=\"{{ sr.paused }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span class=\"tag tag-neutral\">paused<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font-size:16px;line-height:1.3\">{{ sr.title }}<\u002Fdiv>\n                  <div class=\"text-muted\" style=\"font-size:12px;margin-top:3px;line-height:1.4\">{{ sr.words }}<\u002Fdiv>\n                  <div class=\"text-muted\" style=\"font-size:12px;margin-top:2px\">{{ sr.nextText }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"row-actions\" style=\"flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px\">\n                  <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ sr.edit }}\" aria-label=\"Edit repeat\" style=\"font-size:12px\">Edit<\u002Fbutton>\n                  <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ sr.togglePause }}\" style=\"font-size:12px\">{{ sr.pauseLabel }}<\u002Fbutton>\n                  <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ sr.remove }}\" aria-label=\"Delete repeat\" style=\"font-size:12px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ LOG ════════════════\n           The Dashboard says how it is going; this says what happened. Every\n           entry is something the app was already told — nothing here is\n           inferred, and the reasons appear in the words they were written in. -->\n      <sc-if value=\"{{ isLog }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Daily log<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 var(--space-4);line-height:1.45\">{{ logSummary }}<\u002Fp>\n\n        <!-- Plan's search answers \"where is that task\". This one answers \"when\n             did I last do that\", and \"what did I keep writing as the reason\" —\n             which is the whole point of recording them in your own words. -->\n        <div style=\"position:relative;margin-bottom:var(--space-4)\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-neutral-600);pointer-events:none\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-4-4\"><\u002Fpath><\u002Fsvg>\n          <input class=\"input\" type=\"search\" value=\"{{ logSearch }}\" sc-camel-on-input=\"{{ setLogSearch }}\" aria-label=\"Search the daily log\" placeholder=\"Search days, tasks and reasons\" style=\"padding-left:40px;padding-right:42px;font-size:16px\">\n          <sc-if value=\"{{ logSearching }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn btn-icon tap\" sc-camel-on-click=\"{{ clearLogSearch }}\" aria-label=\"Clear log search\" style=\"position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;font-size:20px;color:var(--color-neutral-700)\">×<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ noLog }}\" hint-placeholder-val=\"{{ true }}\">\n          <p class=\"text-muted\" style=\"font-size:15px;margin:var(--space-6) 0;line-height:1.45\">{{ logEmptyNote }}<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ logRows }}\" as=\"lg\" hint-placeholder-count=\"6\">\n          <div class=\"reveal\" style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n            <button sc-camel-on-click=\"{{ lg.toggle }}\" style=\"width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--color-text)\">\n              <div style=\"display:flex;align-items:baseline;gap:var(--space-2)\">\n                <span style=\"font-family:var(--font-heading);font-weight:700;font-size:15px\">{{ lg.caret }} {{ lg.date }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"font-size:12px\">{{ lg.weekday }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:11px;font-family:var(--font-heading);font-weight:700;color:{{ lg.stateColor }};white-space:nowrap\">{{ lg.state }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:var(--space-2);margin-top:4px\">\n                <span style=\"font-size:14px\">{{ lg.headline }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"font-size:12px\">{{ lg.skippedText }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"font-size:12px;margin-left:auto;white-space:nowrap\">{{ lg.hours }} · felt {{ lg.mood }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:3px;border-radius:var(--radius-pill);overflow:hidden;background:var(--color-neutral-200);margin-top:7px\">\n                <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ lg.barDone }}%;background:{{ lg.barColor }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fbutton>\n\n            <sc-if value=\"{{ lg.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:var(--space-3);padding-left:var(--space-3);border-left:2px solid var(--color-divider)\">\n              <sc-if value=\"{{ lg.hasDone }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-bottom:var(--space-3)\">\n                  <h6 style=\"margin:0 0 var(--space-2)\">Finished<\u002Fh6>\n                  <sc-for list=\"{{ lg.done }}\" as=\"dn\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;gap:6px;align-items:baseline;padding:3px 0;flex-wrap:wrap\">\n                      <sc-if value=\"{{ dn.hasBadge }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span class=\"tag\" style=\"background:{{ dn.badgeBg }};color:{{ dn.badgeFg }}\">{{ dn.badge }}<\u002Fspan>\n                      <\u002Fsc-if>\n                      <span style=\"font-size:14px;flex:1;min-width:0\">{{ dn.title }}<\u002Fspan>\n                      <span class=\"text-muted\" style=\"font-size:12px;white-space:nowrap\">{{ dn.detail }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ lg.hasKept }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-bottom:var(--space-3)\">\n                  <h6 style=\"margin:0 0 var(--space-2)\">Routines kept<\u002Fh6>\n                  <sc-for list=\"{{ lg.kept }}\" as=\"kp\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;gap:6px;align-items:baseline;padding:3px 0\">\n                      <span style=\"font-size:14px;flex:1;min-width:0\">{{ kp.title }}<\u002Fspan>\n                      <span class=\"text-muted\" style=\"font-size:12px;white-space:nowrap\">{{ kp.detail }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ lg.hasMisses }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-bottom:var(--space-3)\">\n                  <h6 style=\"margin:0 0 var(--space-2)\">Did not happen, and why<\u002Fh6>\n                  <sc-for list=\"{{ lg.misses }}\" as=\"ms\" hint-placeholder-count=\"2\">\n                    <div style=\"padding:4px 0\">\n                      <div style=\"font-size:14px\">{{ ms.title }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:var(--color-accent-2-800)\">“{{ ms.reason }}” · {{ ms.where }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ lg.nothing }}\" hint-placeholder-val=\"{{ false }}\">\n                <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-3);font-style:italic\">A rest day — nothing was asked of it and nothing was recorded.<\u002Fp>\n              <\u002Fsc-if>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ lg.review }}\" style=\"font-size:12px;padding:6px 12px\">Open this day<\u002Fbutton>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <!-- The log as a file. A spreadsheet outlives the app, and \"show me\n             where the time went\" is sometimes a question for somebody who does\n             not have Task2Day on their phone. -->\n        <sc-if value=\"{{ canExportLog }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:var(--space-8);padding-top:var(--space-4);border-top:2px solid var(--color-text)\">\n          <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ exportLog }}\" style=\"margin:0\">{{ exportLogLabel }}<\u002Fbutton>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:var(--space-2) 0 0;line-height:1.4\">{{ exportLogNote }}<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ GOALS ════════════════ -->\n      <sc-if value=\"{{ isGoals }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Goals<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 var(--space-4);line-height:1.45\">The long horizon — \"Pass the exam\", \"Finish the survey\". A goal does not hold tasks of its own; you tag tasks to it when you add them, and its bar fills as those tasks get done. Entirely optional: most tasks belong to no goal.<\u002Fp>\n\n        <sc-if value=\"{{ noGoals }}\" hint-placeholder-val=\"{{ true }}\">\n          <p class=\"text-muted\" style=\"font-size:15px;margin:var(--space-6) 0;line-height:1.45\">No goals yet. Until you add one, the goal picker stays out of the way when you add a task.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ goals }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div class=\"reveal\" style=\"margin-top:var(--space-6);padding-top:var(--space-3);border-top:2px solid var(--color-text)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2)\">\n              <h3 style=\"margin:0\">{{ g.title }}<\u002Fh3>\n              <span class=\"tag {{ g.tag }}\">{{ g.deadline }}<\u002Fspan>\n            <\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:13px;margin:5px 0 var(--space-3)\">{{ g.summary }}<\u002Fp>\n            <div style=\"height:3px;border-radius:var(--radius-pill);overflow:hidden;background:var(--color-neutral-200)\">\n              <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ g.pct }}%;background:{{ g.barColor }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ g.remove }}\" style=\"margin-top:var(--space-2);font-size:12px;color:var(--color-accent-2-800);padding-inline:0\">Remove goal<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ addGoal }}\" style=\"margin-top:var(--space-6)\">New goal<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ════════════════ REVISE ════════════════ -->\n      <sc-if value=\"{{ isRevise }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Revision<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 0\">{{ dueCount }} due now across {{ cardCount }} cards<\u002Fp>\n\n        <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-6);padding-top:var(--space-3);border-top:2px solid var(--color-text)\">\n          <div style=\"flex:1;min-width:0\">\n            <h4 style=\"margin:0 0 2px\">Recall popups<\u002Fh4>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:0\">{{ revStatus }}<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleRevision }}\" aria-label=\"Toggle revision mode\" style=\"flex:none;width:50px;height:28px;border-radius:var(--radius-md);border:1px solid var(--color-divider);cursor:pointer;background:{{ revSwitchBg }};position:relative;transition:background .2s\">\n            <span style=\"position:absolute;top:3px;left:{{ revKnob }};width:20px;height:20px;border-radius:var(--radius-sm);background:var(--color-bg);transition:left .2s\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-3)\">Subjects<\u002Fh6>\n        <sc-if value=\"{{ noGroups }}\" hint-placeholder-val=\"{{ true }}\">\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0 0 var(--space-4);line-height:1.45\">No subjects yet. Add one — Computer networks, Structural analysis — then attach formula images under it, each with its own heading.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div class=\"reveal\" style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2)\">\n              <button sc-camel-on-click=\"{{ g.toggleOpen }}\" style=\"flex:1;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--color-text);font-family:var(--font-heading)\">\n                <span style=\"font-weight:700;font-size:17px\">{{ g.caret }} {{ g.name }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"display:block;font-size:12px;margin-top:2px;font-family:var(--font-body)\">{{ g.countText }}<\u002Fspan>\n              <\u002Fbutton>\n              <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ g.revise }}\" style=\"flex:none;font-size:12px\">Revise all<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ g.cards }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) 0 var(--space-3) var(--space-4)\">\n                <div style=\"width:52px;height:52px;flex:none;background:var(--color-surface);display:grid;place-items:center;overflow:hidden\">\n                  <sc-if value=\"{{ c.hasImg }}\" hint-placeholder-val=\"{{ true }}\">\n                    <img alt=\"{{ c.heading }}\" data-card-img=\"{{ c.id }}\" style=\"width:52px;height:52px;object-fit:cover;border-radius:var(--radius-sm);background:var(--color-neutral-200);display:block\">\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ c.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                    <label style=\"width:52px;height:52px;display:grid;place-items:center;cursor:pointer;background:repeating-linear-gradient(45deg,var(--color-neutral-200) 0 4px,var(--color-surface) 4px 8px)\" title=\"Add a formula image\">\n                      <span style=\"font-family:var(--font-heading);font-weight:700;font-size:9px;letter-spacing:.08em;color:var(--color-neutral-700);text-align:center\">ADD<\u002Fspan>\n                      <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ c.onPick }}\" style=\"display:none\">\n                    <\u002Flabel>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-family:var(--font-heading);font-weight:700;font-size:15px;line-height:1.2\">{{ c.heading }}<\u002Fdiv>\n                  <div class=\"text-muted\" style=\"font-size:12px;margin:2px 0 6px\">{{ c.dueText }}<\u002Fdiv>\n                  <div style=\"height:3px;border-radius:var(--radius-pill);overflow:hidden;background:var(--color-neutral-200)\">\n                    <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ c.strength }}%;background:{{ c.barColor }};transition:width .4s ease\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;display:flex;flex-direction:column;align-items:flex-end\">\n                  <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ c.open }}\" style=\"font-size:12px\">Revise<\u002Fbutton>\n                  <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ c.remove }}\" aria-label=\"Delete card\" style=\"font-size:11px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;gap:var(--space-2);padding-left:var(--space-4);margin-top:var(--space-2)\">\n                <label class=\"btn btn-secondary\" style=\"font-size:12px;padding:8px 12px;cursor:pointer;min-height:44px\">\n                  Add image\n                  <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ g.onPick }}\" style=\"display:none\">\n                <\u002Flabel>\n                <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ g.remove }}\" style=\"font-size:12px;color:var(--color-accent-2-800);margin-left:auto\">Delete group<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ addGroup }}\" style=\"margin-top:var(--space-6)\">New subject<\u002Fbutton>\n        <p class=\"text-muted\" style=\"font-size:12px;margin-top:var(--space-3)\">Intervals stretch 1, 3, 7, 21, 45 days as you get a card right. \"Revise all\" walks a whole subject in one pass.<\u002Fp>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- The daily routine used to be a screen of its own, reached only from\n           a button on Today. It is a setting — it describes your week, not\n           your day — so it lives inside Settings now and Today only points at\n           it. -->\n\n      <!-- ════════════════ SETTINGS ════════════════ -->\n      <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"screen\" style=\"animation:rise .35s ease\">\n        <h2 style=\"margin:0\">Settings<\u002Fh2>\n        <p class=\"text-muted\" style=\"font-size:14px;margin:var(--space-2) 0 var(--space-4)\">Tune the app to your week.<\u002Fp>\n\n        <div style=\"display:flex;gap:var(--space-2);margin-bottom:var(--space-6)\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goLog }}\" style=\"flex:1\">Daily log<\u002Fbutton>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goGoals }}\" style=\"flex:1\">Goals<\u002Fbutton>\n        <\u002Fdiv>\n\n        <h6 style=\"margin:0 0 var(--space-2)\">Your available time<\u002Fh6>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-3);line-height:1.4\">Set the hours you actually have in each session. The capacity the app checks against is the span between them.<\u002Fp>\n        <sc-for list=\"{{ hourRows }}\" as=\"h\" hint-placeholder-count=\"3\">\n          <div style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2)\">\n              <span style=\"font-family:var(--font-heading);font-weight:700;font-size:15px\">{{ h.label }}<\u002Fspan>\n              <span style=\"margin-left:auto;font-family:var(--font-heading);font-weight:700;font-size:14px;color:var(--color-accent-700)\">{{ h.capacityText }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-2);align-items:center\">\n              <input class=\"input\" type=\"time\" value=\"{{ h.from }}\" sc-camel-on-change=\"{{ h.setFrom }}\" aria-label=\"Start time\" style=\"flex:1\">\n              <span class=\"text-muted\" style=\"font-size:13px\">to<\u002Fspan>\n              <input class=\"input\" type=\"time\" value=\"{{ h.to }}\" sc-camel-on-change=\"{{ h.setTo }}\" aria-label=\"End time\" style=\"flex:1\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-2)\">Badges<\u002Fh6>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-3);line-height:1.4\">Which part of your life a task belongs to — your own work, the office, a course. They colour the rows and filter the Plan list. New ones can be added straight from the add-a-task sheet; this is where they are removed.<\u002Fp>\n        <sc-for list=\"{{ badgeRows }}\" as=\"bg\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--color-divider)\">\n            <span class=\"tag\" style=\"background:{{ bg.bg }};color:{{ bg.fg }};flex:none\">{{ bg.name }}<\u002Fspan>\n            <span class=\"text-muted\" style=\"flex:1;min-width:0;font-size:12px\">{{ bg.usage }}<\u002Fspan>\n            <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ bg.remove }}\" aria-label=\"Delete badge\" style=\"flex:none;font-size:12px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;gap:var(--space-2);margin-top:var(--space-3)\">\n          <input class=\"input\" value=\"{{ badgeDraft }}\" sc-camel-on-input=\"{{ setBadgeDraft }}\" aria-label=\"New badge name\" placeholder=\"New badge\" style=\"flex:1\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ addBadgeFromSettings }}\" style=\"flex:none;padding-inline:var(--space-4)\">Add<\u002Fbutton>\n        <\u002Fdiv>\n\n        <h6 id=\"routines\" style=\"margin:var(--space-8) 0 var(--space-2)\">Daily routine<\u002Fh6>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-3);line-height:1.4\">The things that repeat — gym, cooking, a commute. They appear on Today by themselves on the days you pick, and never carry over: a routine is a rhythm, not a debt.<\u002Fp>\n        <sc-if value=\"{{ noRoutines }}\" hint-placeholder-val=\"{{ true }}\">\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0 0 var(--space-3);line-height:1.45\">Nothing set yet.<\u002Fp>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ routineRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)\">\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-2)\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-family:var(--font-heading);font-weight:700;font-size:15px;line-height:1.25\">{{ r.title }}<\u002Fdiv>\n                <sc-if value=\"{{ r.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"text-muted\" style=\"font-size:13px;margin-top:3px;line-height:1.35\">{{ r.note }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">{{ r.blockLabel }} · {{ r.minutes }} min · {{ r.daysText }}<\u002Fdiv>\n                <div class=\"text-muted\" style=\"font-size:11px;margin-top:2px\">{{ r.periodText }} · {{ r.recordText }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ r.edit }}\" style=\"flex:none;font-size:12px\">Edit<\u002Fbutton>\n              <button class=\"btn btn-ghost tap\" sc-camel-on-click=\"{{ r.remove }}\" aria-label=\"Delete routine\" style=\"flex:none;font-size:12px;color:var(--color-accent-2-800)\">Delete<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ addRoutine }}\" style=\"margin-top:var(--space-3);margin-bottom:var(--space-8)\">Add a routine<\u002Fbutton>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-3)\">Office days<\u002Fh6>\n        <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-8)\">\n          <sc-for list=\"{{ officeDays }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ d.toggle }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ d.border }};border-radius:var(--radius-md);background:{{ d.bg }};color:{{ d.fg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer;transition:background .15s\">{{ d.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h6 style=\"margin:0 0 var(--space-3)\">Notifications<\u002Fh6>\n        <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:15px\">Scheduled alerts<\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:2px 0 0\">{{ notifStatus }}<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleNotify }}\" aria-label=\"Toggle notifications\" style=\"flex:none;width:50px;height:28px;border-radius:var(--radius-md);border:1px solid var(--color-divider);cursor:pointer;background:{{ notifSwitchBg }};position:relative;transition:background .2s\">\n            <span style=\"position:absolute;top:3px;left:{{ notifKnob }};width:20px;height:20px;border-radius:var(--radius-sm);background:var(--color-bg);transition:left .2s\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>Morning reminder<\u002Flabel><input class=\"input\" type=\"time\" value=\"{{ reminderTime }}\" sc-camel-on-change=\"{{ setReminder }}\"><\u002Fdiv>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-3);line-height:1.4\">{{ notifReach }}<\u002Fp>\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ testNotify }}\">Send a test notification<\u002Fbutton>\n\n        <!-- The other switch, and the only one that survives the app closing.\n             Kept separate from the one above because it is a separate promise:\n             that one rings while Task2Day runs, this one rings anyway. -->\n        <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-6)\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:15px\">Reach me with the app closed<\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:2px 0 0;line-height:1.4\">{{ pushStatus }}<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ togglePush }}\" aria-label=\"Toggle push notifications\" style=\"flex:none;width:50px;height:28px;border-radius:var(--radius-md);border:1px solid var(--color-divider);cursor:pointer;background:{{ pushSwitchBg }};position:relative;transition:background .2s\">\n            <span style=\"position:absolute;top:3px;left:{{ pushKnob }};width:20px;height:20px;border-radius:var(--radius-sm);background:var(--color-bg);transition:left .2s\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:var(--space-2) 0 0;line-height:1.4\">{{ pushNote }}<\u002Fp>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-3)\">Recall frequency<\u002Fh6>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-3);line-height:1.4\">{{ freqSummary }}<\u002Fp>\n        <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-3)\">\n          <sc-for list=\"{{ freqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ f.set }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ f.border }};border-radius:var(--radius-md);background:{{ f.bg }};color:{{ f.fg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer;transition:background .15s\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-3);margin-bottom:var(--space-3)\">\n          <div class=\"field\" style=\"flex:1;margin:0\">\n            <label>Or every … minutes<\u002Flabel>\n            <input class=\"input\" type=\"number\" min=\"5\" max=\"720\" step=\"5\" value=\"{{ freqMin }}\" sc-camel-on-change=\"{{ setFreqField }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"flex:1;margin:0\">\n            <label>At most, per day<\u002Flabel>\n            <input class=\"input\" type=\"number\" min=\"1\" max=\"50\" step=\"1\" value=\"{{ dailyCap }}\" sc-camel-on-change=\"{{ setCap }}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-3);margin-bottom:var(--space-8)\">\n          <div class=\"field\" style=\"flex:1;margin:0\">\n            <label>Only from<\u002Flabel>\n            <input class=\"input\" type=\"time\" value=\"{{ recallFrom }}\" sc-camel-on-change=\"{{ setRecallFrom }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"flex:1;margin:0\">\n            <label>Until<\u002Flabel>\n            <input class=\"input\" type=\"time\" value=\"{{ recallTo }}\" sc-camel-on-change=\"{{ setRecallTo }}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h6 style=\"margin:0 0 var(--space-2)\">Appearance<\u002Fh6>\n        <div class=\"field\" style=\"margin-bottom:2px\"><label>Text size<\u002Flabel><\u002Fdiv>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-2);line-height:1.4\">{{ textScaleNote }}<\u002Fp>\n        <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-4);align-items:stretch\">\n          <sc-for list=\"{{ textScaleSteps }}\" as=\"ts\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ ts.set }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ ts.border }};border-radius:var(--radius-md);background:{{ ts.bg }};color:{{ ts.fg }};font-family:var(--font-heading);font-weight:700;font-size:{{ ts.size }};line-height:1;cursor:pointer;transition:background .15s\">{{ ts.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:var(--space-3)\">\n          <div style=\"flex:1;font-size:15px\">Dark theme<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Toggle dark theme\" style=\"flex:none;width:50px;height:28px;border-radius:var(--radius-md);border:1px solid var(--color-divider);cursor:pointer;background:{{ themeSwitchBg }};position:relative;transition:background .2s\">\n            <span style=\"position:absolute;top:3px;left:{{ themeKnob }};width:20px;height:20px;border-radius:var(--radius-sm);background:var(--color-bg);transition:left .2s\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-3)\">This device<\u002Fh6>\n        <div style=\"display:flex;align-items:center;gap:var(--space-3)\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:15px\">{{ installRowTitle }}<\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:2px 0 0;line-height:1.35\">{{ installRowNote }}<\u002Fp>\n          <\u002Fdiv>\n          <sc-if value=\"{{ notInstalled }}\" hint-placeholder-val=\"{{ true }}\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ doInstall }}\" style=\"flex:none\">Install<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-4)\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:15px\">App version<\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:2px 0 0;line-height:1.35\">{{ versionNote }}<\u002Fp>\n          <\u002Fdiv>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ hardRefresh }}\" style=\"flex:none\">Refresh<\u002Fbutton>\n        <\u002Fdiv>\n\n        <h6 style=\"margin:var(--space-8) 0 var(--space-3)\">Data<\u002Fh6>\n        <div style=\"padding:var(--space-3);border:1px solid var(--color-divider);border-radius:var(--radius-md);margin-bottom:var(--space-4)\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-2)\">\n            <span style=\"width:8px;height:8px;border-radius:50%;background:{{ syncDot }};flex:none\"><\u002Fspan>\n            <div style=\"font-size:15px;font-weight:600\">{{ syncTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:5px 0 0;line-height:1.4\">{{ syncDetail }}<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ confirmErase }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:var(--space-3);border:1px solid var(--color-accent-2);border-radius:var(--radius-md)\">\n            <p style=\"font-size:14px;margin:0 0 var(--space-3);line-height:1.4\">Erase every task, goal, card and image, here and in your account. This cannot be undone.<\u002Fp>\n            <div style=\"display:flex;gap:var(--space-2)\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cancelErase }}\" style=\"flex:1\">Cancel<\u002Fbutton>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ eraseAll }}\" style=\"flex:1;background:var(--color-accent-2)\">Erase<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ confirmErase }}\" hint-placeholder-val=\"{{ false }}\"><\u002Fsc-if>\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ askErase }}\" style=\"margin-top:var(--space-2)\">Erase everything<\u002Fbutton>\n\n        <div style=\"margin-top:var(--space-8);padding-top:var(--space-6);border-top:2px solid var(--color-text);display:flex;align-items:center;gap:var(--space-4)\">\n          <img src=\"icon-512.png\" alt=\"Task2Day\" style=\"width:56px;height:56px;object-fit:contain;flex:none\">\n          <div>\n            <h4 style=\"margin:0\">Task2Day<\u002Fh4>\n            <p class=\"text-muted\" style=\"font-size:13px;margin:3px 0 0;font-style:italic\">Task, Study, Steady growth.<\u002Fp>\n            <p class=\"text-muted\" style=\"font-size:11px;margin:6px 0 0;letter-spacing:.04em\">Version 2.0 · build {{ buildStamp }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:var(--space-6);display:flex;align-items:center;gap:var(--space-3)\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:14px\">{{ authEmail }}<\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:2px 0 0\">Signed in with Google · data syncs to your account<\u002Fp>\n          <\u002Fdiv>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ signOut }}\" style=\"flex:none\">Sign out<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <!-- focus timer -->\n    <sc-if value=\"{{ timerOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"timer-bar\" style=\"position:absolute;bottom:56px;left:0;right:0;background:var(--color-text);color:var(--color-bg);padding:var(--space-2) var(--space-4);z-index:7;display:flex;align-items:center;gap:var(--space-3);animation:rise .3s ease\">\n        <div class=\"stat\" style=\"font-family:var(--font-heading);font-size:21px;min-width:62px\">{{ timerClock }}<\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ timerTitle }}<\u002Fdiv>\n          <div style=\"height:2px;background:color-mix(in srgb,var(--color-bg) 30%,transparent);margin-top:5px\">\n            <div style=\"height:100%;border-radius:var(--radius-pill);width:{{ timerPct }}%;background:var(--color-accent-300)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ timerPause }}\" style=\"flex:none;padding:6px 9px;border-radius:var(--radius-md);border:1px solid color-mix(in srgb,var(--color-bg) 45%,transparent);background:transparent;color:var(--color-bg);font-family:var(--font-heading);font-weight:600;font-size:12px;cursor:pointer\">{{ timerPauseLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ timerDone }}\" style=\"flex:none;padding:6px 9px;border-radius:var(--radius-md);border:none;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-weight:600;font-size:12px;cursor:pointer\">Done<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- bottom nav -->\n    <div class=\"bottom-nav\" style=\"position:absolute;bottom:0;left:0;right:0;height:56px;background:var(--color-bg);display:flex;align-items:center;justify-content:space-between;padding:0 4px;z-index:4\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n        <sc-if value=\"{{ n.isTab }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ n.go }}\" aria-current=\"{{ n.current }}\" aria-label=\"{{ n.label }}\" style=\"flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{ n.color }};padding:6px 2px;font-family:var(--font-heading);transition:color .2s\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"1.7\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" style=\"flex:none;display:block\"><path d=\"{{ n.icon
