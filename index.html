asked of that day\n        streak = on.some(t=>t.done) ? streak+1 : 0;\n        if(streak>best) best=streak;\n        settled=d;\n      });\n      return {tasks, history, lastRoll:now, recallsToday:0, streak, streakBest:best,\n        streakSettled:settled};\n    });\n    this.syncSeries();\n  }\n\n  /* ——— badges ———\n     Added from wherever you happen to need one — the add sheet has its own\n     \"New badge\" field — because a category you think of while filing a task\n     should not cost a trip to Settings. */\n  addBadge(name, assign){\n    const clean=String(name||'').trim();\n    if(!clean){ this.toast('Name the badge first'); return null; }\n    const existing=(this.state.badges||[]).filter(b=>\n      b.name.toLocaleLowerCase()===clean.toLocaleLowerCase())[0];\n    if(existing){\n      if(assign) this.setTaskField('badgeId', existing.id);\n      this.toast('\"'+existing.name+'\" already exists');\n      return existing.id;\n    }\n    const id=this.uid('b');\n    const tone=(this.state.badges||[]).length%BADGE_TONES.length;\n    this.setState(st=>({badges:[...st.badges, {id, name:clean, tone}]}));\n    if(assign) this.setTaskField('badgeId', id);\n    this.toast('Badge \"'+clean+'\" added');\n    return id;\n  }\n  /* Deleting a badge unfiles its tasks rather than deleting them — a label is\n     not the work, and losing a category should never lose a task. */\n  deleteBadge(id){\n    const b=(this.state.badges||[]).filter(x=>x.id===id)[0];\n    this.setState(st=>({\n      badges: st.badges.filter(x=>x.id!==id),\n      tasks: st.tasks.map(t=>t.badgeId===id?{...t, badgeId:''}:t),\n      series: st.series.map(s=>s.badgeId===id?{...s, badgeId:''}:s),\n      badgeFilter: st.badgeFilter===id?'':st.badgeFilter,\n    }));\n    this.toast(b?('\"'+b.name+'\" removed from the badges'):'Badge removed');\n  }\n  setBadgeFilter(id){ this.setState(st=>({badgeFilter: st.badgeFilter===id?'':id})); }\n\n  /* ——— repeating tasks ———\n     A routine is a rhythm with no debt attached; this is the other kind of\n     repetition — the one with a deadline. \"File GST-1 before the 11th, every\n     month\" is a real task with real minutes that must carry if it is missed,\n     so a series does not render itself: it FILES ordinary day tasks ahead of\n     time and then gets out of the way.\n\n     `made` records every due date already filed. It is what stops a deleted\n     occurrence coming back on the next launch, and it is why generation is\n     safe to run as often as we like. */\n  syncSeries(){\n    this.setState(st=>{\n      const now=todayISO(), to=addDays(now, HORIZON_DAYS);\n      /* Two independent guards against filing the same occurrence twice: the\n         rule's own `made` record, and the tasks actually on the board. The\n         second matters because Firebase drops an empty map, so a rule that has\n         filed nothing yet comes back with no `made` at all. */\n      const filed={};\n      st.tasks.forEach(t=>{ if(t.seriesId) filed[t.seriesId+'@'+(t.dueDate||t.date)]=true; });\n      let dirty=false;\n      const fresh=[], series=(st.series||[]).map(sr=>{\n        if(!sr || sr.paused) return sr;\n        const made={...(sr.made||{})};\n        let touched=false;\n        seriesDueDates(sr, now, to).forEach(due=>{\n          if(made[due]) return;\n          // already on the board without a record of it — record it and move on,\n          // so deleting that occurrence later still means \"not again\"\n          if(filed[sr.id+'@'+due]){ made[due]=true; touched=true; return; }\n          made[due]=true; touched=true;\n          // Notice lands `lead` days early, but never in a day already gone:\n          // a rule added on the 10th still puts this month's work on today.\n          const wanted=addDays(due, -Math.max(0, Number(sr.lead)||0));\n          const date=wanted<now?now:wanted;\n          fresh.push({\n            id:this.uid('t'), title:sr.title, note:sr.note||'',\n            scope:'day', parent:null, contribution:false,\n            goalId:sr.goalId||'', badgeId:sr.badgeId||'', priority:sr.priority||'Med',\n            minutes:sr.instant?0:Math.max(1, Number(sr.minutes)||1),\n            instant:!!sr.instant, done:false,\n            block:sr.at?this.blockFor(sr.at):(sr.block||'morning'),\n            date, dueDate:due, seriesId:sr.id,\n            ...(sr.at?{type:'event', at:sr.at}:{}),\n            order:0,\n          });\n        });\n        if(touched) dirty=true;\n        return touched?{...sr, made}:sr;\n      });\n      // a rule can be updated without producing work — a due date that was\n      // already on the board only needs recording\n      if(!fresh.length) return dirty?{series}:null;\n      // order is per session list, and every fresh task needs one that does not\n      // collide with the rows already there\n      const next={};\n      const seen=t=>'day:'+(t.block||'morning');\n      st.tasks.forEach(t=>{ if(t.scope!=='day') return;\n        const k=seen(t); next[k]=Math.max(next[k]||0, t.order==null?0:t.order); });\n      fresh.forEach(t=>{ const k=seen(t); next[k]=(next[k]||0)+1; t.order=next[k]; });\n      return {series, tasks:[...st.tasks, ...fresh]};\n    });\n  }\n  /* The date on the sheet is the first deadline, so the rule reads itself off\n     it: the 11th of August becomes \"the 11th of every month\", a Tuesday\n     becomes \"every Tuesday\". Nothing is asked twice. */\n  seriesBodyFrom(f, title){\n    const d=parseISO(f.date);\n    return {\n      title, note:String(f.note||'').trim(),\n      minutes:f.instant?0:Math.max(1, Math.round(Number(f.minutes))),\n      instant:!!f.instant,\n      block:f.at?this.blockFor(f.at):(f.block||'morning'),\n      at:f.at||'', priority:f.priority||'Med', goalId:f.goalId||'',\n      badgeId:f.badgeId||'',\n      unit: f.repeat==='day'?'day' : f.repeat==='week'?'week' : 'month',\n      // `days` has always been an array; until now the form only ever wrote\n      // the one weekday the date fell on, so Mon+Thu cost you two rules.\n      day:d.getDate(), days:repeatDaysOf(f),\n      every:Math.min(60, Math.max(1, Number(f.repeatEvery)||1)),\n      lead:Math.min(28, Math.max(0, Number(f.repeatLead)||0)),\n      // when the rule stops. Empty means \"no end\", which is what every rule\n      // written before this field existed meant, so it stays the default.\n      until:f.repeatUntil||'',\n      anchor:f.date,\n    };\n  }\n  createSeries(f, title){\n    const body=this.seriesBodyFrom(f, title);\n    /* `until` comes from the sheet now, so it must NOT be re-blanked here —\n       this line predates the field having any UI and quietly threw the end\n       date away, which made a rule with a stop date run forever. */\n    const sr={...body, id:this.uid('s'), made:{}, paused:false,\n      createdAt:todayISO()};\n    this.setState(st=>({series:[...st.series, sr], taskForm:null}));\n    // filing runs on the state that now holds the rule, not before it\n    setTimeout(()=>this.syncSeries(), 0);\n    this.toast('Repeats '+seriesWords(sr));\n  }\n  applySeriesEdit(f, title){\n    const body=this.seriesBodyFrom(f, title);\n    const sr=(this.state.series||[]).filter(x=>x.id===f.seriesEditing)[0]||{};\n    // A rule whose shape changed cannot reuse dates filed under the old one,\n    // so the occurrences ahead are withdrawn and filed again from the new rule.\n    const reshaped = sr.unit!==body.unit || sr.day!==body.day || sr.every!==body.every\n      || sr.lead!==body.lead || (sr.until||'')!==(body.until||'')\n      || String((sr.days||[]).join())!==String(body.days.join());\n    this.setState({taskForm:null});\n    if(!reshaped){ this.saveSeriesEdit(f.seriesEditing, body); this.toast('Repeat updated'); return; }\n    const now=todayISO();\n    this.setState(st=>({\n      series: st.series.map(x=>x.id===f.seriesEditing?{...x, ...body, made:{}}:x),\n      tasks: st.tasks.filter(t=>!(t.seriesId===f.seriesEditing && !t.done\n        && (t.dueDate||t.date)>=now)),\n    }));\n    setTimeout(()=>this.syncSeries(), 0);\n    this.toast('Now repeats '+seriesWords(body));\n  }\n  /* Editing the rule rewrites the occurrences it has already filed, but only\n     the ones still ahead and still open. A finished occurrence is history and\n     a past one is the record; neither gets rewritten under the user. */\n  saveSeriesEdit(id, body){\n    const now=todayISO();\n    this.setState(st=>({\n      series: st.series.map(sr=>sr.id===id?{...sr, ...body}:sr),\n      tasks: st.tasks.map(t=>{\n        // every occurrence still open, including one already carrying: a\n        // renamed task should not keep its old name just because it is late\n        if(t.seriesId!==id || t.done) return t;\n        const next={...t, title:body.title, note:body.note,\n          minutes:body.instant?0:Math.max(1, Number(body.minutes)||1),\n          instant:!!body.instant, priority:body.priority,\n          goalId:body.goalId||'', badgeId:body.badgeId||'',\n          block:body.at?this.blockFor(body.at):(body.block||'morning')};\n        // undefined is not a value Firebase will store — drop the keys instead\n        if(body.at){ next.type='event'; next.at=body.at; }\n        else { delete next.type; delete next.at; }\n        return next;\n      }),\n    }));\n  }\n  /* Deleting a rule takes its unfinished work with it, late ones included —\n     \"this does not repeat any more\" is not a request to keep the last one on\n     your board forever. Anything already done stays: it happened, and the\n     dashboard counts it. */\n  deleteSeries(id){\n    this.setState(st=>({\n      series: st.series.filter(sr=>sr.id!==id),\n      tasks: st.tasks.filter(t=>!(t.seriesId===id && !t.done)),\n    }));\n    this.toast('Repeat removed');\n  }\n  pauseSeries(id, paused){\n    this.setState(st=>({series:st.series.map(sr=>sr.id===id?{...sr, paused}:sr)}));\n    if(!paused) setTimeout(()=>this.syncSeries(), 0);\n    this.toast(paused?'Repeat paused':'Repeat resumed');\n  }\n\n  /* ——— daily routine ———\n     Kept apart from tasks on purpose: routines repeat by weekday, never carry,\n     and are ticked per date rather than once. */\n  openRoutineForm(id){\n    const r=id? this.state.routines.filter(x=>x.id===id)[0] : null;\n    this.setState({routineForm: r\n      ? {...r, from:r.from||'', to:r.to||'', editing:id}\n      : {title:'', note:'', block:'morning', minutes:'', days:[0,1,2,3,4,5,6],\n         from:'', to:'', editing:null}});\n  }\n  closeRoutineForm(){ this.setState({routineForm:null}); }\n  setRoutineField(field, value){\n    this.setState(st=>({routineForm:{...st.routineForm, [field]:value}}));\n  }\n  toggleRoutineDay(i){\n    this.setState(st=>{\n      const days=st.routineForm.days.slice();\n      const at=days.indexOf(i);\n      if(at>-1) days.splice(at,1); else days.push(i);\n      return {routineForm:{...st.routineForm, days}};\n    });\n  }\n  saveRoutine(){\n    const f=this.state.routineForm; if(!f) return;\n    const title=String(f.title||'').trim();\n    if(!title){ this.toast('Name the routine first'); return; }\n    if(!f.days.length){ this.toast('Pick at least one day'); return; }\n    if(!(Number(f.minutes)>0)){ this.toast('Say how many minutes it takes'); return; }\n    if(f.from && f.to && f.to<f.from){ this.toast('The end date is before the start'); return; }\n    const body={title, note:String(f.note||'').trim(), block:f.block,\n      minutes:Math.max(1, Math.round(Number(f.minutes))), days:f.days.slice().sort(),\n      from:f.from||'', to:f.to||''};\n    this.setState(st=>({\n      routineForm:null,\n      routines: f.editing\n        ? st.routines.map(r=>r.id===f.editing?{...r, ...body}:r)\n        : [...st.routines, {...body, id:this.uid('r'), done:{}, skipped:{}, order:st.routines.length+1}]\n    }));\n    this.toast(f.editing?'Routine updated':'Routine added');\n  }\n  deleteRoutine(id){\n    const gone=this.state.routines.filter(r=>r.id===id);\n    this.setState(st=>({routines:st.routines.filter(r=>r.id!==id)}));\n    this.offerUndo('Routine removed', ()=>this.setState(st=>({routines:[...st.routines, ...gone]})));\n  }\n  /* A routine with a duration is measured like anything else with one: the\n     hour you actually spent at the gym is the hour the analysis should use,\n     not the hour you meant to. Un-ticking clears that record with it. */\n  toggleRoutine(id, date){\n    const d=date||todayISO();\n    const r=this.state.routines.filter(x=>x.id===id)[0];\n    if(!r) return;\n    if(!(r.done||{})[d] && Number(r.minutes)>0){\n      this.setState({completeForm:{kind:'routine', id:r.id, date:d, title:r.title,\n        estimate:Math.max(1,Number(r.minutes)||1), actual:''}});\n      return;\n    }\n    this._pop[id]=Date.now();\n    this.setState(st=>({routines:st.routines.map(x=>{\n      if(x.id!==id) return x;\n      const done={...(x.done||{})};\n      const skipped={...(x.skipped||{})};\n      const actual={...(x.actual||{})};\n      if(done[d]){ delete done[d]; delete actual[d]; }\n      else { done[d]=true; delete skipped[d]; }\n      return {...x, done, skipped, actual};\n    })}));\n  }\n  /* Today's routines, in session order, for whichever weekday it is. */\n  /* A routine can run for a stretch rather than forever — a training block, a\n     revision push. No dates means always, which is what every existing routine\n     has and must keep meaning. */\n  routinesFor(dateStr){\n    return routinesOnDate(this.state.routines,dateStr);\n  }\n  /* Skipping is not the same as not doing it. A skip is recorded with a reason\n     so the long run shows why a rhythm broke, rather than only that it did. */\n  skipRoutine(id, date, reason){\n    const d=date||todayISO();\n    this.setState(st=>({routines:st.routines.map(r=>{\n      if(r.id!==id) return r;\n      const skips={...(r.skipped||{})};\n      if(reason===null) delete skips[d]; else skips[d]=reason||'Skipped';\n      const done={...(r.done||{})};\n      if(reason!==null) delete done[d];       // skipped and done are exclusive\n      return {...r, skipped:skips, done};\n    }), skipForm:null}));\n    this.toast(reason===null?'Skip cleared':'Marked skipped');\n  }\n  skipTask(id, date, reason){\n    const d=date||todayISO();\n    this.setState(st=>({tasks:st.tasks.map(t=>{\n      if(String(t.id)!==String(id)) return t;\n      const next={...t};\n      if(reason===null){ delete next.skipReason; delete next.skippedOn; }\n      else { next.skipReason=reason||'Just skipped'; next.skippedOn=d; next.done=false; delete next.actual; }\n      return next;\n    }), skipForm:null}));\n    this.toast(reason===null?'Skip cleared':'Task marked skipped');\n  }\n  openSkipForm(kind, id, date){\n    this.setState({skipForm:{kind, id, date:date||todayISO(), text:''}});\n  }\n  /* Chips and free text are the same field: a chip fills it, typing replaces\n     it, and this commits whatever it holds. A skip with no reason at all is\n     still allowed — it just records as one. */\n  saveSkipReason(){\n    const f=this.state.skipForm; if(!f) return;\n    const reason=String(f.text||'').trim();\n    if(!reason){ this.toast('Pick a reason or write one'); return; }\n    if(f.kind==='task') this.skipTask(f.id, f.date, reason);\n    else this.skipRoutine(f.id, f.date, reason);\n  }\n  closeSkipForm(){ this.setState({skipForm:null}); }\n\n  /* ——— tasks ——— */\n  uid(p){ return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }\n  listKey(t){ return t.scope==='day' ? 'day:'+t.block : t.scope; }\n  nextOrder(list){\n    return this.state.tasks.filter(t=>this.listKey(t)===list)\n      .reduce((m,t)=>Math.max(m, t.order==null?0:t.order), 0)+1;\n  }\n\n  openTaskForm(scope, parent, onDate){\n    this.setState({taskForm:{\n      // Minutes start empty on purpose. A pre-filled 45 is a number nobody\n      // chose, and it went straight into capacity, progress and the estimate\n      // accuracy figures as though it had been.\n      scope:'day', parent:null, title:'', note:'', minutes:'', instant:false,\n      block:'morning', at:'', priority:'Med', goalId:'', contribute:false,\n      // a new task inherits whichever badge Plan is currently filtered to, so\n      // filing five office tasks in a row asks the question once\n      badgeId:this.state.badgeFilter||'', badgeDraft:'',\n      // The only choice the person makes first is a date. Scope is derived\n      // later if they say the task needs regular contribution.\n      date:onDate||todayISO(), step:'details',\n      repeat:'none', repeatEvery:1, repeatLead:0, repeatUntil:'',\n      // empty means \"whichever weekday the date falls on\"; picking days\n      // explicitly is what turns one rule into Mon+Thu\n      repeatDays:[],\n    }});\n  }\n  /* The repeat rule opens in the same sheet the task did — it is the same set\n     of questions plus \"how often\", and a second sheet would only be the first\n     one with a different title. */\n  openSeriesForm(id){\n    const sr=(this.state.series||[]).filter(x=>x.id===id)[0];\n    if(!sr) return;\n    const first=seriesDueDates(sr, todayISO(), addDays(todayISO(), HORIZON_DAYS))[0]\n      || monthDate(parseISO(todayISO()).getFullYear(), parseISO(todayISO()).getMonth(), sr.day);\n    this.setState({taskForm:{\n      seriesEditing:id, scope:'day', parent:null,\n      title:sr.title||'', note:sr.note||'',\n      minutes:sr.minutes||30, instant:!!sr.instant,\n      block:sr.block||'morning', at:sr.at||'',\n      priority:sr.priority||'Med', goalId:sr.goalId||'',\n      badgeId:sr.badgeId||'', badgeDraft:'',\n      contribute:false, date:first, step:'details',\n      repeat: sr.unit==='day'?'day' : sr.unit==='week'?'week' : 'month',\n      repeatEvery:Math.max(1, Number(sr.every)||1),\n      repeatLead:Math.max(0, Number(sr.lead)||0),\n      repeatUntil:sr.until||'',\n      repeatDays:(sr.days||[]).slice(),\n    }});\n  }\n  /* Editing reuses the same sheet. `editing` holds the id; everything the task\n     already is becomes the form's starting values, and saving writes back in\n     place instead of appending — so a typo does not cost the task its order,\n     its children or its place in a breakdown. */\n  editTask(id){\n    const t=this.state.tasks.filter(x=>x.id===id)[0];\n    if(!t) return;\n    this.setState({taskForm:{\n      editing:id, scope:t.scope, parent:t.parent||null,\n      title:t.title||'', note:t.note||'', minutes:t.dailyMinutes||t.minutes||45,\n      instant:!!t.instant,\n      block:t.block||'morning', at:t.at||'',\n      priority:t.priority||'Med', goalId:t.goalId||'',\n      badgeId:t.badgeId||'', badgeDraft:'',\n      date:t.scope==='day'?(t.date||todayISO()):(t.targetDate||todayISO()),\n      contribute:t.scope!=='day'||!!t.contribution,\n      lockedContribution:this.state.tasks.some(x=>x.parent===t.id),\n      // An occurrence is edited on its own; the rule behind it lives in Plan\n      fromSeries:!!t.seriesId, repeat:'none', repeatEvery:1, repeatLead:0, repeatUntil:'',\n      repeatDays:[],\n      step:'details',\n    }});\n  }\n  closeTaskForm(){ this.setState({taskForm:null}); }\n  /* Mon+Thu in one rule. `days` has been an array in the model since repeats\n     existed; only the form was single-valued, so two weekdays meant two rules\n     that then had to be edited, paused and deleted in pairs. */\n  toggleRepeatDay(i){\n    const f=this.state.taskForm; if(!f) return;\n    const cur=repeatDaysOf(f), on=cur.indexOf(i)>-1;\n    // a weekly rule with no days matches nothing and would file in silence\n    if(on && cur.length===1){ this.toast('A weekly repeat needs at least one day'); return; }\n    const next=on?cur.filter(x=>x!==i):cur.concat([i]).sort((a,b)=>a-b);\n    this.setState(st=>({taskForm:{...st.taskForm, repeatDays:next}}));\n  }\n  setTaskField(field, value){\n    this.setState(st=>({taskForm:{...st.taskForm, [field]:value}}));\n  }\n  saveTaskForm(){\n    const f=this.state.taskForm; if(!f) return;\n    const title=String(f.title||'').trim();\n    if(!title){ this.toast('Give the task pe==='day'&&x.block===t.block&&x.date===t.date&&!x.done);\n      const assigned=sameDay.reduce((a,x)=>a+x.minutes,0);\n      const label=(BLOCKS.filter(b=>b.key===t.block)[0]||{label:t.block}).label;\n      this.toast(cap>0 && assigned+t.minutes>cap\n        ? ('Added, but '+label+' is now '+(assigned+t.minutes-cap)+' minutes over')\n        : ('Added to '+label+' on '+prettyDate(t.date)));\n      return;\n    }\n    this.toast('Appointment added');\n  }\n  /* An edit changes only the fields the sheet owns. done, actual, order,\n     carried and the id are the task's history and stay exactly as they were —\n     re-adding to change a title used to throw all of that away. */\n  applyTaskEdit(f, title){\n    const original=this.state.tasks.filter(t=>t.id===f.editing)[0];\n    if(!original) return;\n    const direct=this.state.tasks.filter(t=>t.parent===original.id);\n    const contribution=direct.length ? original.scope!=='day' : !!f.contribute;\n    const minutes=f.instant&&!contribution ? 0 : Math.max(1,Math.round(Number(f.minutes)));\n    const oldEnd=original.targetDate||original.date||f.date;\n    const shift=direct.length&&oldEnd&&f.date?daysBetween(oldEnd,f.date):0;\n    const descendants={};\n    let frontier=[original.id];\n    while(frontier.length){\n      const next=[];\n      this.state.tasks.forEach(t=>{ if(t.parent&&frontier.indexOf(t.parent)>-1){\n        descendants[t.id]=true; next.push(t.id);\n      }});\n      frontier=next;\n    }\n    this.setState(st=>({\n      tasks: st.tasks.map(x=>{\n        if(descendants[x.id]){\n          const moved={...x};\n          if(shift){\n            if(moved.date) moved.date=addDays(moved.date,shift);\n            if(moved.startDate) moved.startDate=addDays(moved.startDate,shift);\n            if(moved.targetDate) moved.targetDate=addDays(moved.targetDate,shift);\n          }\n          if(moved.splitLabel){ moved.splitRootTitle=title; moved.title=title+' — '+moved.splitLabel; }\n          if(contribution){\n            moved.dailyMinutes=minutes;\n            moved.minutes=moved.scope==='day'?minutes\n              : moved.startDate&&moved.targetDate\n                ? minutes*(daysBetween(moved.startDate,moved.targetDate)+1)\n                : moved.minutes;\n            moved.block=f.block||moved.block||'morning';\n          }\n          return moved;\n        }\n        if(x.id!==f.editing) return x;\n        const next={...x,title,note:String(f.note||'').trim(),\n          goalId:f.goalId||'',badgeId:f.badgeId||'',priority:f.priority||'Med',minutes,\n          block:f.block||'morning',contribution};\n        if(contribution){\n          next.scope=x.parent?x.scope:'target'; next.targetDate=f.date;\n          next.dailyMinutes=minutes; next.instant=false;\n          delete next.date; delete next.type; delete next.at;\n        }else{\n          next.scope='day'; next.date=f.date||todayISO();\n          next.instant=!!f.instant; delete next.targetDate; delete next.startDate;\n          delete next.dailyMinutes;\n          if(f.at){ next.type='event'; next.at=f.at; next.block=this.blockFor(f.at); }\n          else { delete next.type; delete next.at; }\n        }\n        return next;\n      }),\n      taskForm:null,\n    }));\n    this.toast('Task updated');\n  }\n\n  /* The runway starts on the next available date and ends on the selected\n     target date, inclusive. A target 38 days away therefore owns exactly 38\n     dates — tomorrow through day 38 — rather than 39 dates including today.\n     Explicit future startDate values on generated week parts are preserved. */\n  splitWindow(t){\n    const now=todayISO();\n    const requestedEnd=(t&&t.targetDate)||now;\n    const end=requestedEnd<now?now:requestedEnd;\n    let start=t&&t.startDate&&t.startDate>now?t.startDate:(end>now?addDays(now,1):now);\n    if(start>end) start=end;\n    return {start,end,days:daysBetween(start,end)+1};\n  }\n  /* Scope is inferred from the available runway. A planning month is four\n     complete weeks (28 dates), then come complete seven-day weeks, then the\n     remaining individual dates. This is the user's 38-day example exactly:\n     one month + one week + three days. */\n  autoSplitShape(t){\n    if(!t) return {start:todayISO(),end:todayISO(),days:0,months:0,weeks:0,dayParts:0,total:0};\n    const w=this.splitWindow(t);\n    if(t.scope==='target'){\n      const months=Math.floor(w.days/28);\n      const afterMonths=w.days-months*28;\n      const weeks=Math.floor(afterMonths/7), dayParts=afterMonths%7;\n      return {...w,months,weeks,dayParts,total:months+weeks+dayParts};\n    }\n    if(t.scope==='month'){\n      // Month parts produced above are 28 dates. For a legacy/edited month\n      // whose length differs, use every available week-sized group and divide\n      // its dates as evenly as arithmetic allows.\n      const weeks=Math.max(1,Math.ceil(w.days/7));\n      return {...w,months:0,weeks,dayParts:0,total:weeks};\n    }\n    if(t.scope==='week') return {...w,months:0,weeks:0,dayParts:w.days,total:w.days};\n    return {...w,months:0,weeks:0,dayParts:0,total:0};\n  }\n  shapeWords(shape){\n    const parts=[];\n    if(shape.months) parts.push(shape.months+' month'+(shape.months===1?'':'s'));\n    if(shape.weeks) parts.push(shape.weeks+' week'+(shape.weeks===1?'':'s'));\n    if(shape.dayParts) parts.push(shape.dayParts+' day'+(shape.dayParts===1?'':'s'));\n    return parts.join(' + ')||'1 day';\n  }\n  breakLabelFor(t){\n    const shape=this.autoSplitShape(t);\n    if(t.scope==='target') return 'Break into '+this.shapeWords(shape);\n    if(t.scope==='month') return 'Break evenly into '+shape.weeks+' week'+(shape.weeks===1?'':'s');\n    if(t.scope==='week') return 'Break evenly into '+shape.dayParts+' day'+(shape.dayParts===1?'':'s');\n    return '';\n  }\n  autoSplitCount(t){ return this.autoSplitShape(t).total; }\n  splitEvenly(parentId){\n    const t=this.state.tasks.filter(x=>x.id===parentId)[0];\n    if(!t) return;\n    if(this.state.tasks.some(x=>x.parent===t.id)){\n      this.setState({taskForm:null});\n      this.toast('This task already has a breakdown');\n      return;\n    }\n    const shape=this.autoSplitShape(t);\n    const daily=t.instant?0:Math.max(5,Number(t.dailyMinutes)||Number(t.minutes)||45);\n    const rootTitle=t.splitRootTitle||t.title;\n    const parentPath=t.splitPath||'';\n    const parentLabel=t.splitLabel||'';\n    const kids=[];\n    const addPart=(scope,startDate,endDate,label)=>{\n      const index=kids.length;\n      const path=parentPath?parentPath+'.'+(index+1):String(index+1);\n      const splitLabel=parentLabel?parentLabel+' · '+label:label;\n      const duration=daysBetween(startDate,endDate)+1;\n      const c={id:this.uid('t'),title:rootTitle+' — '+splitLabel,note:'',\n        splitPath:path,splitLabel,splitRootTitle:rootTitle,scope,parent:t.id,\n        goalId:t.goalId||'',priority:t.priority||'Med',\n        minutes:scope==='day'?daily:daily*duration,dailyMinutes:daily,\n        block:t.block||'morning',instant:false,done:false,order:index+1};\n      if(scope==='day'){ c.date=startDate; c.block=t.block||'morning'; }\n      else { c.startDate=startDate; c.targetDate=endDate; }\n      kids.push(c);\n    };\n    if(t.scope==='target'){\n      let cursor=shape.start;\n      for(let i=0;i<shape.months;i++){\n        const end=addDays(cursor,27); addPart('month',cursor,end,'Month '+(i+1));\n        cursor=addDays(end,1);\n      }\n      for(let i=0;i<shape.weeks;i++){\n        const end=addDays(cursor,6); addPart('week',cursor,end,'Week '+(i+1));\n        cursor=addDays(end,1);\n      }\n      for(let i=0;i<shape.dayParts;i++){\n        addPart('day',cursor,cursor,'Day '+(i+1)); cursor=addDays(cursor,1);\n      }\n    }else if(t.scope==='month'){\n      let cursor=shape.start;\n      const base=Math.floor(shape.days/shape.weeks), extra=shape.days%shape.weeks;\n      for(let i=0;i<shape.weeks;i++){\n        const size=base+(i<extra?1:0), end=addDays(cursor,size-1);\n        addPart('week',cursor,end,'Week '+(i+1)); cursor=addDays(end,1);\n      }\n    }else if(t.scope==='week'){\n      for(let i=0;i<shape.dayParts;i++){\n        const date=addDays(shape.start,i); addPart('day',date,date,'Day '+(i+1));\n      }\n    }\n    this.setState(st=>({tasks:[...st.tasks,...kids],taskForm:null,\n      expanded:{...st.expanded,[t.id]:true}}));\n    this.toast(t.scope==='target' ? ('Split into '+this.shapeWords(shape))\n      : t.scope==='month' ? ('Split evenly into '+shape.weeks+' weeks')\n      : ('Split evenly into '+shape.dayParts+' days'));\n  }\n\n  blockFor(hhmm){\n    const m=mins(hhmm), h=this.state.hours;\n    // whichever session actually contains the time, else the nearest that starts after it\n    const hit=BLOCKS.filter(b=>m>=mins(h[b.key].from) && m<mins(h[b.key].to))[0];\n    if(hit) return hit.key;\n    const after=BLOCKS.filter(b=>m<mins(h[b.key].from))[0];\n    return after ? after.key : 'evening';\n  }\n  /* Handing the unreadable blob back as a file is the least the app can do\n     before it starts writing over the top of it. */\n  downloadOrphan(){\n    const data=this._orphan;\n    if(!data){ this.toast('Nothing held back'); return; }\n    try{\n      const blob=new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});\n      const url=URL.createObjectURL(blob);\n      const a=document.createElement('a');\n      a.href=url; a.download='task2day-backup-'+todayISO()+'.json';\n      document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(()=>URL.revokeObjectURL(url), 4000);\n      this.toast('Saved to your downloads');\n    }catch(e){ this.toast('Could not build the file'); }\n  }\n\n  /* ——— undo ———\n     Delete used to be final and instant. Every destructive action now parks\n     what it removed for ten seconds; the toast carries the way back. */\n  /* ——— confirming a deletion ———\n     Undo covered some of these and not others, and an undo you did not notice\n     within ten seconds is no protection at all. Every destructive action now\n     goes through one dialog that names the thing and says what goes with it —\n     the count of children, the tasks a badge will be unfiled from, the\n     occurrences a repeat takes with it. Where undo already existed it stays:\n     the two answer different mistakes, one before and one after. */\n  askDelete(spec){ this.setState({confirmDelete:spec}); }\n  closeConfirmDelete(){ this.setState({confirmDelete:null}); }\n  runConfirmDelete(){\n    const c=this.state.confirmDelete; if(!c) return;\n    this.setState({confirmDelete:null});\n    if(typeof c.run==='function') c.run();\n  }\n\n  askDeleteTask(id){\n    const t=this.state.tasks.filter(x=>String(x.id)===String(id))[0];\n    if(!t) return;\n    // the same subtree walk delete does, so the count in the question is the\n    // count that will actually go\n    const doomed={}; doomed[t.id]=true;\n    let grew=true;\n    while(grew){\n      grew=false;\n      this.state.tasks.forEach(x=>{ if(x.parent && doomed[x.parent] && !doomed[x.id]){ doomed[x.id]=true; grew=true; } });\n    }\n    const kids=Object.keys(doomed).length-1;\n    const series=t.seriesId ? (this.state.series||[]).filter(x=>x.id===t.seriesId)[0] : null;\n    this.askDelete({\n      title:'Delete \"'+t.title+'\"?',\n      note: kids\n        ? ('Its breakdown goes too — '+kids+' task'+(kids===1?'':'s')+' under it.')\n        : series\n          ? 'This one occurrence only. The repeat itself stays, and will not file this date again.'\n          : 'It leaves your plan for good.',\n      label:'Delete',\n      run:()=>this.deleteTask(id),\n    });\n  }\n  askDeleteBadge(id){\n    const b=(this.state.badges||[]).filter(x=>x.id===id)[0];\n    if(!b) return;\n    const used=this.state.tasks.filter(t=>t.badgeId===id).length;\n    const rules=(this.state.series||[]).filter(x=>x.badgeId===id).length;\n    const both=[used?(used+' task'+(used===1?'':'s')):'',\n      rules?(rules+' repeat'+(rules===1?'':'s')):''].filter(Boolean).join(' and ');\n    this.askDelete({\n      title:'Delete the badge \"'+b.name+'\"?',\n      note: both\n        ? (both+' will lose the label. Nothing is deleted — they stay exactly where they are, unfiled.')\n        : 'Nothing is using it yet.',\n      label:'Delete badge',\n      run:()=>this.deleteBadge(id),\n    });\n  }\n  askDeleteSeries(id){\n    const sr=(this.state.series||[]).filter(x=>x.id===id)[0];\n    if(!sr) return;\n    const open=this.state.tasks.filter(t=>t.seriesId===id && !t.done).length;\n    this.askDelete({\n      title:'Delete the repeat \"'+sr.title+'\"?',\n      note: (open\n        ? (open+' unfinished occurrence'+(open===1?'':'s')+' go with it. ')\n        : '')+'Anything already completed stays in your record.',\n      label:'Delete repeat',\n      run:()=>this.deleteSeries(id),\n    });\n  }\n  askDeleteRoutine(id){\n    const r=this.state.routines.filter(x=>x.id===id)[0];\n    if(!r) return;\n    this.askDelete({\n      title:'Delete the routine \"'+r.title+'\"?',\n      note:'It stops appearing on Today. The days you already kept it stay in your log.',\n      label:'Delete routine',\n      run:()=>this.deleteRoutine(id),\n    });\n  }\n  askDeleteGoal(id){\n    const g=this.state.goals.filter(x=>x.id===id)[0];\n    if(!g) return;\n    const tagged=this.state.tasks.filter(t=>t.goalId===id).length;\n    this.askDelete({\n      title:'Remove the goal \"'+g.title+'\"?',\n      note: tagged\n        ? (tagged+' task'+(tagged===1?'':'s')+' will lose the tag. The tasks themselves stay.')\n        : 'No tasks are tagged to it.',\n      label:'Remove goal',\n      run:()=>this.deleteGoal(id),\n    });\n  }\n  askDeleteGroup(id){\n    const g=this.state.groups.filter(x=>x.id===id)[0];\n    if(!g) return;\n    const cards=this.state.cards.filter(c=>c.groupId===id).length;\n    this.askDelete({\n      title:'Delete the subject \"'+g.name+'\"?',\n      note: cards\n        ? (cards+' card'+(cards===1?'':'s')+' and their images go with it.')\n        : 'It holds no cards yet.',\n      label:'Delete subject',\n      run:()=>this.deleteGroup(id),\n    });\n  }\n  askDeleteCard(id){\n    const c=this.state.cards.filter(x=>x.id===id)[0];\n    if(!c) return;\n    this.askDelete({\n      title:'Delete the card \"'+c.heading+'\"?',\n      note:'Its image and everything it has learned about your recall go with it.',\n      label:'Delete card',\n      run:()=>this.deleteCard(id),\n    });\n  }\n\n  offerUndo(label, restore){\n    clearTimeout(this._undoT);\n    this.setState({undo:{label, restore}});\n    this._undoT=setTimeout(()=>{ if(this._alive) this.setState({undo:null}); }, 10000);\n  }\n  takeUndo(){\n    const u=this.state.undo; if(!u) return;\n    clearTimeout(this._undoT);\n    this.setState({undo:null});\n    u.restore();\n    this.toast('Put back');\n  }\n\n  deleteTask(id){\n    // a parent takes its breakdown with it, or the children are orphaned\n    const doomed={}; doomed[id]=true;\n    let grew=true;\n    while(grew){\n      grew=false;\n      this.state.tasks.forEach(t=>{ if(t.parent && doomed[t.parent] && !doomed[t.id]){ doomed[t.id]=true; grew=true; } });\n    }\n    const gone=this.state.tasks.filter(t=>doomed[t.id]);\n    this.setState(st=>({tasks:st.tasks.filter(t=>!doomed[t.id])}));\n    this.offerUndo(gone.length>1 ? ('Deleted, and '+(gone.length-1)+' under it') : 'Deleted',\n      ()=>this.setState(st=>({tasks:[...st.tasks, ...gone]})));\n  }\n  toggleExpand(id){ this.setState(st=>({expanded:{...st.expanded, [id]:!st.expanded[id]}})); }\n\n  toggle(id){\n    const t=this.state.tasks.filter(x=>String(x.id)===String(id))[0];\n    if(!t) return;\n    if(t.done){\n      this.setState(st=>({tasks:st.tasks.map(x=>{\n        if(String(x.id)!==String(id)) return x;\n        const next={...x, done:false}; delete next.actual; return next;\n      })}));\n      return;\n    }\n    // Month/week targets have no duration of their own, and instant day tasks\n    // take no session time. Ordinary day work asks for actual minutes first.\n    if(t.scope==='day' && !t.instant){\n      // The box starts empty. Pre-filling it with the estimate meant the\n      // commonest answer was the estimate itself, and an accuracy figure built\n      // out of its own input measures nothing.\n      this.setState({completeForm:{kind:'task', id:t.id, title:t.title,\n        estimate:Math.max(1,Number(t.minutes)||1), actual:''}});\n      return;\n    }\n    this._pop[id]=Date.now();\n    this.setState(st=>({tasks:st.tasks.map(x=>{\n      if(String(x.id)!==String(id)) return x;\n      const next={...x, done:true};\n      /* A day task finished without the sheet took no measured time. Anything\n         else — a month or week row ticked straight off Plan — has no duration\n         of its own, so it must not gain an `actual` key at all: writing\n         `actual: x.actual` when x had none set the key to undefined, and one\n         undefined anywhere in the tree makes Firebase reject the entire\n         update. The symptom is not a wrong number, it is sync stopping dead. */\n      if(t.scope==='day') next.actual=0;\n      delete next.skipReason; delete next.skippedOn; return next;\n    })}));\n  }\n  setCompletionActual(e){\n    const value=e&&e.target?e.target.value:String(e||'');\n    this.setState(st=>({completeForm:{...st.completeForm, actual:value}}));\n  }\n  closeCompletion(){ this.setState({completeForm:null}); }\n  saveCompletion(){\n    const f=this.state.completeForm; if(!f) return;\n    const actual=Math.round(Number(f.actual));\n    if(!Number.isFinite(actual) || actual<1){ this.toast('Enter the minutes taken'); return; }\n    this._pop[f.id]=Date.now();\n    if(f.kind==='routine'){\n      this.setState(st=>({completeForm:null,\n        routines:st.routines.map(r=>{\n          if(r.id!==f.id) return r;\n          const done={...(r.done||{}), [f.date]:true};\n          const skipped={...(r.skipped||{})}; delete skipped[f.date];\n          return {...r, done, skipped, actual:{...(r.actual||{}), [f.date]:actual}};\n        })}));\n      this.toast(actual>f.estimate*1.2\n        ? ('Took '+actual+' minutes against '+f.estimate+' planned')\n        : ('Done in '+actual+' minutes. You planned '+f.estimate+'.'));\n      return;\n    }\n    this.setState(st=>({completeForm:null,\n      tasks:st.tasks.map(t=>{\n        if(String(t.id)!==String(f.id)) return t;\n        const next={...t,done:true,actual};\n        delete next.skipReason; delete next.skippedOn; return next;\n      })}));\n    this.toast(actual>f.estimate*1.2\n      ? ('Took '+actual+' minutes against '+f.estimate+' planned')\n      : ('Done in '+actual+' minutes. You planned '+f.estimate+'.'));\n  }\n\n  /* ——— goals ——— */\n  openGoalForm(){ this.setState({taskForm:{scope:'goal', title:'', deadline:''}}); }\n  saveGoal(){\n    const f=this.state.taskForm; if(!f) return;\n    const title=String(f.title||'').trim();\n    if(!title){ this.toast('Give the goal a name first'); return; }\n    this.setState(st=>({taskForm:null,\n      goals:[...st.goals, {id:this.uid('g'), title, deadline:f.deadline||''}]}));\n    this.toast('Goal added');\n  }\n  deleteGoal(id){\n    this.setState(st=>({goals:st.goals.filter(g=>g.id!==id),\n      tasks:st.tasks.map(t=>t.goalId===id?{...t, goalId:''}:t)}));\n    this.toast('Goal removed');\n  }\n\n  /* ——— revision: subjects, their cards, their images ———\n     A \"group\" in the data is a SUBJECT to the reader — Computer networks,\n     Structural analysis. The cards under it each carry a formula or heading,\n     which is the prompt you see before the image. The state keys stay `groups`\n     and `heading`; renaming those would rewrite every stored account for a\n     wording change. */\n  openGroupForm(){ this.setState({groupForm:{name:''}}); }\n  closeGroupForm(){ this.setState({groupForm:null}); }\n  setGroupField(v){ this.setState(st=>({groupForm:{...st.groupForm, name:v}})); }\n  saveGroup(){\n    const f=this.state.groupForm; if(!f) return;\n    const name=String(f.name||'').trim();\n    if(!name){ this.toast('Name the subject first'); return; }\n    const g={id:this.uid('grp'), name};\n    this.setState(st=>({groups:[...st.groups, g], groupForm:null, expanded:{...st.expanded,[g.id]:true}}));\n    this.toast('Subject added');\n  }\n  /* The worst of the three: a group takes every card and every cropped image\n     under it, and those images are work. Nothing is written off until the\n     undo window closes. */\n  deleteGroup(id){\n    const group=this.state.groups.filter(g=>g.id===id)[0];\n    const cards=this.state.cards.filter(c=>c.groupId===id);\n    cards.forEach(c=>this.storeImage(c.id, null));\n    this.setState(st=>({groups:st.groups.filter(g=>g.id!==id),\n      cards:st.cards.filter(c=>c.groupId!==id)}));\n    this.offerUndo(cards.length\n      ? ('Subject removed, with '+cards.length+' card'+(cards.length===1?'':'s'))\n      : 'Subject removed',\n      ()=>{\n        cards.forEach(c=>{ if(c.img) this.storeImage(c.id, c.img); });\n        this.setState(st=>({groups:group?[...st.groups, group]:st.groups,\n          cards:[...st.cards, ...cards]}));\n      });\n  }\n  addCard(groupId, heading){\n    const c={id:this.uid('c'), groupId, heading:heading||'Untitled', note:'',\n      strength:0, step:0, dueIn:0};\n    this.setState(st=>({cards:[...st.cards, c]}));\n    return c.id;\n  }\n  deleteCard(id){\n    const card=this.state.cards.filter(c=>c.id===id)[0];\n    const img=card&&card.img;\n    this.storeImage(id, null);\n    this.setState(st=>({cards:st.cards.filter(c=>c.id!==id)}));\n    this.offerUndo('Card removed', ()=>{\n      if(!card) return;\n      if(img) this.storeImage(id, img);\n      this.setState(st=>({cards:[...st.cards, card]}));\n    });\n  }\n\n  /* ——— the cropper ———\n     A file lands here as an object URL, is shown at whatever scale fits, and\n     the user pans and pinches it under a fixed square frame. Only the framed\n     region is drawn to a canvas on save, so what gets stored is the crop the\n     user actually chose rather than the whole photo plus a viewport. */\n  pickImage(groupId, cardId, ev){\n    const file=ev.target.files && ev.target.files[0];\n    ev.target.value='';\n    if(!file) return;\n    if(!/^image\\//.test(file.type)){ this.toast('That is not an image'); return; }\n    const url=URL.createObjectURL(file);\n    const img=new Image();\n    img.onload=()=>{\n      this.setState({crop:{groupId, cardId, url, w:img.naturalWidth, h:img.naturalHeight,\n        scale:1, minScale:1, x:0, y:0, heading:''}});\n      this._cropImg=img;\n      requestAnimationFrame(()=>this.cropFit());\n    };\n    img.onerror=()=>{ URL.revokeObjectURL(url); this.toast('Could not read that image'); };\n    img.src=url;\n  }\n  cropFit(){\n    const box=this.cropBox.current; const c=this.state.crop;\n    if(!box||!c) return;\n    // src is assigned here rather than in the markup: a literal src=\"{{ ... }}\"\n    // is picked up by the bundler's resource scan and fetched as a real URL\n    const el=box.querySelector('[data-crop-img]');\n    if(el && el.getAttribute('src')!==c.url) el.setAttribute('src', c.url);\n    const size=box.getBoundingClientRect().width;\n    const s=Math.max(size/c.w, size/c.h);      // cover the frame\n    this.setState(st=>({crop:{...st.crop, scale:s, minScale:s, x:0, y:0, frame:size}}));\n  }\n  /* Pan and pinch, delegated from the document.\n\n     These were bound to the crop frame itself at first, which loses the\n     gesture after one move: every pointermove sets state, the re-render can\n     hand back a different DOM node, and the listeners stay on the old one.\n     Nothing is held across moves here — the frame is looked up each time. */\n  cropSetup(){\n    let pts={}, start=null;\n    const frameEl=()=>document.querySelector('[data-crop-frame]');\n    const dist=a=>{ const k=Object.keys(a); if(k.length<2) return 0;\n      const p=a[k[0]], q=a[k[1]]; return Math.hypot(p.x-q.x, p.y-q.y); };\n    const mid=a=>{ const k=Object.keys(a); if(!k.length) return {x:0,y:0};\n      if(k.length<2) return {x:a[k[0]].x, y:a[k[0]].y};\n      const p=a[k[0]], q=a[k[1]]; return {x:(p.x+q.x)/2, y:(p.y+q.y)/2}; };\n    const snap=()=>{ const c=this.state.crop;\n      start = c ? {d:dist(pts), m:mid(pts), scale:c.scale, x:c.x, y:c.y} : null; };\n\n    document.addEventListener('pointerdown', e=>{\n      if(!this.state.crop || !e.target.closest) return;\n      if(!e.target.closest('[data-crop-frame]')) return;\n      pts[e.pointerId]={x:e.clientX, y:e.clientY};\n      snap();\n    }, true);\n\n    document.addEventListener('pointermove', e=>{\n      if(!start || !pts[e.pointerId] || !this.state.crop) return;\n      pts[e.pointerId]={x:e.clientX, y:e.clientY};\n      const m=mid(pts), d=dist(pts);\n      this.setState(st=>{\n        const c=st.crop; if(!c) return null;\n        let scale=start.scale;\n        if(d && start.d) scale=Math.max(c.minScale, Math.min(c.minScale*6, start.scale*(d/start.d)));\n        const frame=c.frame||(frameEl()?frameEl().getBoundingClientRect().width:1);\n        // never let the frame show past the edge of the picture\n        const halfW=Math.max(0,(c.w*scale-frame)/2), halfH=Math.max(0,(c.h*scale-frame)/2);\n        return {crop:{...c, scale, frame,\n          x:Math.max(-halfW, Math.min(halfW, start.x+(m.x-start.m.x))),\n          y:Math.max(-halfH, Math.min(halfH, start.y+(m.y-start.m.y)))}};\n      });\n      e.preventDefault();\n    }, true);\n\n    const up=e=>{ if(!pts[e.pointerId]) return; delete pts[e.pointerId];\n      if(Object.keys(pts).length) snap(); else start=null; };\n    document.addEventListener('pointerup', up, true);\n    document.addEventListener('pointercancel', up, true);\n    // the frame sets touch-action:none, but Safari still needs the refusal\n    document.addEventListener('touchmove', e=>{\n      if(this.state.crop && e.target.closest && e.target.closest('[data-crop-frame]')) e.preventDefault();\n    }, {passive:false});\n  }\n\n  setCropHeading(v){ this.setState(st=>({crop:{...st.crop, heading:v}})); }\n  cancelCrop(){\n    const c=this.state.crop;\n    if(c) URL.revokeObjectURL(c.url);\n    this.setState({crop:null});\n  }\n  saveCrop(){\n    const c=this.state.crop, img=this._cropImg;\n    if(!c||!img) return;\n    const heading=String(c.heading||'').trim();\n    if(!heading && !c.cardId){ this.toast('Give this image a heading first'); return; }\n    const OUT=900, frame=c.frame||300;\n    const cv=document.createElement('canvas');\n    cv.width=OUT; cv.height=OUT;\n    const ctx=cv.getContext('2d');\n    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,OUT,OUT);\n    // map the framed region back into source pixels\n    const k=OUT/frame;\n    ctx.setTransform(c.scale*k, 0, 0, c.scale*k, OUT/2 + c.x*k, OUT/2 + c.y*k);\n    ctx.drawImage(img, -c.w/2, -c.h/2);\n    let data;\n    try{ data=cv.toDataURL('image/jpeg', 0.85); }\n    catch(e){ this.toast('Could not process that image'); return; }\n    const id = c.cardId || this.addCard(c.groupId, heading);\n    this.storeImage(id, data);\n    this.setState(st=>({crop:null,\n      cards:st.cards.map(x=>x.id===id\n        ? {...x, img:data, heading: heading||x.heading} : x)}));\n    URL.revokeObjectURL(c.url);\n    this._cropImg=null;\n    this.toast('Image saved');\n  }\n\n  /* ——— revision run ———\n     A group can be revised as one pass: the queue holds its due cards and the\n     popup walks them in order instead of interrupting one at a time. */\n  reviseGroup(groupId){\n    const q=this.state.cards.filter(c=>c.groupId===groupId).map(c=>c.id);\n    if(!q.length){ this.toast('Nothing under this subject yet'); return; }\n    this.setState({recallQueue:q.slice(1), recall:q[0], recallStage:'prompt'});\n  }\n  openRecall(id){ this.setState(st=>({recall:id, recallStage:'prompt', recallsToday:st.recallsToday+1})); }\n  revealRecall(){ this.setState({recallStage:'reveal'}); }\n  closeRecall(got){\n    const id=this.state.recall;\n    this.setState(st=>{\n      const cards = got===undefined ? st.cards : st.cards.map(c=>{\n        if(c.id!==id) return c;\n        // A miss used to reset to step 0 — one day. The thing you have just\n        // proved you do not know deserves the same session, not tomorrow.\n        const step = got ? Math.min(INTERVALS.length-1, c.step+1) : 0;\n        return {...c, step, dueIn: got ? INTERVALS[step] : 0, relearnAt: got ? null : Date.now()+10*60000,\n          strength: Math.max(0, Math.min(100, c.strength + (got?12:-15)))};\n      });\n      const q=st.recallQueue||[];\n      if(q.length) return {cards, recall:q[0], recallQueue:q.slice(1), recallStage:'prompt'};\n      return {cards, recall:null, recallQueue:null, recallStage:'prompt'};\n    });\n  }\n  dueCard(){\n    const now=Date.now();\n    const due=this.state.cards.filter(c=>c.dueIn<=0 && !(c.relearnAt && c.relearnAt>now));\n    return due.length ? due.sort((a,b)=>a.strength-b.strength)[0] : null;\n  }\n  toggleRevision(){\n    this.setState(st=>({revisionOn:!st.revisionOn}), ()=>{\n      if(this.state.revisionOn){ this.schedule(this.state.freqMin*60000); this.toast('Revision mode on'); }\n      else { clearTimeout(this._rt); this.toast('Revision mode off'); }\n    });\n  }\n  /* Any interval from 5 minutes to 12 hours, not a fixed menu — how often a\n     recall is welcome depends entirely on the day. */\n  setFreq(m){\n    const v=Math.max(5, Math.min(720, Math.round(Number(m)||0)));\n    if(!v) return;\n    this.setState({freqMin:v}, ()=>{ this.schedule(v*60000); this.toast('Recall every '+freqWords(v)); });\n  }\n  setFreqField(v){\n    const n=Math.round(Number(v)||0);\n    this.setState({freqMin:n});                       // let the field be typed in\n    clearTimeout(this._fq);\n    this._fq=setTimeout(()=>{ if(this._alive) this.setFreq(n); }, 700);\n  }\n  setCap(v){\n    const n=Math.max(1, Math.min(50, Math.round(Number(v)||0)));\n    this.setState({dailyCap:n}, ()=>this.toast('At most '+n+' a da
