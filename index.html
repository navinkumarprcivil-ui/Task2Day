 }}\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:11px;line-height:1;font-weight:{{ n.weight }};letter-spacing:.01em\">{{ n.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ n.isSpacer }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"flex:1\"><\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showAdd }}\" hint-placeholder-val=\"{{ false }}\">\n    <button class=\"fab-add\" sc-camel-on-click=\"{{ goAdd }}\" aria-label=\"Add a task\" style=\"position:absolute;bottom:32px;left:50%;transform:translateX(-50%);width:50px;height:50px;border-radius:var(--radius-md);background:var(--color-accent);color:var(--color-bg);border:3px solid var(--color-bg);box-shadow:var(--shadow-md);cursor:pointer;display:grid;place-items:center;z-index:6\"><span style=\"font-family:var(--font-heading);font-weight:600;font-size:26px;line-height:1;margin-top:-2px\">+<\u002Fspan><\u002Fbutton>\n    <\u002Fsc-if>\n\n    <!-- A checkmark records completion only after the actual duration is\n         known. Timer completions already know it and bypass this sheet. -->\n    <sc-if value=\"{{ completionOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:28;background:rgba(0,0,0,.45);display:grid;place-items:end center;animation:fadeBg .2s ease\">\n        <div class=\"sheet-panel\" style=\"width:100%;background:var(--color-bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-5) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom));box-shadow:var(--shadow-md);animation:rise .25s ease\">\n          <h4 style=\"margin:0 0 2px\">How long did it take?<\u002Fh4>\n          <p style=\"font-size:15px;margin:var(--space-2) 0 3px;line-height:1.35\">{{ completionTitle }}<\u002Fp>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-4)\">You planned {{ completionEstimate }} minutes. {{ completionNote }}<\u002Fp>\n          <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n            <label>Actual minutes<\u002Flabel>\n            <input class=\"input\" type=\"number\" min=\"1\" step=\"1\" inputmode=\"numeric\" aria-label=\"Actual minutes\" placeholder=\"minutes it took\" value=\"{{ completionActual }}\" sc-camel-on-input=\"{{ setCompletionActual }}\" style=\"font-size:18px\">\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:var(--space-2)\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeCompletion }}\" style=\"flex:1\">Cancel<\u002Fbutton>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveCompletion }}\" style=\"flex:1\">Mark done<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- recall popup -->\n    <sc-if value=\"{{ recallOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:var(--space-4);background:color-mix(in srgb,var(--color-neutral-900) 55%,transparent);animation:fadeBg .25s ease\">\n        <div class=\"recall-card scr\" style=\"width:100%;background:var(--color-bg);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-4);box-shadow:var(--shadow-lg);animation:popIn .3s ease\">\n          <sc-if value=\"{{ isPrompt }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <h6 style=\"margin:0 0 var(--space-2);color:var(--color-accent-700)\">Active recall<\u002Fh6>\n              <h3 style=\"margin:0 0 var(--space-2)\">{{ recallTopic }}<\u002Fh3>\n              <span class=\"tag tag-accent\">{{ recallSubject }}<\u002Fspan>\n              <p style=\"font-size:17px;font-style:italic;margin:var(--space-4) 0 var(--space-2);line-height:1.4\">Can you recall the formula or concept?<\u002Fp>\n              <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-6)\">Say it in your head first, then check yourself.<\u002Fp>\n              <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ reveal }}\">Open<\u002Fbutton>\n              <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ recallDismiss }}\" style=\"font-size:13px\">Later<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isReveal }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"animation:rise .25s ease\">\n              <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-2);margin-bottom:var(--space-3)\">\n                <div>\n                  <h6 style=\"margin:0 0 3px;color:var(--color-accent-700)\">{{ recallSubject }}<\u002Fh6>\n                  <h4 style=\"margin:0\">{{ recallTopic }}<\u002Fh4>\n                <\u002Fdiv>\n                <button class=\"btn btn-icon\" sc-camel-on-click=\"{{ recallDismiss }}\" aria-label=\"Close\" style=\"flex:none\"><span style=\"font-size:18px;line-height:1\">×<\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"background:var(--color-surface);display:grid;place-items:center;min-height:160px;margin-bottom:var(--space-3)\">\n                <sc-if value=\"{{ recallHasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img alt=\"The formula\" data-recall-img=\"1\" style=\"width:100%;height:220px;object-fit:contain;display:block\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ recallNoImg }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"width:100%;min-height:160px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--color-neutral-200) 0 5px,var(--color-surface) 5px 10px);padding:var(--space-4)\">\n                    <span style=\"font-family:var(--font-heading);font-weight:600;font-size:11px;letter-spacing:.08em;color:var(--color-neutral-700);text-align:center\">FORMULA IMAGE — ADD IT IN REVISION<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <p style=\"font-size:15px;font-style:italic;margin:0 0 var(--space-4)\">{{ recallHint }}<\u002Fp>\n              <div style=\"display:flex;gap:var(--space-2)\">\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ recallMiss }}\" style=\"flex:1\">Need practice<\u002Fbutton>\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ recallGot }}\" style=\"flex:1\">Got it<\u002Fbutton>\n              <\u002Fdiv>\n              <p class=\"text-muted\" style=\"font-size:12px;margin:var(--space-3) 0 0\">{{ recallNextText }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- evening review -->\n    <sc-if value=\"{{ reviewOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:19;display:grid;place-items:end center;background:color-mix(in srgb,var(--color-neutral-900) 52%,transparent);animation:fadeBg .25s ease\">\n        <div class=\"review-sheet scr\" style=\"width:100%;max-height:80%;overflow-y:auto;background:var(--color-bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-6) var(--space-4);box-shadow:var(--shadow-lg);animation:rise .3s ease\">\n          <sc-if value=\"{{ reviewStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <h6 style=\"margin:0 0 var(--space-2);color:var(--color-accent-700)\">{{ reviewKicker }}<\u002Fh6>\n              <h3 style=\"margin:0 0 var(--space-2)\">What slipped, and why?<\u002Fh3>\n              <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-6)\">The reason matters more than the miss. It is what shows you the pattern.<\u002Fp>\n              <sc-if value=\"{{ nothingSlipped }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:16px;font-style:italic;margin:0 0 var(--space-4)\">Everything is done. A clean day, nothing to carry.<\u002Fp>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ slipped }}\" as=\"sl\" hint-placeholder-count=\"3\">\n                <div style=\"margin-bottom:var(--space-4)\">\n                  <div style=\"font-size:15px;line-height:1.3;margin-bottom:var(--space-2)\">{{ sl.title }}<\u002Fdiv>\n                  <div style=\"display:flex;gap:5px;flex-wrap:wrap\">\n                    <sc-for list=\"{{ sl.options }}\" as=\"op\" hint-placeholder-count=\"4\">\n                      <button class=\"reason-chip\" sc-camel-on-click=\"{{ op.pick }}\" style=\"padding:6px 11px;border-radius:var(--radius-md);border:1px solid {{ op.border }};background:{{ op.bg }};color:{{ op.fg }};font-size:12px;font-family:var(--font-heading);font-weight:600;cursor:pointer;transition:background .15s\">{{ op.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <input class=\"input\" value=\"{{ sl.custom }}\" sc-camel-on-input=\"{{ sl.setCustom }}\" aria-label=\"Your own reason\" placeholder=\"Or your own reason\" style=\"margin-top:6px;font-size:14px\">\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ reviewRoutineSkips }}\" as=\"rs\" hint-placeholder-count=\"1\">\n                <div style=\"padding:var(--space-3) 0;border-top:1px solid var(--color-divider)\">\n                  <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)\">\n                    <span class=\"tag tag-neutral\">Routine<\u002Fspan>\n                    <span style=\"flex:1;font-size:14px\">{{ rs.title }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:5px;flex-wrap:wrap\">\n                    <sc-for list=\"{{ rs.options }}\" as=\"op\" hint-placeholder-count=\"4\">\n                      <button class=\"reason-chip\" sc-camel-on-click=\"{{ op.pick }}\" style=\"padding:6px 11px;border-radius:var(--radius-md);border:1px solid {{ op.border }};background:{{ op.bg }};color:{{ op.fg }};font-size:12px;font-family:var(--font-heading);font-weight:600;cursor:pointer\">{{ op.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ reviewNext }}\" style=\"margin-top:var(--space-4)\">Continue<\u002Fbutton>\n              <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ reviewClose }}\" style=\"font-size:13px\">Cancel<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ reviewStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"animation:rise .25s ease\">\n              <h6 style=\"margin:0 0 var(--space-2);color:var(--color-accent-700)\">Productivity check<\u002Fh6>\n              <h3 style=\"margin:0 0 var(--space-2)\">How satisfied are you with this day?<\u002Fh3>\n              <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-5)\">Drag the scale. This is your own judgment, separate from how many boxes were checked.<\u002Fp>\n              <div style=\"display:flex;align-items:baseline;justify-content:center;gap:4px;margin-bottom:var(--space-4)\">\n                <span class=\"stat\" style=\"font-family:var(--font-heading);font-size:46px;color:var(--color-accent)\">{{ reviewSatisfaction }}<\u002Fspan>\n                <span class=\"text-muted\" style=\"font-family:var(--font-heading);font-size:18px\">/10<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"{{ reviewSatisfaction }}\" sc-camel-on-input=\"{{ setReviewSatisfaction }}\" aria-label=\"Productivity satisfaction from zero to ten\" style=\"width:100%;accent-color:var(--color-accent);height:28px\">\n              <div class=\"text-muted\" style=\"display:flex;justify-content:space-between;font-size:11px;margin-top:2px\"><span>Rough day<\u002Fspan><span>Excellent day<\u002Fspan><\u002Fdiv>\n              <p style=\"font-size:15px;font-style:italic;text-align:center;margin:var(--space-4) 0\">{{ reviewSatisfactionLabel }}<\u002Fp>\n              <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ reviewSatisfactionNext }}\">{{ reviewSatisfactionButton }}<\u002Fbutton>\n              <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ reviewBack }}\" style=\"font-size:13px\">Back<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ reviewStep3 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"animation:rise .25s ease\">\n              <h6 style=\"margin:0 0 var(--space-2);color:var(--color-accent-700)\">Where should it go?<\u002Fh6>\n              <h3 style=\"margin:0 0 var(--space-2)\">{{ reviewSummary }}<\u002Fh3>\n              <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-4)\">{{ reviewAdvice }}<\u002Fp>\n              <sc-if value=\"{{ streakAtRisk }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:var(--space-3) 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);margin-bottom:var(--space-4)\">\n                  <p style=\"font-size:14px;font-style:italic;margin:0 0 var(--space-2);line-height:1.4\">{{ streakRiskText }}<\u002Fp>\n                  <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ reviewFreeze }}\" style=\"margin:0\">Use a freeze day<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ reviewToTomorrow }}\" style=\"width:100%;text-align:left;padding:var(--space-3) 0;border:0;border-top:1px solid var(--color-divider);background:none;color:var(--color-text);cursor:pointer;font-family:var(--font-body)\">\n                <div style=\"font-family:var(--font-heading);font-weight:600;font-size:16px\">Carry to tomorrow<\u002Fdiv>\n                <div class=\"text-muted\" style=\"font-size:12px;margin-top:2px\">{{ tomorrowWarning }}<\u002Fdiv>\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ reviewToWeekend }}\" style=\"width:100%;text-align:left;padding:var(--space-3) 0;border:0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);background:none;color:var(--color-text);cursor:pointer;font-family:var(--font-body)\">\n                <div style=\"font-family:var(--font-heading);font-weight:600;font-size:16px\">Batch onto the weekend<\u002Fdiv>\n                <div class=\"text-muted\" style=\"font-size:12px;margin-top:2px\">Saturday has the most room this week.<\u002Fdiv>\n              <\u002Fbutton>\n              <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ reviewBack }}\" style=\"font-size:13px;margin-top:var(--space-3)\">Back<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- add / break-down sheet -->\n    <sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:21;display:grid;place-items:end center;background:color-mix(in srgb,var(--color-neutral-900) 52%,transparent);animation:fadeBg .25s ease\">\n        <div class=\"review-sheet scr\" style=\"width:100%;max-height:88%;overflow-y:auto;background:var(--color-bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-6) var(--space-4);box-shadow:var(--shadow-lg);animation:rise .3s ease\">\n          <h3 style=\"margin:0 0 var(--space-4)\">{{ formTitleText }}<\u002Fh3>\n\n          <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n            <label>What is it?<\u002Flabel>\n            <input class=\"input\" value=\"{{ formTitle }}\" sc-camel-on-input=\"{{ setFormTitle }}\" placeholder=\"Finish computer networks\">\n          <\u002Fdiv>\n\n          <!-- Which part of your life this is. High in the sheet on purpose:\n               with work, office and study all in one app, the first thing you\n               know about a task is usually which of them it belongs to. -->\n          <sc-if value=\"{{ formIsTask }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>Badge<\u002Flabel><\u002Fdiv>\n            <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:var(--space-2)\">\n              <sc-for list=\"{{ formBadges }}\" as=\"fb\" hint-placeholder-count=\"4\">\n                <button class=\"reason-chip\" sc-camel-on-click=\"{{ fb.set }}\" style=\"padding:7px 12px;border-radius:var(--radius-md);border:1px solid {{ fb.border }};background:{{ fb.bg }};color:{{ fb.fg }};font-size:12px;font-family:var(--font-heading);font-weight:700;cursor:pointer\">{{ fb.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-2);margin-bottom:var(--space-4)\">\n              <input class=\"input\" value=\"{{ formBadgeDraft }}\" sc-camel-on-input=\"{{ setFormBadgeDraft }}\" aria-label=\"New badge name\" placeholder=\"New badge — Office, Home, Client…\" style=\"flex:1;font-size:14px\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ addFormBadge }}\" style=\"flex:none;padding-inline:var(--space-4)\">Add<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ formIsTask }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n              <label>What to do — optional<\u002Flabel>\n              <textarea class=\"input\" value=\"{{ formNote }}\" sc-camel-on-input=\"{{ setFormNote }}\" placeholder=\"Slow start, AIMD, fast recovery — then ten questions on it\" style=\"min-height:64px\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ formIsTask }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n              <label>{{ formDateLabel }}<\u002Flabel>\n              <input class=\"input\" type=\"date\" value=\"{{ formDate }}\" sc-camel-on-change=\"{{ setFormDate }}\">\n              <p class=\"text-muted\" style=\"font-size:12px;margin:5px 0 0\">{{ formDatePretty }}<\u002Fp>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ formCanChooseContribution }}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>How should this task work?<\u002Flabel><\u002Fdiv>\n              <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-2)\">\n                <button sc-camel-on-click=\"{{ chooseSingleDate }}\" style=\"flex:1;padding:10px 7px;border:1px solid {{ singleDateBorder }};border-radius:var(--radius-md);background:{{ singleDateBg }};color:{{ singleDateFg }};font-family:var(--font-heading);font-weight:700;font-size:12px;cursor:pointer\">Only on this date<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ chooseContribution }}\" style=\"flex:1;padding:10px 7px;border:1px solid {{ contributionBorder }};border-radius:var(--radius-md);background:{{ contributionBg }};color:{{ contributionFg }};font-family:var(--font-heading);font-weight:700;font-size:12px;cursor:pointer\">Needs regular contribution<\u002Fbutton>\n              <\u002Fdiv>\n              <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-4);line-height:1.4\">{{ contributionNote }}<\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ formContributionLocked }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:12px;margin:0 0 var(--space-4);padding:var(--space-3);border-radius:var(--radius-md);background:var(--card-lilac);color:var(--ink-lilac);line-height:1.4\">This is already a contribution plan. Its existing breakdown stays attached while you edit its details.<\u002Fp>\n            <\u002Fsc-if>\n\n            <!-- The other kind of repetition: a routine is a rhythm, this one\n                 has a deadline. The date above is the first one; the rule reads\n                 itself off it, so nothing is asked twice. -->\n            <sc-if value=\"{{ formCanRepeat }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>Does it come back?<\u002Flabel><\u002Fdiv>\n              <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-2)\">\n                <sc-for list=\"{{ formRepeats }}\" as=\"rp\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ rp.set }}\" style=\"flex:1;padding:10px 7px;border:1px solid {{ rp.border }};border-radius:var(--radius-md);background:{{ rp.bg }};color:{{ rp.fg }};font-family:var(--font-heading);font-weight:700;font-size:12px;cursor:pointer\">{{ rp.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-4);line-height:1.4\">{{ formRepeatNote }}<\u002Fp>\n              <sc-if value=\"{{ formRepeating }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <!-- Which weekdays a weekly rule lands on. Mon+Thu used to be\n                     two separate rules to write, edit, pause and delete. -->\n                <sc-if value=\"{{ formRepeatIsWeekly }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-bottom:var(--space-3)\">\n                  <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>Which days?<\u002Flabel><\u002Fdiv>\n                  <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-2)\">\n                    <sc-for list=\"{{ formWeekdays }}\" as=\"wd\" hint-placeholder-count=\"7\">\n                      <button sc-camel-on-click=\"{{ wd.toggle }}\" aria-label=\"{{ wd.full }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ wd.border }};border-radius:var(--radius-md);background:{{ wd.bg }};color:{{ wd.fg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer;transition:background .15s\">{{ wd.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <p class=\"text-muted\" style=\"font-size:12px;margin:0;line-height:1.4\">{{ formWeekdayNote }}<\u002Fp>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;gap:var(--space-3);margin-bottom:var(--space-3)\">\n                  <div class=\"field\" style=\"flex:1;margin:0\">\n                    <label>{{ formEveryLabel }}<\u002Flabel>\n                    <input class=\"input\" type=\"number\" min=\"1\" max=\"60\" step=\"1\" inputmode=\"numeric\" aria-label=\"{{ formEveryLabel }}\" value=\"{{ formRepeatEvery }}\" sc-camel-on-input=\"{{ setFormRepeatEvery }}\">\n                  <\u002Fdiv>\n                  <div class=\"field\" style=\"flex:1;margin:0\">\n                    <label>Days of notice<\u002Flabel>\n                    <input class=\"input\" type=\"number\" min=\"0\" max=\"28\" step=\"1\" inputmode=\"numeric\" aria-label=\"Days of notice\" value=\"{{ formRepeatLead }}\" sc-camel-on-input=\"{{ setFormRepeatLead }}\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <!-- When the rule stops. Empty is \"no end\", which is what every\n                     rule written before this field existed meant. -->\n                <div class=\"field\" style=\"margin-bottom:var(--space-2)\">\n                  <label>Repeat until — optional<\u002Flabel>\n                  <input class=\"input\" type=\"date\" aria-label=\"Repeat until\" value=\"{{ formRepeatUntil }}\" sc-camel-on-change=\"{{ setFormRepeatUntil }}\">\n                <\u002Fdiv>\n                <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-3);line-height:1.4\">{{ formRepeatUntilNote }}<\u002Fp>\n                <sc-if value=\"{{ formRepeatIsDaily }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"font-size:12px;margin:0 0 var(--space-4);padding:var(--space-3);border-radius:var(--radius-md);background:var(--card-lilac);color:var(--ink-lilac);line-height:1.4\">A daily repeat is work with a deadline: a missed one carries and counts against you. For a rhythm like the gym or a commute — something that is not a debt when you skip it — use a routine in Settings instead.<\u002Fp>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ formFromSeries }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:12px;margin:0 0 var(--space-4);padding:var(--space-3);border-radius:var(--radius-md);background:var(--card-lilac);color:var(--ink-lilac);line-height:1.4\">This one came from a repeat. Changing it here changes this occurrence only, the date included — move it to another day and the work moves while its deadline stays put, so the row still tells you what it was due. The rule itself lives under Repeating in Plan.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ formIsGoal }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n              <label>Deadline — optional<\u002Flabel>\n              <input class=\"input\" value=\"{{ formDeadline }}\" sc-camel-on-input=\"{{ setFormDeadline }}\" placeholder=\"11 Feb 2027\">\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ formIsTask }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n              <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>{{ formMinutesLabel }}<\u002Flabel><\u002Fdiv>\n              <div style=\"display:flex;gap:var(--space-2);align-items:center;margin-bottom:var(--space-4)\">\n                <input class=\"input\" type=\"number\" min=\"1\" step=\"5\" inputmode=\"numeric\" placeholder=\"minutes\" value=\"{{ formMinutes }}\" sc-camel-on-input=\"{{ setFormMinutes }}\" aria-label=\"Minutes\" style=\"flex:1\" disabled=\"{{ formInstant }}\">\n                <sc-if value=\"{{ formSingleDate }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button sc-camel-on-click=\"{{ toggleInstant }}\" style=\"flex:none;padding:11px 14px;border:1px solid {{ formInstantBorder }};border-radius:var(--radius-md);background:{{ formInstantBg }};color:{{ formInstantFg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer\">Instant<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <p class=\"text-muted\" style=\"font-size:12px;margin:-10px 0 var(--space-4);line-height:1.4\">{{ formMinutesNote }}<\u002Fp>\n              <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>Which session?<\u002Flabel><\u002Fdiv>\n              <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-4)\">\n                <sc-for list=\"{{ formBlocks }}\" as=\"fb\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ fb.set }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ fb.border }};border-radius:var(--radius-md);background:{{ fb.bg }};color:{{ fb.fg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer\">{{ fb.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ formSingleDate }}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n                  <label>Fixed time — makes it an event<\u002Flabel>\n                  <input class=\"input\" type=\"time\" value=\"{{ formAt }}\" sc-camel-on-change=\"{{ setFormAt }}\">\n                  <p class=\"text-muted\" style=\"font-size:12px;margin:5px 0 0;line-height:1.4\">Leave it blank for a task you fit in anywhere. Give it a time and it becomes an event pinned to that hour.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n            <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>Priority<\u002Flabel><\u002Fdiv>\n            <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-4)\">\n              <sc-for list=\"{{ formPriorities }}\" as=\"fp\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ fp.set }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ fp.border }};border-radius:var(--radius-md);background:{{ fp.bg }};color:{{ fp.fg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer\">{{ fp.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ formHasGoals }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div class=\"field\" style=\"margin-bottom:2px\"><label>Count this towards a goal?<\u002Flabel><\u002Fdiv>\n              <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-2);line-height:1.4\">Optional. Tagged tasks fill in that goal's progress bar on the Goals screen.<\u002Fp>\n              <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:var(--space-4)\">\n                <sc-for list=\"{{ formGoals }}\" as=\"fg\" hint-placeholder-count=\"2\">\n                  <button class=\"reason-chip\" sc-camel-on-click=\"{{ fg.set }}\" style=\"padding:6px 11px;border-radius:var(--radius-md);border:1px solid {{ fg.border }};background:{{ fg.bg }};color:{{ fg.fg }};font-size:12px;font-family:var(--font-heading);font-weight:700;cursor:pointer\">{{ fg.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ saveForm }}\">{{ formSaveLabel }}<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ closeForm }}\" style=\"font-size:13px\">Done for now<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- daily routine sheet -->\n    <sc-if value=\"{{ rf }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:21;display:grid;place-items:end center;background:color-mix(in srgb,var(--color-neutral-900) 52%,transparent);animation:fadeBg .25s ease\">\n        <div class=\"review-sheet scr\" style=\"width:100%;max-height:88%;overflow-y:auto;background:var(--color-bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-6) var(--space-4);box-shadow:var(--shadow-lg);animation:rise .3s ease\">\n          <h3 style=\"margin:0 0 var(--space-4)\">{{ rfHeading }}<\u002Fh3>\n          <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n            <label>What is it?<\u002Flabel>\n            <input class=\"input\" value=\"{{ rfTitle }}\" sc-camel-on-input=\"{{ setRfTitle }}\" placeholder=\"Badminton\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n            <label>Description — optional<\u002Flabel>\n            <textarea class=\"input\" value=\"{{ rfNote }}\" sc-camel-on-input=\"{{ setRfNote }}\" placeholder=\"Court 3, doubles with the group\" style=\"min-height:64px\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n            <label>How long? (minutes)<\u002Flabel>\n            <input class=\"input\" type=\"number\" min=\"1\" step=\"5\" inputmode=\"numeric\" placeholder=\"minutes\" value=\"{{ rfMinutes }}\" sc-camel-on-input=\"{{ setRfMinutes }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>Which session?<\u002Flabel><\u002Fdiv>\n          <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-4)\">\n            <sc-for list=\"{{ rfBlocks }}\" as=\"rb\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ rb.set }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ rb.border }};border-radius:var(--radius-md);background:{{ rb.bg }};color:{{ rb.fg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer\">{{ rb.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:var(--space-2)\"><label>Which days?<\u002Flabel><\u002Fdiv>\n          <div class=\"pill-row\" style=\"display:flex;gap:5px;margin-bottom:var(--space-6)\">\n            <sc-for list=\"{{ rfDays }}\" as=\"rd\" hint-placeholder-count=\"7\">\n              <button sc-camel-on-click=\"{{ rd.set }}\" style=\"flex:1;padding:10px 0;border:1px solid {{ rd.border }};border-radius:var(--radius-md);background:{{ rd.bg }};color:{{ rd.fg }};font-family:var(--font-heading);font-weight:700;font-size:13px;cursor:pointer\">{{ rd.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:2px\"><label>Only between these dates — optional<\u002Flabel><\u002Fdiv>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-2);line-height:1.4\">{{ rfPeriodNote }}<\u002Fp>\n          <div style=\"display:flex;gap:var(--space-3);margin-bottom:var(--space-6)\">\n            <div class=\"field\" style=\"flex:1;margin:0\">\n              <label>From<\u002Flabel>\n              <input class=\"input\" type=\"date\" value=\"{{ rfFrom }}\" sc-camel-on-change=\"{{ setRfFrom }}\">\n            <\u002Fdiv>\n            <div class=\"field\" style=\"flex:1;margin:0\">\n              <label>Until<\u002Flabel>\n              <input class=\"input\" type=\"date\" value=\"{{ rfTo }}\" sc-camel-on-change=\"{{ setRfTo }}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ saveRoutine }}\">Save routine<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ closeRoutineForm }}\" style=\"font-size:13px\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- new topic group -->\n    <sc-if value=\"{{ groupFormOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:21;display:grid;place-items:center;padding:var(--space-4);background:color-mix(in srgb,var(--color-neutral-900) 55%,transparent);animation:fadeBg .25s ease\">\n        <div style=\"width:100%;background:var(--color-bg);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-4);box-shadow:var(--shadow-lg);animation:popIn .3s ease\">\n          <h3 style=\"margin:0 0 var(--space-4)\">New subject<\u002Fh3>\n          <div class=\"field\" style=\"margin-bottom:var(--space-4)\">\n            <label>Subject<\u002Flabel>\n            <input class=\"input\" value=\"{{ groupFormName }}\" sc-camel-on-input=\"{{ setGroupName }}\" placeholder=\"Computer networks\">\n          <\u002Fdiv>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ saveGroup }}\">Create<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ closeGroupForm }}\" style=\"font-size:13px\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- image cropper -->\n    <sc-if value=\"{{ cropOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:24;background:var(--color-bg);display:flex;flex-direction:column;animation:fadeBg .2s ease\">\n        <div style=\"flex:none;padding:calc(var(--space-4) + env(safe-area-inset-top)) var(--space-4) var(--space-3)\">\n          <h4 style=\"margin:0\">Crop the image<\u002Fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:4px 0 0;line-height:1.4\">Drag to move, pinch to zoom. Only what is inside the square is saved.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;display:grid;place-items:center;padding:0 var(--space-4)\">\n          <div ref=\"{{ cropBox }}\" data-crop-frame=\"1\" style=\"width:100%;aspect-ratio:1/1;max-height:100%;position:relative;overflow:hidden;background:var(--color-neutral-200);touch-action:none;cursor:grab;outline:2px solid var(--color-accent);outline-offset:-1px\">\n            <img alt=\"\" data-crop-img=\"1\" draggable=\"false\" style=\"{{ cropImgStyle }}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom))\">\n          <sc-if value=\"{{ cropNeedsHeading }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"field\" style=\"margin-bottom:var(--space-3)\">\n              <label>Formula / Heading<\u002Flabel>\n              <input class=\"input\" value=\"{{ cropHeading }}\" sc-camel-on-input=\"{{ setCropHeading }}\" placeholder=\"Bayes' theorem\">\n              <p class=\"text-muted\" style=\"font-size:12px;margin:5px 0 0\">What the image is of. You see this first when the card comes back — the image is the answer.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:var(--space-2)\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cancelCrop }}\" style=\"flex:1\">Cancel<\u002Fbutton>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveCrop }}\" style=\"flex:1\">Save image<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- first open of the day: what is coming, in date order -->\n    <sc-if value=\"{{ digestOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <!-- Header and button are fixed and only the list scrolls. When the whole\n           card scrolled, a long list pushed the button past the fold and rows\n           clipped flush against the card's edge, which read as cropped. The\n           list also keeps its own inset so nothing touches the rounded corner. -->\n      <div style=\"position:absolute;inset:0;z-index:27;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:var(--space-6) var(--space-5);animation:fadeBg .2s ease\">\n        <div style=\"width:100%;max-width:330px;max-height:100%;display:flex;flex-direction:column;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);animation:rise .25s ease;overflow:hidden\">\n          <div style=\"flex:none;padding:var(--space-5) var(--space-5) var(--space-3)\">\n            <h4 style=\"margin:0 0 3px\">Coming up<\u002Fh4>\n            <p class=\"text-muted\" style=\"font-size:12px;margin:0;line-height:1.4\">{{ digestNote }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-height:0;overflow-y:auto;padding:0 var(--space-5)\">\n            <sc-for list=\"{{ digest }}\" as=\"dg\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:var(--space-3);align-items:baseline;padding:10px 0;border-top:1px solid var(--color-divider)\">\n                <span style=\"flex:none;width:46px;font-family:var(--font-heading);font-weight:700;font-size:12px;line-height:1.35;color:{{ dg.color }}\">{{ dg.when }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:14px;line-height:1.35\">{{ dg.title }}<\u002Fdiv>\n                  <div class=\"text-muted\" style=\"font-size:11px;margin-top:3px;line-height:1.35\">{{ dg.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex:none;padding:var(--space-3) var(--space-5) var(--space-5)\">\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ closeDigest }}\" style=\"margin:0\">Start the day<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- why a routine was skipped -->\n    <sc-if value=\"{{ skipOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:27;background:rgba(0,0,0,.45);display:grid;place-items:end center;animation:fadeBg .2s ease\">\n        <div class=\"sheet-panel\" style=\"width:100%;background:var(--color-bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-5) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom));box-shadow:var(--shadow-md);animation:rise .25s ease\">\n          <h4 style=\"margin:0 0 2px\">Skipping {{ skipTitle }}<\u002Fh4>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 var(--space-3);line-height:1.4\">A skip with a reason is worth more than a blank later. It will appear in your review and dashboard.<\u002Fp>\n          <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:var(--space-3)\">\n            <sc-for list=\"{{ skipReasons }}\" as=\"sr\" hint-placeholder-count=\"4\">\n              <button class=\"reason-chip\" sc-camel-on-click=\"{{ sr.pick }}\" style=\"padding:8px 12px;border-radius:var(--radius-pill);border:1px solid {{ sr.border }};background:{{ sr.bg }};color:{{ sr.fg }};font-size:12px;font-family:var(--font-heading);font-weight:700;cursor:pointer\">{{ sr.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <!-- The five chips are the common cases, not the only ones. The real\n               reason is often specific — \"power cut on site\", \"client called\" —\n               and a list that cannot hold it collects \"Something came up\",\n               which tells you nothing three weeks later. -->\n          <div class=\"field\" style=\"margin-bottom:var(--space-3)\">\n            <label>Or say it in your own words<\u002Flabel>\n            <input class=\"input\" value=\"{{ skipText }}\" sc-camel-on-input=\"{{ setSkipText }}\" aria-label=\"Your own reason\" placeholder=\"Power cut on site\" sc-camel-on-key-down=\"{{ skipKey }}\">\n          <\u002Fdiv>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ saveSkipText }}\">Save this reason<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ closeSkipForm }}\" style=\"font-size:13px\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- how to install, when the browser will not do it on our say-so -->\n    <sc-if value=\"{{ installHelpOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:26;background:rgba(0,0,0,.45);display:grid;place-items:end center;animation:fadeBg .2s ease\">\n        <div class=\"sheet-panel\" style=\"width:100%;background:var(--color-bg);border-top:2px solid var(--color-text);border-radius:var(--radius-md) var(--radius-md) 0 0;padding:var(--space-5) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom));box-shadow:var(--shadow-md);animation:rise .25s ease\">\n          <h4 style=\"margin:0 0 var(--space-2)\">{{ installHelpTitle }}<\u002Fh4>\n          <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-4);line-height:1.45\">{{ installHelpWhy }}<\u002Fp>\n          <sc-for list=\"{{ installHelpSteps }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:var(--space-3);align-items:baseline;padding:var(--space-2) 0;border-bottom:1px solid var(--color-divider)\">\n              <span style=\"flex:none;font-family:var(--font-heading);font-weight:700;font-size:13px;color:var(--color-accent)\">{{ st.n }}<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.4\">{{ st.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <p class=\"text-muted\" style=\"font-size:12px;margin:var(--space-3) 0 0;line-height:1.4;font-style:italic\">{{ installDiag }}<\u002Fp>\n          <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ closeInstallHelp }}\" style=\"margin-top:var(--space-3)\">Got it<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- back pressed on the dashboard: the next one leaves -->\n    <sc-if value=\"{{ confirmExit }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:26;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:var(--space-6);animation:fadeBg .2s ease\">\n        <div style=\"width:100%;max-width:320px;background:var(--color-bg);border:2px solid var(--color-text);border-radius:var(--radius-md);padding:var(--space-5) var(--space-4);box-shadow:var(--shadow-md);animation:rise .25s ease\">\n          <h4 style=\"margin:0 0 var(--space-2)\">Leave Task2Day?<\u002Fh4>\n          <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-4);line-height:1.45\">You are on the home screen, so going back again closes the app. Your work is saved to your account either way.<\u002Fp>\n          <div style=\"display:flex;gap:var(--space-2)\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ stayHere }}\" style=\"flex:1\">Stay<\u002Fbutton>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ leaveApp }}\" style=\"flex:1\">Leave<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- one dialog for every deletion. It names the thing and says what goes\n         with it, because \"Delete?\" answered honestly needs the consequence,\n         not just the verb. -->\n    <sc-if value=\"{{ confirmDeleteOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:29;display:grid;place-items:center;padding:var(--space-4);background:color-mix(in srgb,var(--color-neutral-900) 55%,transparent);animation:fadeBg .2s ease\">\n        <div class=\"sheet-panel\" style=\"width:100%;background:var(--color-bg);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-4);box-shadow:var(--shadow-lg);animation:popIn .25s ease\">\n          <h4 style=\"margin:0 0 var(--space-2)\">{{ confirmDeleteTitle }}<\u002Fh4>\n          <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 var(--space-4);line-height:1.45\">{{ confirmDeleteNote }}<\u002Fp>\n          <div style=\"display:flex;gap:var(--space-2)\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeConfirmDelete }}\" style=\"flex:1\">Keep it<\u002Fbutton>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ runConfirmDelete }}\" style=\"flex:1;background:var(--color-accent-2)\">{{ confirmDeleteLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasUndo }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;bottom:68px;left:var(--space-4);right:var(--space-4);background:var(--color-text);color:var(--color-bg);padding:10px var(--space-3);border-radius:var(--radius-md);font-size:13px;box-shadow:var(--shadow-md);z-index:23;animation:rise .3s ease;display:flex;align-items:center;gap:var(--space-3)\">\n        <span style=\"flex:1;min-width:0\">{{ undoLabel }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ takeUndo }}\" style=\"flex:none;background:none;border:0;padding:0;cursor:pointer;color:var(--color-bg);font-family:var(--font-heading);font-weight:700;font-size:13px;text-decoration:underline\">Undo<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"toast {{ toastClass }}\" style=\"position:absolute;bottom:{{ toastBottom }};top:{{ toastTop }};left:var(--space-4);right:var(--space-4);background:var(--color-text);color:var(--color-bg);padding:10px var(--space-3);border-radius:var(--radius-md);font-size:13px;box-shadow:var(--shadow-md);z-index:22;animation:rise .3s ease;text-align:center\">{{ toast }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:920}}\">\nconst REASONS=['Too tired','No time','Too hard','Just skipped'];\n/* Why a rhythm broke. Kept short — a list you scan, not one you read. */\nconst SKIP_REASONS=['Unwell','Travelling','No time','Rest day','Something came up'];\nconst INTERVALS=[1,3,7,21,45];\nconst DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\n\n/* The day's three sessions. \"Busy Hours\" is the middle one — set it to your\n   own in Settings; the app does not assume what fills it. The keys are what\n   stored tasks and hours are filed under, so they stay put when a label\n   changes. */\n/* One colour per session, so a glance at Today tells you which part of the\n   day you are looking at before you have read a word of it. */\n/* Five steps rather than a slider: a slider invites hunting for a value that\n   does not exist, and every one of these is legible. */\nconst TEXT_SCALES=[\n  {v:0.85, label:'S',  size:'12px'},\n  {v:1,    label:'M',  size:'14px'},\n  {v:1.12, label:'L',  size:'16px'},\n  {v:1.25, label:'XL', size:'18px'},\n  {v:1.4,  label:'XXL',size:'20px'},\n];\n\n/* 24px stroke glyphs, one path each so the whole set rides in a template\n   binding. fill:none, stroke:currentColor — colour is the only thing that\n   changes between the active tab and the rest. */\nconst NAV_ICONS={\n  dash:  'M3.5 10.6 12 3.6l8.5 7v9.3a1 1 0 0 1-1 1h-4.6v-6.4H9.1v6.4H4.5a1 1 0 0 1-1-1z',\n  today: 'M4.2 6.4h15.6v14H4.2zM4.2 10.6h15.6M8.4 3.4v4M15.6 3.4v4M9 15.2l2 2 4-4',\n  plan:  'M4.5 7h15M4.5 12h15M4.5 17h9',\n  revise:'M20 12a8 8 0 1 1-2.4-5.7M20.2 3.6v5h-5',\n  // a stroked gear and a ruled page, drawn on the same 24-grid as the rest\n  settings:'M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1',\n  log:'M6.5 3.4h11a1 1 0 0 1 1 1v15.2a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4.4a1 1 0 0 1 1-1M9 8h6M9 12h6M9 16h3',\n};\n\nconst BLOCK_SKIN={\n  morning:{bg:'var(--card-amber)',  ink:'var(--ink-amber)'},\n  noon:   {bg:'var(--card-sky)',    ink:'var(--ink-sky)'},\n  evening:{bg:'var(--card-violet)', ink:'var(--ink-violet)'},\n};\nconst BLOCKS=[\n  {key:'morning', label:'Morning'},\n  {key:'noon',    label:'Busy Hours'},\n  {key:'evening', label:'Evening'},\n];\n\n/* The person chooses a date and an intent, never a planning scope. A regular-\n   contribution target is the neutral root; its calendar runway determines the\n   month/week/day parts. Legacy month/week/day roots remain readable. */\nconst SCOPES=[\n  {key:'target',label:'Target',child:'month',childLabel:'periods'},\n  {key:'month', label:'Month', child:'week',  childLabel:'weeks'},\n  {key:'week',  label:'Week',  child:'day',   childLabel:'days'},\n  {key:'day',   label:'Day',   child:null,    childLabel:null},\n];\n\n/* ——— badges ———\n   The label that answers \"which part of my life is this?\" — my own work, the\n   office, a course. Goals are a horizon you are aiming at and most tasks have\n   none; a badge is a filing cabinet and most tasks want one, which is why it\n   sits at the top of the add sheet rather than at the bottom.\n\n   Colour is stored as an index into this list, never as a hex value: the two\n   themes need different inks for the same badge, and a token resolves per\n   theme while a stored colour cannot. */\nconst BADGE_TONES=[\n  {key:'violet', label:'Violet'}, {key:'mint',  label:'Mint'},\n  {key:'amber',  label:'Amber'},  {key:'rose',  label:'Rose'},\n  {key:'sky',    label:'Sky'},    {key:'lilac', label:'Lilac'},\n];\nconst badgeTone=i=>BADGE_TONES[((Number(i)||0)%BADGE_TONES.length+BADGE_TONES.length)%BADGE_TONES.length];\nconst badgeBg=i=>'var(--card-'+badgeTone(i).key+')';\nconst badgeFg=i=>'var(--ink-'+badgeTone(i).key+')';\n/* Three to start with, so the picker is never an empty row on a new account.\n   They are ordinary badges: rename-free, but deletable like any other. */\nconst defaultBadges=()=>[\n  {id:'b-personal', name:'Personal', tone:0},\n  {id:'b-office',   name:'Office',   tone:4},\n  {id:'b-study',    name:'Study',    tone:1},\n];\n\n/* Bump when the shape of persisted state changes, and always add the matching\n   MIGRATIONS step below so both cloud and offline snapshots arrive intact. */\nconst SCHEMA=7;\n/* A stamp you can read off the screen. Its whole job is answering \"is the\n   thing in my hand the thing that was deployed?\" — bump it with each build. */\nconst BUILD='2026-08-13.2';\n\n/* Installing is the browser's call, not ours: without a captured\n   `beforeinstallprompt` no script can put an app on a home screen. What we can\n   do is name the right menu item. The distinction matters — Chrome's \"Add to\n   Home screen\" *shortcut* and Safari's Add to Home Screen from a non-Safari\n   browser both drop a bookmark that opens in a browser tab, which is exactly\n   what an install is meant to avoid. */\nconst INSTALL_HELP={\n  ios:{\n    title:'Add Task2Day to your Home Screen',\n    why:'Safari does not let a page install itself, so this is two taps in the Share menu. Afterwards it opens full screen, with no browser bar.',\n    steps:['Tap the Share button — the square with the arrow out of it.',\n           'Scroll down and tap \"Add to Home Screen\".',\n           'Tap Add. Open Task2Day from the new icon, not from Safari.'],\n  },\n  iosOther:{\n    title:'Open this in Safari first',\n    why:'On iPhone only Safari can install a web app. Adding it from Chrome or another browser saves a bookmark that reopens in a browser tab.',\n    steps:['Copy this page’s link.',\n           'Open Safari and paste it in.',\n           'Tap Share, then \"Add to Home Screen\".'],\n  },\n  android:{\n    title:'Install Task2Day',\n    why:'Pick \"Install app\" in the browser menu. \"Add to Home screen\" makes a shortcut that reopens in a browser tab instead.',\n    steps:['Tap the ⋮ menu, top right of the browser.',\n           'Tap \"Install app\" — or \"Install Task2Day\" if it is offered.',\n           'Confirm Install, then open it from the new icon.'],\n  },\n  desktop:{\n    title:'Install Task2Day',\n    why:'Chrome and Edge show an install control in the address bar once a page qualifies. It has to be served over HTTPS for that to appear.',\n    steps:['Look for the install icon at the right of the address bar.',\n           'Or open the ⋮ menu and choose Install / Apps → Install this site.',\n           'It then opens in its own window rather than a tab.'],\n  },\n};\n/* ——— schema migrations ———\n   `loadCloud` used to discard anything not on the current SCHEMA and drop the\n   user into a fresh state — a silent wipe of a real account every time the\n   shape changed. Each step here moves one version forward and they run in\n   order, so an account three versions behind still arrives intact. Add a step\n   whenever you bump SCHEMA; never bump without one. */\nconst MIGRATIONS={\n  /* 1 -> 2: `day` was a counter and there were no real dates. Nothing can\n     recover which calendar day \"day 7\" meant, so dated work is dropped rather\n     than invented, and everything undated survives as today's. */\n  1:d=>({...d, schema:2,\n    tasks:(d.tasks||[]).filter(t=>!t.day).map(t=>({...t, date:t.date||''}))}),\n  /* 2 -> 3: sessions were office/home; they became morning/noon/evening. */\n  2:d=>({...d, schema:3,\n    tasks:(d.tasks||[]).map(t=>({...t,\n      block:{office:'noon', home:'evening', study:'morning'}[t.block]||t.block||'morning'}))}),\n  /* 3 -> 4: scoped tasks. A flat task with no scope is a day task. A block\n     no longer in BLOCKS is coerced too — a task filed under a session that\n     does not exist renders in none of them and is invisible rather than\n     merely misplaced. */\n  3:d=>({...d, schema:4,\n    tasks:(d.tasks||[]).map(t=>({...t, scope:t.scope||'day', parent:t.parent||null,\n      block: t.scope && t.scope!=='day' ? t.block\n        : (BLOCKS.some(b=>b.key===t.block) ? t.block\n           : ({office:'noon', home:'evening', study:'morning'}[t.block] || 'morning'))}))}),\n  /* 4 -> 5: history now preserves each skipped task, its reason and session.\n     Existing daily totals remain valid; the new fields start empty because a\n     reason that was discarded by an older build cannot be reconstructed. */\n  4:d=>({...d, schema:5,\n    history:Object.keys(d.history||{}).reduce((out,date)=>{\n      const h=d.history[date]||{};\n      out[date]={...h, skipped:h.skipped||0, skippedMinutes:h.skippedMinutes||0,\n        skips:Array.isArray(h.skips)?h.skips:[], byBlock:h.byBlock||{},\n        reviewed:h.reviewed===false?false:true,\n        satisfaction:Number.isFinite(h.satisfaction)?h.satisfaction:null,\n        routineTotal:h.routineTotal||0, routineDone:h.routineDone||0,\n        routineSkipped:h.routineSkipped||0,\n        routineSkips:Array.isArray(h.routineSkips)?h.routineSkips:[]};\n      return out;\n    },{})}),\n  /* 5 -> 6: repeating tasks. A series is a rule (\"the 11th of every month\");\n     the dated tasks it produces are ordinary day tasks carrying `seriesId`.\n     Nothing existing becomes a series, so the list starts empty. */\n  5:d=>({...d, schema:6, series:Array.isArray(d.series)?d.series:[]}),\n  /* 6 -> 7: badges — the label saying which part of your life a task belongs\n     to. Existing tasks keep no badge; the three starting badges are added so\n     the picker is never an empty row. */\n  6:d=>({...d, schema:7,\n    badges:Array.isArray(d.badges)&&d.badges.length?d.badges:defaultBadges()}),\n};\nconst migrate=data=>{\n  let d=data, guard=0;\n  while(d && d.schema<SCHEMA && MIGRATIONS[d.schema] && guard++<20){\n    try{ d=MIGRATIONS[d.schema](d); }catch(e){ return data; }\n  }\n  return d;\n};\n\nconst PERSIST_KEYS=['schema','theme','office','hours','capacity','revisionOn','freqMin',\n  'notifyOn','reminderTime','streak','freezes','freezeMax','streakBest','dailyCap','streakSettled','textScale','lastDigest',\n  'recallFrom','recallTo',\n  'groups','cards','tasks','routines','series','badges','history','goals','lastRoll'];\n\n/* ——— offline state store ———\n   The service worker makes the app shell available offline; this store makes\n   the user's actual work available too. One record holds the most recently\n   signed-in account, its complete PERSIST_KEYS snapshot and whether that\n   snapshot still needs to reach Firebase. IndexedDB is the primary store;\n   localStorage is a small-browser fallback, not a second source of truth. */\nconst OFFLINE_DB='climbup-offline';\nconst OFFLINE_STORE='state';\nconst OFFLINE_KEY='current';\nconst OFFLINE_FALLBACK='sp.offlineState';\nconst offlineDb=()=>new Promise((resolve,reject)=>{\n  if(typeof indexedDB==='undefined'){ reject(new Error('IndexedDB unavailable')); return; }\n  const req=indexedDB.open(OFFLINE_DB,1);\n  req.onupgradeneeded=()=>{\n    const db=req.result;\n    if(!db.objectStoreNames.contains(OFFLINE_STORE)) db.createObjectStore(OFFLINE_STORE);\n  };\n  req.onsuccess=()=>resolve(req.result);\n  req.onerror=()=>reject(req.error||new Error('IndexedDB failed'));\n});\nconst offlineFallbackRead=()=>{\n  try{ return JSON.parse(localStorage.getItem(OFFLINE_FALLBACK)||'null'); }\n  catch(e){ return null; }\n};\nconst offlineFallbackWrite=record=>{\n  try{\n    if(record==null) localStorage.removeItem(OFFLINE_FALLBACK);\n    else localStorage.setItem(OFFLINE_FALLBACK, JSON.stringify(record));\n    return true;\n  }catch(e){ return false; }\n};\nconst offlineRead=()=>offlineDb().then(db=>new Promise((resolve,reject)=>{\n  const tx=db.transaction(OFFLINE_STORE,'readonly');\n  const req=tx.objectStore(OFFLINE_STORE).get(OFFLINE_KEY);\n  req.onsuccess=()=>{ db.close(); resolve(req.result||null); };\n  req.onerror=()=>{ db.close(); reject(req.error); };\n})).catch(()=>offlineFallbackRead());\nconst offlineWrite=record=>offlineDb().then(db=>new Promise((resolve,reject)=>{\n  const tx=db.transaction(OFFLINE_STORE,'readwrite');\n  if(record==null) tx.objectStore(OFFLINE_STORE).delete(OFFLINE_KEY);\n  else tx.objectStore(OFFLINE_STORE).put(record,OFFLINE_KEY);\n  tx.oncomplete=()=>{ db.close(); resolve(true); };\n  tx.onerror=()=>{ db.close(); reject(tx.error); };\n})).catch(()=>offlineFallbackWrite(record));\n\n/* An absent key and a key set to undefined are the same thing to JavaScript\n   and two different things to Firebase: the first is simply missing, the\n   second is a value it refuses to store. Dropping the key is the honest\n   translation — that is what the code meant in every case. Inside an array\n   the slot is kept as null instead, because removing it would renumber every\n   id-bearing entry after it. */\nconst stripUndefined=value=>{\n  if(Array.isArray(value)) return value.map(v=>v===undefined?null:stripUndefined(v));\n  if(value && typeof value==='object'){\n    const out={};\n    Object.keys(value).forEach(k=>{\n      if(value[k]===undefined) return;\n      out[k]=stripUndefined(value[k]);\n    });\n    return out;\n  }\n  return value;\n};\n\nconst mins=hhmm=>{ const p=String(hhmm||'0:0').split(':').map(Number); return (p[0]||0)*60+(p[1]||0); };\n/* \"every 25 minutes\", \"every 2 hours\", \"every 1 hour 30 minutes\" */\nconst freqWords=m=>{\n  const h=Math.floor(m/60), r=m%60;\n  const H=h?(h+(h===1?' hour':' hours')):'', R=r?(r+' minutes'):'';\n  return (H&&R)?(H+' '+R):(H||R||'0 minutes');\n};\nconst span=(from,to)=>Math.max(0, mins(to)-mins(from));\n\n/* ——— Real dates ———\n   `day` used to be a counter and there was no calendar at all, which made\n   every dated thing here impossible: a target date to aim at, a routine that\n   knows which weekday it is, work that rolls forward when a day actually ends,\n   a month grid with anything marked on it. Everything below is local-time and\n   ISO 'YYYY-MM-DD' keyed — never Date.toISOString(), which converts to UTC and\n   lands on the wrong day for anyone east or west of Greenwich. */\nconst iso=d=>{\n  const p=n=>String(n).padStart(2,'0');\n  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());\n};\nconst parseISO=s=>{ const p=String(s||'').split('-').map(Number);\n  return new Date(p[0]||1970, (p[1]||1)-1, p[2]||1); };\nconst todayISO=()=>iso(new Date());\nconst addDays=(s,n)=>{ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };\nconst daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);\n/* Monday-based, to match the DAYS strip. */\nconst dowIndex=s=>{ const d=parseISO(s).getDay(); return (d+6)%7; };\nconst startOfWeek=s=>addDays(s, -dowIndex(s));\nconst WEEKDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\nconst MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];\n/* DD/MM/YYYY, everywhere a date is shown. It was \"26 Jul\", with the year\n   appearing only when it was not this one — compact, but two formats to read\n   and ambiguous the moment a year rolls over. One format, always four-digit,\n   is worth the extra characters. Every display goes through here, so this is\n   the only place to change it.\n\n   The one thing it does NOT control is `<input type=\"date\">`. Browsers render\n   those in the device's own locale and no CSS or script can override it; on a\n   phone set to India or the UK it already reads DD/MM/YYYY. */\nconst pad2=n=>String(n).padStart(2,'0');\nconst prettyDate=s=>{ if(!s) return ''; const d=parseISO(s);\n  return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear(); };\n\n/* An empty week still needs its seven bars or the chart has nothing to draw. */\nconst emptyWeek=()=>DAYS.map(d=>({d, planned:0, done:0, office:d!=='Sat'&&d!=='Sun'}));\n\n/* ——— repeating tasks ———\n   A series is the rule (\"the 11th of every month, give me two days' notice\");\n   what it produces are ordinary dated day tasks that carry `seriesId` and the\n   `dueDate` the rule aimed at. Keeping the rule and the work apart is what lets\n   an occurrence be edited, skipped, carried or deleted without touching the\n   next one — and lets the deadline stay fixed while the task itself carries. */\nconst HORIZON_DAYS=70;           // how far ahead occurrences are filed\nconst MAX_OCCURRENCES=24;        // a guard, so a broken rule cannot fill the year\nconst daysInMonth=(y,m)=>new Date(y, m+1, 0).getDate();\n/* The 31st of a 30-day month is that month's last day, not the 1st of the\n   next: a monthly deadline never leaves its own month. */\nconst monthDate=(y,m,day)=>{\n  const norm=new Date(y, m, 1);\n  return iso(new Date(norm.getFullYear(), norm.getMonth(),\n    Math.min(Math.max(1, day||1), daysInMonth(norm.getFullYear(), norm.getMonth()))));\n};\nconst seriesDueDates=(sr,from,to)=>{\n  const out=[];\n  if(!sr) return out;\n  const every=Math.max(1, Number(sr.every)||1);\n  const stop = sr.until && sr.until<to ? sr.until : to;\n  if(stop<from) return out;\n  if(sr.unit==='day'){\n    /* Every day, or every N days. The anchor fixes the phase, so \"every third\n       day 'none';\n      if(navigator.vibrate) navigator.vibrate(12);\n    };\n\n    const onDown=e=>{\n      if(drag) return;\n      if(e.pointerType==='mouse' && e.button!==0) return;\n      if(!e.target.closest) return;\n      if(e.target.closest('button')) return;   // the tick, Focus and delete are taps\n      const row=e.target.closest('[data-drag=\"1\"]');\n      if(!row) return;\n      press={id:row.dataset.id, list:row.dataset.list,\n        x:e.clientX, y:e.clientY, timer:setTimeout(begin, LONG_PRESS)};\n    };\n    const onMove=e=>{\n      if(press && !drag){\n        if(Math.abs(e.clientY-press.y)>SLOP||Math.abs(e.clientX-press.x)>SLOP) clearPress();\n        return;\n      }\n      if(!drag) return;\n      drag.lastY=e.clientY;\n      place(e.clientY);\n      const sc=document.querySelector('.scr');\n      if(sc){\n        const b=sc.getBoundingClientRect();\n        edge = e.clientY<b.top+EDGE ? -8 : e.clientY>b.bottom-EDGE ? 8 : 0;\n        if(edge && !raf) raf=requestAnimationFrame(autoScroll);\n      }\n    };\n    const finish=()=>{\n      clearPress();\n      if(!drag) return;\n      const ids=drag.ids.slice();\n      ids.splice(drag.to, 0, ids.splice(drag.from,1)[0]);\n      const moved=drag.from!==drag.to;\n      drag.rows.forEach(r=>{\n        r.style.transition=''; r.style.transform=''; r.style.willChange='';\n        r.style.position=''; r.style.zIndex=''; r.style.background=''; r.style.boxShadow='';\n      });\n      document.body.style.userSelect='';\n      if(raf){ cancelAnimationFrame(raf); raf=0; }\n      edge=0; drag=null; this._dragging=false;\n      if(moved){ this.reorder(ids); if(navigator.vibrate) navigator.vibrate(8); }\n    };\n\n    document.addEventListener('pointerdown', onDown, true);\n    document.addEventListener('pointermove', onMove, true);\n    document.addEventListener('pointerup', finish, true);\n    document.addEventListener('pointercancel', finish, true);\n    // pointermove's preventDefault does not stop a scroll; touchmove's
